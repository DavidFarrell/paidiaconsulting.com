<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ECGBL 2026 Programme</title>
<meta name="description" content="Interactive programme for ECGBL 2026, the 20th European Conference on Games Based Learning, TU Darmstadt, 30 Sep - 2 Oct 2026.">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c84630'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --surface-2: #f2eee8;
  --ink: #1a1a1a;
  --muted: #6b6560;
  --faint: #a39c94;
  --line: #e6e0d8;
  --accent: #c84630;
  --accent-ink: #ffffff;
  --accent-soft: #fbe9e4;
  --now: #c84630;
  --gold: #b7791f;
  --gold-soft: #fdf3e1;
  --shadow: 0 1px 2px rgba(40,30,20,.06), 0 4px 14px rgba(40,30,20,.05);
  --r051: #2f6f9f; --r052: #2e8b6a; --r053: #8a5bb5; --r21: #b5671f; --r146: #b03a6f; --r18: #4a6a2a; --rx: #6b6560;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16130f; --surface: #201c17; --surface-2: #2a251f; --ink: #f1ece4; --muted: #b1a89c; --faint: #7d756b;
    --line: #3a332b; --accent: #e8664c; --accent-ink: #1a0f0b; --accent-soft: #3a211a; --now: #ff7a5c;
    --gold: #e0a84a; --gold-soft: #33280f; --shadow: 0 1px 2px rgba(0,0,0,.3);
    --r051: #6aa8d8; --r052: #5cc29c; --r053: #b892e0; --r21: #e09a55; --r146: #e07aa6; --r18: #94bf63; --rx: #b1a89c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16130f; --surface: #201c17; --surface-2: #2a251f; --ink: #f1ece4; --muted: #b1a89c; --faint: #7d756b;
  --line: #3a332b; --accent: #e8664c; --accent-ink: #1a0f0b; --accent-soft: #3a211a; --now: #ff7a5c;
  --gold: #e0a84a; --gold-soft: #33280f; --shadow: 0 1px 2px rgba(0,0,0,.3);
  --r051: #6aa8d8; --r052: #5cc29c; --r053: #b892e0; --r21: #e09a55; --r146: #e07aa6; --r18: #94bf63; --rx: #b1a89c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

/* ---------- header ---------- */
.top { padding-top: 18px; padding-bottom: 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand h1 { font: 700 26px/1.1 "Source Serif 4", Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.clock { text-align: right; flex: none; }
.clock .t { font: 600 22px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
.clock .z { color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; }
.clock.sim .t { color: var(--gold); }

.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding-top: 8px; padding-bottom: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 550; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--now); margin-left: 5px; vertical-align: 2px; }
@media (max-width: 640px) {
  .bar .wrap { gap: 6px; }
  .brand p { font-size: 12px; }
  .clock .t { font-size: 20px; }
  .clock .z { font-size: 10px; }
  .seg { width: 100%; }
  .seg button { flex: 1; padding: 7px 4px; font-size: 13.5px; }
  .brand h1 { font-size: 22px; }
}

/* ---------- views ---------- */
main { padding: 14px 0 80px; }
.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 6px 0 12px; }
.view-head h2 { font: 700 19px/1.2 "Source Serif 4", Georgia, serif; margin: 0; }
.view-head .sub { color: var(--muted); font-size: 13px; }

/* scrubber */
.scrub { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
.scrub-row { display: flex; align-items: center; gap: 12px; }
.scrub-time { font: 650 28px/1 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; min-width: 92px; }
.scrub-meta { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; }
.live-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.live-btn.on { background: var(--now); border-color: var(--now); color: var(--accent-ink); }
.live-btn.on::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
input[type=range] { width: 100%; margin: 12px 0 2px; accent-color: var(--accent); height: 28px; }
.ticks { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.jump { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
.jump::-webkit-scrollbar { display: none; }
.jump button { flex: none; }
.jump button.cur { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.jump button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.jump button:hover { color: var(--ink); border-color: var(--faint); }

.section-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.section-label .n { background: var(--surface-2); border-radius: 999px; padding: 1px 8px; font-weight: 600; letter-spacing: 0; }

.mine { display: grid; gap: 8px; margin-bottom: 6px; }
.mine-item { display: flex; align-items: center; gap: 12px; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.mine-item .when { font: 650 14px/1.2 ui-monospace, "SF Mono", Menlo, monospace; min-width: 52px; }
.mine-item .what { flex: 1; min-width: 0; }
.mine-item .what b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mine-item .what span { color: var(--muted); font-size: 13px; }
.mine-item .eta { font-size: 12.5px; font-weight: 650; color: var(--gold); white-space: nowrap; }

.banner { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 10px 14px; color: var(--muted); font-size: 14px; margin: 8px 0; }
.banner b { color: var(--ink); font-weight: 650; }
.banner .bt { font: 600 13px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }

.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }

/* schedule */
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.search { flex: 1 1 260px; position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px 10px 34px; font-size: 16px; }
.search input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; max-width: 100%; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.slot { display: grid; grid-template-columns: 62px 1fr; gap: 0 12px; padding: 10px 0; border-top: 1px solid var(--line); scroll-margin-top: 70px; }
.slot.past { opacity: .55; }
.slot.past:hover { opacity: 1; }
.slot-time { font: 650 15px/1.2 ui-monospace, "SF Mono", Menlo, monospace; padding-top: 10px; font-variant-numeric: tabular-nums; }
.slot-time small { display: block; color: var(--faint); font-weight: 500; font-size: 11.5px; margin-top: 3px; }
.slot.live .slot-time { color: var(--now); }
.nowline { display: flex; align-items: center; gap: 8px; color: var(--now); font: 700 12px ui-monospace, "SF Mono", Menlo, monospace; margin: 2px 0; scroll-margin-top: 90px; }
.nowline::after { content: ""; flex: 1; height: 2px; background: var(--now); border-radius: 2px; }
@media (max-width: 640px) {
  .slot { grid-template-columns: 1fr; }
  .slot-time { padding: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  .slot-time small { display: inline; margin: 0; }
  .grid { grid-template-columns: 1fr; }
}

/* card */
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 80px; min-width: 0; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--room, var(--rx)); }
.card.live { border-color: color-mix(in srgb, var(--now) 60%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--now) 40%, transparent), var(--shadow); }
.card.paidia { background: linear-gradient(0deg, var(--gold-soft), var(--gold-soft)); border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); }
.card.span { background: var(--surface-2); box-shadow: none; }
.card-btn { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 11px 12px 11px 16px; cursor: pointer; }
.card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-right: 34px; }
.room { font-weight: 700; color: var(--room, var(--rx)); }
.badge { border-radius: 5px; padding: 1px 6px; font-size: 11px; font-weight: 650; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.k { background: var(--accent-soft); color: var(--accent); }
.badge.g { background: color-mix(in srgb, var(--r18) 16%, transparent); color: var(--r18); }
.badge.y { background: var(--gold); color: #fff; }
.badge.now { background: var(--now); color: var(--accent-ink); }
.card-title { font-weight: 650; font-size: 15px; line-height: 1.3; margin-top: 5px; }
.card-auth { color: var(--muted); font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.card-stream { color: var(--room, var(--muted)); font-size: 12px; font-weight: 650; margin-top: 5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.streams { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; margin: 14px 0 6px; box-shadow: var(--shadow); }
.streams-h { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
.streams-h span { font: 600 12px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0; text-transform: none; }
.streams-grid { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.stream { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 0; border-left: 4px solid var(--room, var(--rx)); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; font-size: 13px; line-height: 1.3; cursor: pointer; width: 100%; }
.stream b { color: var(--room, var(--rx)); white-space: nowrap; flex: none; width: 74px; }
.stream span { color: var(--ink); font-weight: 550; }
.stream em { display: block; color: var(--muted); font-style: normal; font-size: 12px; font-weight: 400; margin-top: 2px; }
.stream[aria-pressed="true"] { outline: 2px solid var(--room); }
@media (max-width: 640px) { .streams-grid { grid-template-columns: 1fr; } }
.card.open .card-auth { -webkit-line-clamp: unset; display: block; }
.star { position: absolute; top: 6px; right: 6px; border: 0; background: transparent; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; color: var(--faint); display: grid; place-items: center; }
.star:hover { background: var(--surface-2); }
.star[aria-pressed="true"] { color: var(--gold); }
.star svg { width: 18px; height: 18px; }
.detail { display: none; padding: 0 14px 14px 16px; font-size: 14px; }
.card.open .detail { display: block; }
.detail .abs { white-space: pre-line; line-height: 1.55; margin: 4px 0 10px; }
.detail .none { color: var(--muted); font-style: italic; margin: 4px 0 10px; }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 10px; font-size: 13px; }
.detail dt { color: var(--faint); }
.detail dd { margin: 0; color: var(--muted); }
.kw { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 10px; }
.kw span { font-size: 12px; background: var(--surface-2); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.links a, .links button { font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); cursor: pointer; color: var(--accent); }

details.more { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
details.more summary { cursor: pointer; padding: 11px 14px; font-weight: 600; font-size: 14px; }
details.more .grid { padding: 0 10px 10px; }

.empty { color: var(--muted); text-align: center; padding: 40px 10px; }
.hl { background: color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 3px; padding: 0 1px; }

/* info */
.info { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.info section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.info h3 { margin: 0 0 6px; font: 700 16px/1.3 "Source Serif 4", Georgia, serif; }
.info p { margin: 6px 0; color: var(--muted); font-size: 14px; }
.info ul { margin: 6px 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.foot { color: var(--faint); font-size: 12px; margin-top: 30px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header class="wrap top">
  <div class="brand">
    <h1>ECGBL 2026</h1>
    <p>20th European Conference on Games Based Learning · TU Darmstadt</p>
  </div>
  <div class="clock" id="clock"><div class="t" id="clockT">--:--</div><div class="z" id="clockZ">Darmstadt</div></div>
</header>

<nav class="bar" aria-label="Programme navigation">
  <div class="wrap">
    <div class="seg" id="views" role="group" aria-label="View">
      <button data-view="now">Now</button>
      <button data-view="schedule">Schedule</button>
      <button data-view="starred">Starred</button>
      <button data-view="info">Info</button>

    <div class="seg" id="days" role="group" aria-label="Day">
      <button data-day="2026-09-30">Wed 30</button>
      <button data-day="2026-10-01">Thu 1</button>
      <button data-day="2026-10-02">Fri 2</button>
    </div>
  </div>
</nav>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = [{"day":"2026-09-30","start":"10:00","end":"16:00","room":"Lobby Area of S306","stream":"","chair":"","type":"showcase","title":"PlayDay - Come and play educational games and talk to the developers","authors":"","code":"","flags":[],"id":"30-1000-LobbyAreaofS306-0","related":[]},{"day":"2026-09-30","start":"10:00","end":"16:00","room":"S3/20-4","stream":"","chair":"","type":"workshop","title":"Developing Educational Games Interactive Workshop","authors":"","code":"","flags":[],"id":"30-1000-S320-4-1","related":[]},{"day":"2026-09-30","start":"10:00","end":"16:00","room":"S3/20-5","stream":"","chair":"","type":"workshop","title":"Educational Escape Rooms Interactive Workshop","authors":"","code":"","flags":[],"id":"30-1000-S320-5-2","related":[]},{"day":"2026-09-30","start":"18:00","end":"19:00","room":"T.H.E Darmstadt Hotel, Kasinostr. 6, Darmstadt, 64293, Germany","stream":"","chair":"","type":"social","title":"Pre-conference Registration and Welcome Drink","authors":"","code":"","flags":[],"id":"30-1800-T.H.EDarmstadtHotel,Kasinostr.6,Darmstadt,64293,Germany-3","related":[]},{"day":"2026-10-01","start":"08:30","end":"09:00","room":"","stream":"","chair":"","type":"social","title":"Registration and Coffee","authors":"","code":"","flags":[],"id":"01-0830-all-4","related":[]},{"day":"2026-10-01","start":"09:00","end":"09:15","room":"051","stream":"","chair":"","type":"plenary","title":"Welcome and Opening of the Conference","authors":"","code":"","flags":[],"id":"01-0900-051-5","related":[]},{"day":"2026-10-01","start":"09:15","end":"10:00","room":"051","stream":"","chair":"","type":"keynote","title":"Keynote Presentation: Extended Reality Training: New Opportunities for Physical Activity Promotion","authors":"Anna Lisa Martin-Niedecken","code":"","flags":[],"id":"01-0915-051-6","related":[]},{"day":"2026-10-01","start":"10:20","end":"10:40","room":"051","stream":"Stream A: GBL and Children","chair":"Sarah von Styp Rekowski","type":"paper","title":"Exploring Teachers' and First-grade Students' Perceptions of a Game Friendly School Project in a Primary School Context","authors":"Merve Kara and Enisa Mede, Bahcesehir University, Istanbul, Turkey","code":"GBL-020","flags":[],"abstract":"Games and play-based learning environments are increasingly recognised as valuable for supporting student engagement, social interaction, and positive school experiences. However, fewer studies have examined how school-wide game-friendly initiatives are experienced in early primary school contexts. This qualitative case study explored teachers’ and students’ perceptions of the Game Friendly School (GFS) project implemented in a private K–12 school in Türkiye. The project had been in place for approximately one year and included game-friendly arrangements in corridors and outdoor areas, such as wall games, mini basketball hoops, tic-tac-toe, table football, board games, floor tracks, playground markings, sports areas, and recycled-material goals. Data were collected from five first-grade teachers through an open-ended questionnaire and from 98 first-grade students through drawings and short written narratives. Teacher responses were analysed through thematic analysis, while student artefacts were analysed through content analysis. The findings suggest that the GFS project was perceived as supporting enjoyment, peer interaction, collaboration, and a positive school atmosphere. Teachers also highlighted age-appropriate design and safety considerations. Student drawings and narratives reflected play, friendship, movement, and happiness at school. The study offers contextual insight into how a school-wide game-friendly environment was experienced in one primary school setting.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/4890","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/4890/4845","match":1.0,"id":"01-1020-051-7","related":[]},{"day":"2026-10-01","start":"10:20","end":"10:40","room":"052","stream":"Stream B: STEM","chair":"Micaela Fonseca","type":"paper","title":"Quantum Taboo: A Game-based Approach to Exploring Quantum Concepts","authors":"Simona de Luca, Antigone Marino, National Research Council, Naples, Italy and Sara Rosaria di Nuzzo, Ministero dell'Istruzione e del Merito, Naples, Italy","code":"","flags":["uncertain"],"id":"01-1020-052-13","related":[]},{"day":"2026-10-01","start":"10:20","end":"10:40","room":"053","stream":"Stream C: Mini Track on Educational Escape Rooms","chair":"Panagiotis Fotaris","type":"paper","title":"From Measurement to Meaning: A High-Tech Instrument Escape Game for STEAM Education","authors":"Frank Gfeller and Alfred Steinbach, St.Gallen University of Teacher Education, Switzerland","code":"GBL-105","flags":["presentation only"],"id":"01-1020-053-19","related":[]},{"day":"2026-10-01","start":"10:20","end":"10:40","room":"146","stream":"Stream D: Mini Track on Game-based Learning for Lifelong Learning","chair":"Martin Steinicke","type":"paper","title":"What Makes a Video Game \"Good\"? A Case Study with Secondary Students","authors":"Jorge Oceja, Purificación Martínez and Santos Urbina, Universitat de les Illes Balears, Palma, Spain","code":"GBL-114","flags":[],"abstract":"Video games are a central part of youth culture, yet their educational use often relies on adult assumptions about students’ gaming practices. This study explores lower secondary students’ video game preferences and the criteria they use to define what makes a video game “good”. A questionnaire was administered to 301 students aged 12–16 from two secondary schools in northern Spain. Results show a strong concentration of preferences around mainstream commercial games, especially Fortnite, FIFA and Roblox, as well as clear gender differences in preferred titles. Boys more frequently selected competitive, sports-oriented and action-based multiplayer games, whereas girls showed a broader distribution across social, casual, simulation and sandbox games. Students rated audiovisual and technical quality and gameplay higher than narrative, with boys assigning significantly greater importance to technical quality and gameplay than girls. These findings suggest that students’ video game literacy is shaped by mainstream gaming cultures, gendered forms of participation and unequal exposure to different kinds of games. The study provides a diagnostic basis for designing educational interventions with commercial and independent video games that expand students’ critical, cultural and interpretive understanding of the medium.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5511","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5511/4869","match":1.0,"id":"01-1020-146-34","related":[]},{"day":"2026-10-01","start":"10:20","end":"10:40","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Rajiv Basaiawmoit and Katharina Fohrmann","type":"games-judging","title":"Interactive Signalling Laboratory","authors":"Martin Scheidt, Hochschule Darmstadt, Germany","code":"Game-007","flags":["+GBL-008 Fri"],"id":"01-1020-18-138","related":["02-0900-053-89"]},{"day":"2026-10-01","start":"10:20","end":"10:40","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Guido Bruinsma and Lisa Baule","type":"games-judging","title":"CiFoS game","authors":"Federico Andreotti and Demi Hordijk, Wageningen University, the Netherlands","code":"Game-081","flags":[],"id":"01-1020-18-144","related":[]},{"day":"2026-10-01","start":"10:20","end":"10:40","room":"18","stream":"Game Judging: Fully developed games (judging panel 3)","chair":"Judges: Taru Deva and Geeske Kemper","type":"games-judging","title":"The Learn Arena","authors":"Stefan Pietrusky, Learning Level Up, Down Church Studio, Germany","code":"Game-013","flags":[],"id":"01-1020-18-150","related":[]},{"day":"2026-10-01","start":"10:20","end":"10:30","room":"21","stream":"Stream D: PhD and Masters Colloquium Track","chair":"","type":"phd","title":"Theory-Informed Design of a Location-Based Game for Language Learning","authors":"Donald Richardson, University of St Andrews, Scotland","code":"GBL-003","flags":["PhD"],"abstract":"Despite the considerable educational potential of location-based games for language learning, their design often lacks a robust theoretical framework. In the absence of such a basis, it is difficult to systematically determine the specific design elements that facilitate meaningful target-language use. This study explores the applicability of the Funnel Model, a grounded theory framework organised around four dimensions: affective engagement, spatial immersion, role-play, and collaboration. Originally developed through an inductive study, the model is applied here as a deductive framework to inform the design and structure the analysis of a new location-based game for learning English, Gnomegress . Twenty advanced learners participated in the game, using the TaleBlazer mobile app to trigger video-based tasks at local landmarks. Qualitative data, comprising their written and audio reflections , were analysed using deductive thematic analysis to examine the extent to which the model's dimensions influenced active language use. This is understood here as the unscripted, task-oriented use of the target language required to complete the activity. Furthermore, fifty student-produced videos were reviewed to contextualise and supplement the findings. The results indicate that learner engagement and perceived target-language production appear to be associated with the degree of alignment between the model’s four dimensions. Higher levels of immersion and output were reported when tasks and the game narrative were coherently integrated with the physical location. Conversely, technical issues and weak spatial alignment occasionally interrupted the convergence of these dimensions, leading to a reduction in active language use. As a small-scale pilot study, the findings suggest that the Funnel Model offers a useful theoretical lens for the design and analysis of location-based games and activities for language learning. By using the model's four dimensions, designers may be able to refine future activities to better support target-language production in outdoor settings.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/4893","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/4893/4914","match":1.0,"id":"01-1020-21-25","related":[]},{"day":"2026-10-01","start":"10:30","end":"10:40","room":"21","stream":"Stream D: PhD and Masters Colloquium Track","chair":"","type":"phd","title":"Scaffolded Game-based Simulation Design for Conceptual-Operational Transition in Railway Education","authors":"Jiaming Liu, TU Braunschweig, Bijan Khosrawi-Rad, Leuphana University Lüneburg, Ricarda Schlimbach, Hochschule Heilbronn and Jörn Pachl, TU Braunschweig, Germany","code":"GBL-062","flags":["PhD"],"abstract":"Game-based learning (GBL) has gained increasing attention in engineering education due to its potential to foster learner engagement. However, its pedagogical integration in railway education remains limited. Current digital learning environments in this domain largely rely on high-fidelity systems originally developed for professional operational training. Consequently, they focus primarily on procedural skill acquisition. While these systems provide valuable opportunities for operational training, they offer limited support for developing conceptual understanding before learners engage with complex system interactions. This leaves a gap between theoretical learning and practical application. This study examines the role of game-based approaches in railway and related transport contexts and explores their potential to address this learning gap. To this end, a structured review of existing applications was conducted. Drawing on established frameworks from GBL and gamification research, the analysis identified recurring design patterns and key functional characteristics. The findings indicate that game-based applications in the transport domain remain limited and are primarily used for purposes such as awareness raising or data elicitation rather than conceptual learning. Compared with conventional high-fidelity simulations, more game-oriented applications tend to incorporate staged complexity, bounded decision-making, and explicit feedback. These features are consistent with scaffolding principles but are rarely discussed in terms of helping learners progress from conceptual understanding to operational skills. Based on these findings, this paper proposes Scaffolded Game-Based Simulation (SGBS) as a conceptual framework that introduces an intermediate learning layer between theoretical instruction and high-fidelity simulation. Through progressive complexity and guided interaction, SGBS helps learners move from understanding concepts to applying them in complex domains such as railway education. In this way, simulation-based learning is reframed not only as a tool for skill acquisition but also as a structured pathway that connects conceptual and operational knowledge.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/4894","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/4894/4912","match":1.0,"id":"01-1030-21-26","related":[]},{"day":"2026-10-01","start":"10:40","end":"11:00","room":"051","stream":"Stream A: GBL and Children","chair":"Sarah von Styp Rekowski","type":"paper","title":"Children in Digital Movement: Facilitating Exergame-based Learning","authors":"Lars Elbæk and Nanna Jacobsen University of Southern Denmark, Denmark","code":"GBL-006","flags":[],"abstract":"Exergame-based Learning (EBL) offers a way to reconcile concerns about children’s increasing screen time with the need to promote physical activity, social participation, and academic learning in schools. This paper explores how EBL can be facilitated in a Danish preschool context using the Multiball system. Grounded in embodied cognition and embodied learning, we conceptualise EBL as learning through bodily participation in technologically mediated learning, where movement, perception, and thinking are intertwined (Dourish, 2001; Malinin, 2019; Skovbjerg & Jensen, 2024). Drawing on Reidsma et al.’s (2022) framework for facilitator roles in movement-based design, we view facilitation as situated mediation through framing, orchestration, and reflection rather than mere technical operation. Methodologically, the study adopts a qualitative single-case design with embodied fieldwork in one preschool class (17 children, aged 5–6 years) over four months. Weekly Multiball sessions integrated exergames with analogue materials and targeted physical, cognitive, and socio-emotional aims. Data consisted of video-recorded observations, participatory field notes, and a follow-up semi-structured teacher interview, analysed through reflexive thematic analysis (Braun & Clarke, 2019). Findings show that children’s engagement and learning opportunities emerged through facilitation rather than technology alone. Effective EBL depended on the facilitator’s ability to shift between instructor/game master, coach/mediator, role model, and initiator/animator roles, regulating intensity, clarifying goals, and connecting gameplay to academic and socio-emotional development (Reidsma et al., 2022; Baalsrud et al., 2021). The study concludes that EBL holds promise for holistic learning in pre-school, but only when supported by robust pedagogical framing, classroom management, and facilitator competence, rather than by exergame systems alone.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5213","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5213/4826","match":1.0,"id":"01-1040-051-8","related":[]},{"day":"2026-10-01","start":"10:40","end":"11:00","room":"052","stream":"Stream B: STEM","chair":"Micaela Fonseca","type":"paper","title":"Exhibiting Advanced Mathematics with Casual Games in Science Centres","authors":"Lena Pareto, Gothenburg University, Sweden","code":"GBL-186","flags":[],"abstract":"Mathematics is fundamental for civic participation and decision-making in an increasingly data-driven society and should therefore be approached as a lifelong learning pursuit. However, despite their role as informal learning environments, science centres rarely exhibit advanced mathematics. This can be attributed to the challenges of informal learning settings, where participation is voluntary and socially oriented, numerous exhibits compete for visitors’ attention, and interactions are typically brief. These conditions make sustained engagement with abstract mathematical concepts difficult. This paper investigates how casual game-based exhibits can support engagement with advanced mathematics in science centre environments. The design of three interactive exhibits from a mathematics exhibition at Sweden’s national science centre were studied through visitor observations and embodied interaction analysis of gameplay. Results show that visitors engaged in meaningful exploration, strategic reasoning, and collaborative discussion related to the mathematical content. Across the exhibits, five design principles were identified: (1) intrinsic integration of learning content and game mechanics, (2) hybrid physical-digital interaction, (3) clear and simple goals, (4) obvious game actions but challenging game mastery, and (5) multi-sensory and experiential learning content. The findings demonstrate the potential of casual game-based exhibits to make advanced mathematics accessible in informal learning environments and provide empirically grounded design principles for science centres and similar contexts.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/4948","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/4948/4874","match":1.0,"id":"01-1040-052-14","related":[]},{"day":"2026-10-01","start":"10:40","end":"11:00","room":"053","stream":"Stream C: Mini Track on Educational Escape Rooms","chair":"Panagiotis Fotaris","type":"paper","title":"The search of the lost Equilibrium: An ER for STEMS life long learning","authors":"Alessandra Rocco, Simona De Luca, Lorena Affatato and Mario Barra, CNR (Consiglio Nazionale delle Ricerche)- Istituto Nazionale di Ottica, Napoli, Italy","code":"","flags":["uncertain"],"id":"01-1040-053-20","related":[]},{"day":"2026-10-01","start":"10:40","end":"11:00","room":"146","stream":"Stream D: Mini Track on Game-based Learning for Lifelong Learning","chair":"Martin Steinicke","type":"paper","title":"The ComeThinkAgain Project: Playful Computational Thinking in Primary Teacher Education Through Game Mechanics","authors":"Bernadette Spieler and Melanie Kieber, Zurich University of Teacher Education, Switzerland","code":"GBL-116","flags":[],"abstract":"The Erasmus+ project \"ComeThinkAgain\" addresses the growing need to equip future generations with interdisciplinary skills by developing a Certification-based Education Training System (CETS) that integrates Computational Thinking (CT), Entrepreneurship Education (EE), and Green Skills (GS). For CT, a significant challenge in primary education is the training of teachers, who frequently lack a formal computer science background, to confidently teach foundational CT concepts. To address this issue, a 1 ECTS micro-module for CT foundations was developed specifically for primary school teachers, utilising a game-based learning (GBL) and playful approach. This paper presents the pedagogical design and initial pilot results of the course. The course followed a constructionist, hands-on modelling approach aimed at translating abstract computational concepts into tangible and relatable learning experiences. Participants engaged with theoretical reading tasks, analysed familiar games and everyday situations, and explored practical workshop stations involving unplugged, gamified, and tangible activities. These activities were designed to make CT concepts such as decomposition, abstraction, pattern recognition, algorithmic thinking, sequencing, and debugging visible without placing programming at the centre of the learning process. In the final transfer phase, teachers applied these insights by designing their own cross-curricular CT lesson activities. The pilot course was conducted with a cohort of five primary school teachers. The present study collected qualitative feedback from focus group and individual interviews as well as teacher-designed lesson artefacts. The aim was to explore how participants experienced the module, how they conceptualised CT, and whether they were able to transfer CT concepts into their own teaching contexts. The findings suggest that familiar game environments and tactile unplugged activities helped participants reframe CT as a broader problem-solving approach. Participants reported increased awareness of CT in everyday teaching practices and demonstrated initial transfer through the design of cross-curricular lesson activities.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5007","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5007/4891","match":1.0,"id":"01-1040-146-35","related":[]},{"day":"2026-10-01","start":"10:40","end":"11:00","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Rajiv Basaiawmoit and Katharina Fohrmann","type":"games-judging","title":"Fiabadiario","authors":"Rosa Tiziana Bruno, Universidad Complutense de Madrid, Spain","code":"Game-010","flags":[],"id":"01-1040-18-139","related":[]},{"day":"2026-10-01","start":"10:40","end":"11:00","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Guido Bruinsma and Lisa Baule","type":"games-judging","title":"Blue Poo: The Gut-Brain Game","authors":"Mary Barker, David Farrell, Ross Anderson, Colin Anderson, Jonathan Swann, Rosie Mackay, University of Southampton, Southampton, UK","code":"Game-065","flags":[],"abstract":"Blue Poo is a free, web-based cognitive game battery built around a piece of brilliantly memorable family science. Players aged 5+ eat a blue muffin, time how long it takes to see a blue poo (their \"gut transit time\"), and play a short battery of touchscreen mini-games that test - and teach them about - their own cognitive function. The data they generate feeds a real UK citizen-science study, run from the University of Southampton, into how gut health and cognition are linked. We are aiming at 10,000 participants across the UK, with primary and secondary schools as the main educational target.\n\nThe battery opens with Mismatch, a faithful mobile-first implementation of the Stroop Colour-Word Interference Test - the gold-standard clinical measure of cognitive interference. Three star-themed games follow. In Star Shapes, players join stars with lines to invent as many different constellations as they can, and repeats do not count. In Star Trails, they follow a path across a star field without a slip, and the finished trail resolves into a constellation picture. In Constellation, they match by colour or by shape depending on where they have landed, with the rule switching underneath them. Each game lasts about a minute; the whole sitting takes five.\n\nEvery game is a lesson in executive function - inhibition, switching, selective attention, planning - and the results screen teaches players, in plain language, what their brain just did. The constellations they chart are the study's own story drawn in stars: an oven, a muffin, a toilet.\n\nPlayers walk away knowing what gut transit time is, why it matters, how it might relate to cognitive function and what their automatic and intentional cognitive systems feel like. Researchers walk away with a uniquely large, age-diverse dataset. Schools, families and science festivals walk away with a five-minute lesson in biology, psychology and the scientific method, wrapped in a bodily-function joke.","paidia":true,"id":"01-1040-18-145","related":[]},{"day":"2026-10-01","start":"10:40","end":"11:00","room":"18","stream":"Game Judging: Fully developed games (judging panel 3)","chair":"Judges: Taru Deva and Geeske Kemper","type":"games-judging","title":"CSI: Agent on a Mission","authors":"Rosie Ching, Singapore Management University, Singapore","code":"Game-050","flags":[],"id":"01-1040-18-151","related":[]},{"day":"2026-10-01","start":"10:40","end":"10:50","room":"21","stream":"Stream D: PhD and Masters Colloquium Track","chair":"","type":"phd","title":"A Tripartite Framework for the Co-design of an Awareness-raising SG Addressing Visual Impairment: A Systematic Literature Review","authors":"Nicolas Roecklin and Nour El Mawas, Université de Lorraine and CREM, Metz/Nancy, France","code":"GBL-137","flags":["PhD"],"abstract":"Over the past decades, social advances and the evolution of legal frameworks have strengthened the recognition of disabled people's right to equal access to employment, education, information, and full participation in society. However, navigating public spaces remains challenging for many visually impaired people (VIP), and raising awareness among public space designers is needed. Research has shown the potential of serious games (SGs) as awareness-raising tools for complex situations, fostering understanding and empathy among participants. This article is part of broader research aimed at designing an SG to raise awareness of VIP mobility challenges. It analyzes existing design methods through a systematic literature review (SLR) that identified 24 articles and 2 books within a corpus of 163 publications. The SLR compares technical criteria (SG engine, software, reality-based technology, programming language, platform, tangible object) and co-design criteria (organization, stakeholder roles, iteration frequency, gameplay considerations such as playtime, seriousness/fun balance, facilitator role, SG type, overall duration). These findings suggest that, from an Information and Communication Sciences (ICS) perspective, technology primarily acts as a mediator of social interactions, making co-design with people with visual impairments essential to developing meaningful systems. We propose a co-design method involving VIP experts, technical experts, and researchers, with attention to communication and coordination throughout the design process. This research addresses the Technology Enhanced Learning community, particularly pedagogical engineers, game designers, researchers, and public space planners concerned with VIP mobility awareness.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5159","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5159/4915","match":1.0,"id":"01-1040-21-27","related":[]},{"day":"2026-10-01","start":"10:50","end":"11:00","room":"21","stream":"Stream D: PhD and Masters Colloquium Track","chair":"","type":"phd","title":"Revisiting the Serious Game Classification and Definition","authors":"Alice Thise, University of Liège, Belgium","code":"GBL-071","flags":["PhD","+G30"],"abstract":"In the field of heritage mediation, games are increasingly explored as tools to communicate knowledge, engage audiences, and support learning about cultural heritage. Before exploring their potential in this field, it is worth analysing them and their possibilities. In fact, they have always been used to share knowledge, develop skills, etc. However, it is only recently that we really started talking about them and understood their true potential, whether in schools, museums, or elsewhere. These games can be called Serious Games (SG), although this term is controversial. Indeed, this term implies that games are not ‘serious’ by nature, but rather ‘playful’. Thus, in this paper, we aim to situate SG within the theoretical framework of gaming/playing (what is a game or a play, and what impact these definitions can have on SG?). We then seek to understand their meaning (what makes them a SG?); origins (how did they appear and what kind of medium were they associated with?); variations (how can we classify the sub-genre of SG?); objectives; target audiences; and areas of application. New concepts linked to SG have also emerged (ludification, gamification and ludicisation). We establish whether or not the term SG become obsolete compared to these other concepts. Then, we highlight the contributions and limitations that SG can bring compared to ‘traditional’ tools used to achieve the same objectives (e.g. ex cathedra courses, traditional physical training, and so on). This analyse of effectiveness focuses solely on motivation (one of the most important factors), even though many other components can contribute to it. Thus, without imposing a definition of SG, we will provide an overview of the existing literature, adding our own comments and observations. Finally, this allows us to refine a previous model designed to classify SG by adding the period, the medium used and the type of motivation.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5100","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5100/4919","match":1.0,"id":"01-1050-21-28","related":["01-1540-18-173"]},{"day":"2026-10-01","start":"11:00","end":"11:20","room":"051","stream":"Stream A: GBL and Children","chair":"Sarah von Styp Rekowski","type":"paper","title":"Playful Pedagogy: Student Perceptions of Academic Skill Development Through Board Games","authors":"Jordana Garbati and Nicole Skrepnek, University of Toronto Mississauga, Canada","code":"GBL-007","flags":[],"abstract":"Game-based learning (GBL) has been widely recognized in higher education for its potential to enhance learning, foster peer-to-peer connections, support metacognitive and executive functioning, and facilitate collaborative learning (e.g., Jääskä & Aaltonen, 2022; Kim et al., 2009; Glaister et al., 2024). Across Canadian postsecondary institutions, GBL initiatives have emerged in academic programs, libraries, and teaching and learning centres (Garbati & Skrepnek, 2024, 2025). At our institution, examples include a Game Studies minor, an extensive video game collection housed in the library, and a collection of more than 300 board games maintained by the academic skills centre. This study focuses on the academic skills centre’s game café, a long-running co-curricular initiative in which students gather to play board games with peers for up to four hours. While the game café is well-attended, little evidence has been collected regarding participants’ experiences and perceived learning outcomes. To address this gap, we investigated students’ perceptions of the game café, including their participation patterns and perceived development of academic skills such as verbal communication, written communication, critical thinking, and problem solving through gameplay. Data were collected through paper-based surveys administered during Winter and Fall 2025. A total of 104 students completed the survey. Analysis of findings note attendance and participation trends, students’ perceptions of learning and skill development, and interest in future GBL-focused workshops. This paper provides an overview of relevant literature, outlines the study’s research goals and methodology, presents key findings, and discusses their implications for teaching and learning in higher education. We conclude by identifying future directions for research and considering the pedagogical potential of the game café as a co-curricular learning environment.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5539","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5539/4871","match":1.0,"id":"01-1100-051-9","related":[]},{"day":"2026-10-01","start":"11:00","end":"11:20","room":"052","stream":"Stream B: STEM","chair":"Micaela Fonseca","type":"paper","title":"Who Tells the Better Math Story? Exploring Gen AI in a Digital Algebra Game","authors":"Kubra Kaymakcı-Ustuner, Effie Lai-Chong Law and Frederick WB Li, Durham University, UK","code":"GBL-096","flags":[],"abstract":"Learning algebra can be challenging for children due to its abstract nature. Story-based game design can support learning by contextualising mathematical structures. Recent advances in generative artificial intelligence (genAI) offer new opportunities for reflection and meaning-making. This paper presents a genAI-supported, story-based digital algebra game designed for students aged 9–11 encountering algebra for the first time. The game consists of three levels, progressing from recognition to production.. An embedded LLM system (Algy) generates an alternative story using the same student inputs - character, place, and equation - for creating their own stories. Students compare both stories, select one, and justify their choice. The study involved 136 students and four teachers. Data from written justifications and interviews were analysed thematically. Results showed that students choosing AI-generated stories valued clarity, detail, correctness, and perceived intelligence. In contrast, those preferring their own stories emphasised ownership, creativity, and emotional engagement. Teachers reported that integrating genAI within a structured game made it more controllable and trustworthy. Findings suggest that structured integration of genAI can support reflection while preserving student ownership.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5190","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5190/4847","match":1.0,"id":"01-1100-052-15","related":[]},{"day":"2026-10-01","start":"11:00","end":"11:20","room":"053","stream":"Stream C: Mini Track on Educational Escape Rooms","chair":"Panagiotis Fotaris","type":"paper","title":"Effects of Digital Escape Games on Motivation in Primary Mathematics Education","authors":"Hana Ulrichova, Otto Suchanek, Magdalena Zavodna and Tomas Javorcik, University of Ostrava, Czech Republic","code":"GBL-040","flags":[],"abstract":"This paper addresses the decline in motivation and the development of mathematical literacy among pupils during primary education, with particular attention to the increasing level of abstraction that often contributes to mathematical anxiety, lower self-confidence, and reduced engagement in mathematics. These challenges highlight the need for instructional approaches that combine meaningful learning experiences with opportunities to strengthen pupils’ motivation and confidence. The theoretical framework is grounded in the principles of game-based learning and is informed by Flow Theory and Self-Determination Theory. The study focuses on an innovative teaching intervention in the form of a digital educational escape game developed in the Genially environment and embedded within a Minecraft-inspired narrative. By integrating elements of familiar gaming culture, the intervention aims to support horizontal mathematization, understood as the application of mathematical knowledge and procedures in meaningful contexts, while promoting learner engagement and active problem solving. The study employed a mixed-methods research design involving 25 fifth-grade pupils (aged 10–11) from a primary school in the Czech Republic. Quantitative data were collected using a pretest–posttest design consisting of a mathematics knowledge test and a ten-item semantic differential measuring pupils’ attitudes toward mathematics. Qualitative evidence was obtained through classroom observations, pupils’ written reflections, and structured debriefing sessions, providing additional insights into pupils’ learning experiences and motivational responses. The findings indicate that the digital escape game contributed to more positive attitudes toward mathematics, reduced perceived stress, increased self-confidence, and greater engagement with mathematical tasks. Qualitative data further demonstrated the motivational value of the narrative game environment and highlighted the role of contextualized problem solving in supporting meaningful mathematical activity. At the same time, the results revealed that pupils’ perceived procedural confidence remained unchanged and that their reported willingness to persist with demanding tasks decreased after the intervention, suggesting that highly immersive game environments may also present challenges for developing long-term cognitive resilience. The study contributes to the growing body of research on game-based learning by demonstrating both the educational potential and the limitations of digital escape games in primary mathematics education.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5208","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5208/4900","match":1.0,"id":"01-1100-053-21","related":[]},{"day":"2026-10-01","start":"11:00","end":"11:20","room":"146","stream":"Stream D: Mini Track on Game-based Learning for Lifelong Learning","chair":"Martin Steinicke","type":"paper","title":"Unlocking Convergent Thinking and Insight: Brain Games as Tools for Lifelong Learning of Creativity","authors":"Maxence Mercier, KEDGE Business School, Paris, France, Jiayin Liu and Todd Lubart, Université Paris Cité, France","code":"GBL-126","flags":["presentation only"],"id":"01-1100-146-36","related":[]},{"day":"2026-10-01","start":"11:00","end":"11:20","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Rajiv Basaiawmoit and Katharina Fohrmann","type":"games-judging","title":"MitiGate","authors":"Martin Sillaots, Anija Aizkalne, Elīza Cipruse, Inga Šlangena, Mikhail Fiadotau, Tallinn University and Ludoguru OÜ, Tallinn, Estonia","code":"Game-012","flags":["+GBL-044 Fri","+GBL-050 Fri"],"id":"01-1100-18-140","related":["02-1420-052-131","02-1200-053-121"]},{"day":"2026-10-01","start":"11:00","end":"11:20","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Guido Bruinsma and Lisa Baule","type":"games-judging","title":"Disagree Differently: A Trail Guide for Tough Talks","authors":"Alexander (Ben) Kertman, Future People Lab, Mexico City, México","code":"Game-020","flags":[],"id":"01-1100-18-146","related":[]},{"day":"2026-10-01","start":"11:00","end":"11:20","room":"18","stream":"Game Judging: Fully developed games (judging panel 3)","chair":"Judges: Taru Deva and Geeske Kemper","type":"games-judging","title":"Market Forces","authors":"Kristina Risley, Cognita Learning Lab, UK","code":"Game-089","flags":["+GBL-64 Fri 9.00"],"id":"01-1100-18-152","related":["02-0920-053-90"]},{"day":"2026-10-01","start":"11:00","end":"11:10","room":"21","stream":"Stream D: PhD and Masters Colloquium Track","chair":"","type":"phd","title":"Right Opinion: Fidelity and Learning Design in a Food Poisoning Card Game","authors":"Mario Michaelides, Brunel University of London, UK","code":"GBL-236","flags":["PhD","uncertain-time"],"abstract":"This paper presents the design and development of \"Right Opinion\", a competitive two-player card game created to support Key Stage 3 learners' understanding of food poisoning. It is the first prototype in a wider doctoral study asking whether the fidelity of a serious game's delivery medium affects immediate knowledge acquisition and player experience. The planned comparison spans card, board, 2D digital, 3D digital, and virtual reality formats, representing increasing technological, audiovisual, spatial, and immersive possibilities without assuming that more technology produces better learning. With learner testing yet to take place, the paper addresses how two pages of static educational material can be transformed into a card game that aims to engage and educate in equal measure. Right Opinion converts the source into 12 patient cases. Players interpret food histories and symptoms, identify E. coli, Salmonella, or Listeria, and select suitable treatment and prevention responses. Correct decisions earn points, while the opponent can Challenge a response and optionally provide a Second Opinion. These mechanics make commitment, confidence, disagreement, and feedback visible. Bloom's original taxonomy informed four learning outcomes at the levels of Knowledge, Comprehension, and Application. The paper traces the design from an early handwritten speed-based version to the professionally printed prototype, then examines learning alignment and the affordances and limitations of cards. The physical format offers tactile, face-to-face play, low technical requirements, portability, and rapid setup, but relies on players to manage feedback and scoring. The resulting design findings concern content transformation, pacing, and the medium-specific affordances of cards as a physical baseline for later cross-format comparison across the five delivery conditions. The planned evaluation will combine matched knowledge tests at three points with a measure of player experience, enabling immediate acquisition and learners' perceptions of competition and engagement to be examined without treating competitive scores alone as learning evidence.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5370","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5370/4913","match":1.0,"id":"01-1100-21-29","related":[]},{"day":"2026-10-01","start":"11:20","end":"11:30","room":"","stream":"","chair":"","type":"break","title":"Short Break","authors":"","code":"","flags":[],"id":"01-1120-all-39","related":[]},{"day":"2026-10-01","start":"11:30","end":"11:50","room":"051","stream":"Stream A: GBL and Children","chair":"Sarah von Styp Rekowski","type":"paper","title":"Emotion Detectives: Co-designing Inclusive SEL Games with Preschool Children","authors":"Joana Silveira, Ana Isabel Veloso and Oksana Tymoshchuk, Universidade de Aveiro, Portugal","code":"GBL-216","flags":[],"abstract":"Preschool-aged children are still rarely involved as genuine co-design partners in the development of Digital Educational Games (DEGs). In participatory design research, they are often positioned as users or testers, while adult assumptions continue to dominate design decisions. This exclusion is especially significant in game design, where children’s ways of imagining, narrating and representing experience could inform more meaningful educational technologies. This paper presents a participatory co-design method and derives four preliminary design principles for inclusive preschool social-emotional learning (SEL) games from an exploratory workshop, “Emotion Detectives,” conducted within a broader Educational Design Research (EDR) project aimed at co-designing an inclusive digital educational game for preschool-aged children. The game’s pedagogical framework draws on the CASEL-5 competencies and Universal Design for Learning (UDL), with the goal of supporting SEL through accessible, developmentally appropriate digital play. The workshop was conducted with families from a disability support group using a low-fidelity, hands-on co-design toolkit. Children and caregivers collaboratively created three artefacts for each game concept: a protagonist profile, a narrative storyboard, and an interface sketch. To ensure coverage across the full SEL framework, each family group was randomly assigned one CASEL-5 competency. Reflexive thematic analysis of the artefacts and field notes showed that children could meaningfully contribute to co-design when the process relied on tangible materials, symbolic play, and caregiver mediation. This paper proposes four preliminary design principles for SEL-oriented DEGs in early childhood: use non-human protagonists to create symbolic distance for emotional exploration; design fail-soft feedback systems that support trial-and-error learning; integrate accessibility and representation from the outset as core elements of gameplay and narrative; and structurally embed balanced CASEL-5 coverage across interaction and progression. The study presents a co-design approach suited to preschool children and argues that their exclusion is shaped by methodological choices rather than by developmental limits.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5274","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5274/4887","match":1.0,"id":"01-1130-051-10","related":[]},{"day":"2026-10-01","start":"11:30","end":"11:50","room":"052","stream":"Stream B: STEM","chair":"Micaela Fonseca","type":"paper","title":"Design Principles for a Digital Game to Address Mathematics Anxiety in the Classroom","authors":"Sonia Palha, Daan van Smaalen, Anders Bouwer, Amsterdam University of Applied Sciences, The Netherlands, Ljerka Jukic Matic, University of Osijek, Osijek, Croatia, Jenni Huhtasalo, Janika Tommiska, Faculty of Technology, Satakunta University of Applied Sciences, Pori, Finland and Leonard Busuttil, University","code":"","flags":["uncertain"],"abstract":"Mathematics anxiety is increasingly recognized as a significant barrier to learning, affecting not only students’ performance but also their motivation and long-term relationship with mathematics. Although digital game-based learning has shown potential to support motivation and learning in mathematics, only few games have been explicitly designed to prevent or alleviate mathematics anxiety. This study addresses that gap by examining how theory-informed design principles for an emotionally supportive digital mathematics game were implemented in the wireframe design of MathifyMe, a browser-based game for students aged 7-16. To investigate how these principles were translated into design features, we conducted walkthrough sessions with researchers, teachers, and students. The findings revealed that the design principles provided sufficient guidance for developing game features that stakeholders recognized as potentially helpful for supporting math-anxious learners. Several critical implementation issues were identified, and implications for the further design of the game are discussed. This paper contributes to research on digital games and mathematics anxiety by offering a theory-informed set of design principles for emotionally supportive mathematics game design.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5499","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5499/4873","match":1.0,"id":"01-1130-052-16","related":[]},{"day":"2026-10-01","start":"11:30","end":"11:50","room":"053","stream":"Stream C: Mini Track on Educational Escape Rooms","chair":"Panagiotis Fotaris","type":"paper","title":"Design and Evaluation of a Digital Educational Escape Game for AI Literacy","authors":"Julia Thurner-Irmler, University of Augsburg, Germany","code":"GBL-042","flags":[],"abstract":"Developing competencies in the field of artificial intelligence (AI) represents a central task of modern education while preparing young people for an increasingly digitalized world. In this context, practice-oriented, interactive, and motivating learning formats are gaining importance. Educational escape games (EEGs) have already proven to be a promising approach in other educational contexts, as they combine subject-related learning objectives with structured, suspense-based game scenarios and can therefore support both cognitive and affective learning. This paper presents the design and evaluation of the digital EEG “AI Chaos”, which was developed within the framework of a doctoral research project for students in grade 8 and above. The browser-based game was implemented using Genially . The didactic design includes three thematically structured game rooms featuring different game mechanics and varied puzzles, as well as a final meta-puzzle. The game aims to convey fundamental concepts and principles of AI learning mechanisms in a comprehensible and motivating way, while fostering media literacy and critical judgment regarding opportunities and challenges related to AI. A quasi-experimental pre-post questionnaire design with supplementary observation protocols was used for the evaluation, in which a total of n = 181 students from various types of schools participated. In addition to subject-related knowledge, motivational and emotional aspects such as the experience of flow as well as attitudes toward AI were measured. The results show a significant increase in participants’ knowledge after playing the game. In addition, the learners reported a strong flow experience, with the dimensions of social interaction and perceived competence showing particularly high scores. Attitudes toward AI remained largely stable over the short intervention period. The strongest predictor of cognitive knowledge gain was the participants’ prior knowledge. The activity was rated very positively by the students, who particularly highlighted teamwork, autonomous activity, and the enjoyment of solving puzzles. Overall, the results indicate that (digital) EEGs represent an effective and accessible method for teaching complex future-oriented topics such as AI. Their strengths lie in promoting learning motivation and emotional engagement within the learning process.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5315","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5315/4897","match":1.0,"id":"01-1130-053-22","related":[]},{"day":"2026-10-01","start":"11:30","end":"11:50","room":"146","stream":"Stream D: Mini Track on Game-based Learning for Lifelong Learning","chair":"Martin Steinicke","type":"paper","title":"Designing an Integrated-reality Megagame for Lifelong Learning Competency Development","authors":"Mario Caudillo, Aline Castillo, CLeaders, Cuautitlán Izcalli, Mexico and Marco Aurelio Santos Basurto, Scadimo, Mexico City, Mexico","code":"GBL-227","flags":[],"abstract":"This paper presents the design and implementation status of a Formula 1-inspired Integrated-Reality Megagame intended to support lifelong competency development. The experience combines a tangible Carrera Digital race system, SmartRace telemetry, role-specific digital interfaces and team-based role-play. Its design is organised through four connected layers: learning design, physical interface, virtual interface and social interaction. The physical and digital prototype is operational and has been used in eight formative demonstrations with groups of 10–20 people; however, no formal empirical evaluation or participant-level outcome analysis is reported. The paper documents the iterative development process, the distribution of information and decisions across racing roles, and an author-developed competency mapping informed by the OECD Learning Compass. Ethics, future thinking, communication and critical thinking are mapped to current mechanics, while innovation remains a planned module. The contribution is a transparent design account, an explicit layered architecture and a proposed formative mapping that can guide later evaluation and adaptation within motorsport- and engineering-related learning contexts.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5297","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5297/4821","match":1.0,"id":"01-1130-146-37","related":[]},{"day":"2026-10-01","start":"11:30","end":"11:50","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Rajiv Basaiawmoit and Katharina Fohrmann","type":"games-judging","title":"Powerball: A Futuristic Sports Simulation","authors":"Brad Burenheide, The Game Lab-Kansas State University, USA","code":"","flags":["uncertain"],"id":"01-1130-18-141","related":[]},{"day":"2026-10-01","start":"11:30","end":"11:50","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Guido Bruinsma and Lisa Baule","type":"games-judging","title":"Virivì and the shadow of rain","authors":"Vincenzo Santalucia et al, Whitesock Studio, Italy","code":"Game-022","flags":[],"id":"01-1130-18-147","related":[]},{"day":"2026-10-01","start":"11:30","end":"11:50","room":"18","stream":"Game Judging: Fully developed games (judging panel 3)","chair":"Judges: Taru Deva and Geeske Kemper","type":"games-judging","title":"My safe path to traffic safety education","authors":"Eiman Drawshi, An-Najah National University, Israel","code":"Game-024","flags":[],"id":"01-1130-18-153","related":[]},{"day":"2026-10-01","start":"11:30","end":"11:40","room":"21","stream":"Stream D: PhD and Masters Colloquium Track","chair":"","type":"phd","title":"AI-assisted Scene Synthesis in the 3D Educational Game Authoring Tool GameTULearn","authors":"Florian Horn, Vincenti Alessandro and Stefan Göbel, Technical University of Darmstadt, Germany","code":"GBL-142","flags":["PhD","uncertain-time"],"abstract":"Educational games can improve motivation and learning outcomes but authoring them is still difficult for educators without programming experience. This problem is particularly visible in 3D scene creation, where users must select assets, arrange objects, and maintain spatial consistency inside a complex editor. GameTULearn addresses this challenge as a no-code authoring environment for interactive 3D educational games. This paper presents an AI-assisted scene-synthesis workflow that translates prompt-based natural-language descriptions into editable 3D room layouts inside GameTULearn. The workflow is designed as an assistive layer rather than an automatic generator. A multi-stage pipeline interprets the user request, selects scene-editing functions, retrieves suitable assets and objects, places them on a structured room grid, and executes the resulting operations in Unity. Low-level implementation details such as object instantiation, placement constraints, and validation remain inside the engine. This separation reduces the decision burden for the language model and keeps the generated scene fully editable. We evaluated the workflow in a within-subject user study with 13 participants. Each participant recreated the same educational game scene once with the AI-assisted workflow and once with a traditional drag-and-drop editor. The AI-assisted workflow reached a System Usability Scale score of 80.6, compared with 69.4 for the traditional condition. Participants particularly valued the lower entry barrier and the reduced interaction effort. At the same time, they criticised mismatches between their descriptions and the generated layouts and did not want to give up manual control. The results therefore support a hybrid authoring model in which AI accelerates scene creation, but users remain responsible for review and refinement.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5316","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5316/4911","match":1.0,"id":"01-1130-21-30","related":[]},{"day":"2026-10-01","start":"11:40","end":"11:50","room":"21","stream":"Stream D: PhD and Masters Colloquium Track","chair":"","type":"phd","title":"Scientific Escape Room: A Science Communication initiative evaluated by Generic Learning Outcomes","authors":"Bruna Magiole, Fernanda Irene Bombonato, Nuno Inácio Passos Abreu de Oliveira, Federal University of Juiz de Fora, Juiz de Fora, Brazil, Frans Wagner de Salles Junior, CAVE Educational Center, Juiz de Fora, Brazil","code":"GBL-159","flags":["Masters","uncertain-time"],"abstract":"The Scientific Escape Room, located at the Science Center of the Federal University of Juiz de Fora (UFJF), is a university extension project that emerged as a science communication initiative to engage people with science in a fun, interactive, and collaborative way. The narrative, titled The Last Experiment , proposes that participants, supposedly kidnapped to serve as experimental subjects, solve a series of puzzles to escape the room. The space was designed to simulate the clandestine laboratory of a fictional pharmaceutical company, enhancing the game's immersive nature. The challenges were based on knowledge related to the natural sciences (chemistry, physics, and biology) and mathematics, aligned with school-level content and varying in complexity. The target audience comprised individuals aged 18 and over who had completed basic education, which in Brazil spans ages 4 to 17. The puzzles involve revealing clues with ultraviolet light, interpreting information from the periodic table, solving encrypted messages, interpreting health-related information such as body mass index (BMI), applying concepts related to magnetism and the properties of metals, and, finally, using logical reasoning and pattern recognition. Since game-based learning addresses not only cognitive but also social and emotional aspects, the game was analysed within the theoretical framework of Generic Learning Outcomes (GLOs), which offers a broader perspective on learning. The study adopted a qualitative approach based on content analysis of post-game questionnaires and semi-structured interviews with returning players. The results demonstrate that players' experiences encompassed the five dimensions of the GLOs—knowledge and understanding; skills; values and attitudes; enjoyment, inspiration, and creativity; and action, behaviour, and progression (Hooper-Greenhill, 2007)—highlighting improvements in cognitive, social, and emotional development. Participants reported that the activity fostered teamwork and logical reasoning and, after the experience, expressed greater motivation to understand the scientific concepts involved in the puzzles and return to the escape room to solve them. The experience reinforces the potential of game-based learning to foster curiosity, collaboration, and the application of scientific knowledge.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5068","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5068/4926","match":1.0,"id":"01-1140-21-31","related":[]},{"day":"2026-10-01","start":"11:50","end":"12:10","room":"051","stream":"Stream A: GBL and Children","chair":"Sarah von Styp Rekowski","type":"paper","title":"Play to Protect: Evaluating Cyber Threat Defender in South African Cybersecurity Education","authors":"Lance Bunt, Michael De Jager and Luke Coetzee, North-West University, Vanderbijlpark, South Africa","code":"GBL-027","flags":[],"abstract":"Cybersecurity education in higher education is predominantly theoretical and lecture-centred despite sustained calls for more active and experiential pedagogies. Serious games have been proposed as a promising mechanism for supporting applied reasoning and systems thinking in technical curricula, yet relatively little empirical work examines how students at different stages of disciplinary development perceive such interventions. This study evaluates Cyber Threat Defender (CTD), a strategy-based serious card game designed to simulate cybersecurity concepts such as attack-defence dynamics, risk trade-offs, and layered protection strategies. Using a design-based implementation research approach, CTD was integrated into an undergraduate cybersecurity curriculum at a South African university. The study compares perceptions between two cohorts: second-year students encountering cybersecurity concepts for the first time and final-year students with more developed disciplinary understanding. Quantitative data were collected using Likert-scale instruments measuring perceived educational value, engagement, usability, and curricular relevance, complemented by qualitative responses exploring gameplay experiences and conceptual insights. An additional ruleless second-year session was conducted as a control condition to isolate the influence of instructional clarity on gameplay usability. Descriptive statistical analysis and thematic coding were applied to examine differences in perception across cohorts. Both groups report strong engagement and support for curricular integration of the game, while final-year students demonstrate stronger alignment between gameplay mechanics and cybersecurity concepts. The control condition indicates that rule clarity significantly affects gameplay usability without undermining the perceived educational value of the intervention. The findings further suggest that contextualisation within South African socio-technical environments can enhance the perceived relevance of serious game interventions. These findings suggest that serious games like CTD can support experiential cybersecurity learning when implemented with appropriate instructional scaffolding. The study contributes empirical evidence from a South African context and highlights the role of disciplinary maturity in shaping how students interpret game-based learning interventions.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5458","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5458/4817","match":1.0,"id":"01-1150-051-11","relate
