indergarten settings to evaluate its practical capacity to cultivate foundational skills.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5460","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5460/4933","match":1.0,"id":"02-1000-all-103","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"The IMPACT Project: Serious Games for Serious Change","authors":"Mia Wilson and Laura Sharp, University of Glasgow, Scotland, UK","code":"GBL-174","flags":["poster","poster only","+G019"],"id":"02-1000-all-104","related":["01-1150-18-154"]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Building Digital Educational Escape Rooms: A Modular Toolkit With Low-code Authoring Approach","authors":"André Matutat, Benjamin Franke, Niklas Schumann, Hannes Rüffer, Birgit Christina George and Carsten Gips Campus Minden, University of Applied Sciences and Arts (HSBI), Germany","code":"GBL-100","flags":["poster","WIP"],"abstract":"Digital Educational Escape Rooms (DEERs) represent a compelling form of game-based learning that situates collaborative problem-solving at its core. Grounded in constructivist and collaborative learning principles, DEERs require teams to negotiate meaning, coordinate actions, and apply prior knowledge under time pressure, conditions that promote deeper cognitive engagement and knowledge consolidation. The game environment provides intrinsic motivation through narrative immersion and immediate feedback, while cooperative mechanics cultivate communication and shared responsibility. Systematic reviews confirm that DEERs foster teamwork, communication, and critical thinking, yet adoption remains limited because creating pedagogically sound DEERs demands both instructional design expertise and substantial technical skill. Existing authoring tools either sacrifice expressiveness for usability or require programming knowledge, leaving a significant gap for non-technical educators seeking to design rich, interactive learning experiences aligned with curricular goals. This work in progress paper presents the DEER-Wizard, a low-code authoring approach that guides educators through a multi-step configuration covering puzzle structure, narrative flow, and learning objectives. Each step is grounded in established DEER design principles, including narrative framing, interdependent puzzles, adaptive hint strategies, and structured debriefing, ensuring that pedagogical alignment is built into the authoring process rather than treated as an afterthought. A connected DEER-Generator converts the completed configuration into a playable game. The Wizard builds on the DEER-Toolkit embedded in a 2D multiplayer dungeon crawler with cooperative play and xAPI-based learning analytics that support formative assessment. Together, Wizard and Toolkit enable non-technical educators to design pedagogically aligned DEERs without programming expertise, directly addressing the power-usability dilemma identified in authoring tool research. The DEER-Wizard is a conceptual design with a prototype implementation in progress. A planned mixed-methods evaluation will examine usability for educators and learning outcomes for students in authentic higher education settings. The Wizard, the Toolkit, and the generated Escape Room Games are and will continue to be released as open-source software and open educational resources.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5434","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5434/4938","match":1.0,"id":"02-1000-all-105","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Building Bridges: A Collaborative Pipeline for Educational Game Creation","authors":"Markus Petz, Lukas Schnabel, Fabian Wagner, Jürgen Konrad, Eva Hüll, Miran Jank, University of Applied Sciences Technikum Wien, Vienna, Austria and Fares Kayali, University of Vienna, Austria","code":"GBL-117","flags":["poster","WIP"],"abstract":"This paper introduces a collaborative participatory design pipeline that connects subject‑matter experts (SMEs), game designers, students, and educators to co‑create classroom‑feasible educational games. We demonstrate this process through DIETER (DIgital EducaTional Escape Room), a modular Educational Escape Room (EER) composed of short, tablet‑ready mini‑games designed to foster STEM competencies in upper secondary education. These types of games are particularly well-suited because students have to work together, learning becomes interactive, and they connect academic concepts with practical challenges. We began by collecting data on students’ gaming behaviour and hardware preferences to provide a basis for realistic design decisions for school contexts. In parallel, a group of SMEs (lecturers at the University of Applied Sciences Technikum Wien) identified STEM topics suitable for game‑based learning and, in co‑design workshops, translated priority topics into actionable mini‑game concepts including constraints and learning outcomes. These design prompts were then handed to game design students in the bachelor’s program in computer science as authentic briefs across two courses, encouraging creativity while maintaining curricular alignment. The students carried out the game design and production process and iterated prototypes under real‑world constraints. As part of the participatory process, we also conducted a full‑day workshop with our partner school (Hertha Firnberg Schools for Business and Tourism, upper secondary level). During this session, students were introduced to the basics of game development and engaged in creative ideation activities such as brainstorming and the collective notebook method. These activities generated additional mini‑game ideas and provided deeper insights into students’ interests, expectations, and play preferences, helping to design age-appropriate and engaging educational game concepts. To validate classroom practicality and pedagogical usefulness, we conducted validation workshops with lecturers at the University of Applied Sciences Technikum Wien. In these sessions, participants playtested the resulting prototypes and collaboratively refined gameplay, scaffolding, and reflection prompts — focusing on feasibility (time, setup, group work), fit with lesson phases, and the requirements for meaningful reflection and knowledge transfer.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5414","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5414/4941","match":1.0,"id":"02-1000-all-106","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Communicating science through escape rooms: A challenge","authors":"Pedro Simão Mendes, Marília Prada, Centro de Investigação e Intervenção Social (CIS-Iscte), Iscte-Instituto Universitário de Lisboa, Portugal and Marta Ferreira Dias, Universidade de Aveiro, Aveiro, Portugal","code":"GBL-038","flags":["poster","WIP"],"abstract":"Existing evidence shows that escape rooms are effective in promoting learning, motivation, and engagement in educational and professional contexts. More recently, the format has been used in science communication initiatives in informal contexts and/or with diverse audiences, showing promising results. Despite these developments, the potential of escape rooms as structured tools for science communication remains significantly underexplored from an empirical perspective. This gap is particularly relevant in a context marked by misinformation, declining trust in science (European Commission, 2025), and growing demands for participatory communication formats. This context calls for prior empirical understanding of how different stakeholders perceive, evaluate, and relate to novel science communication tools such as escape rooms. Drawing from cognitive and social psychology, and science communication, this conceptual protocol addresses this critical empirical gap by examining how different stakeholders (potential users, academics, institutional decision-makers, and industry professionals) perceive, accept or resist the use of escape rooms as a science communication tool in Portugal. We propose a mixed-methods approach consisting of focus groups and an online questionnaire to assess openness or resistance to this format. We hypothesize that potential participants (e.g., university students, members of the public) would show strong interest in this format, but academics (professors and researchers, directors and deans) may show some resistance to its adoption. Insights from the escape room industry will complement the findings from this project, allowing us to map the barriers and opportunities for the engagement of diverse audiences with scientific content using escape rooms. The further goal is to inform future development of evidence-based escape rooms for science communication that encourage people’s active participation in scientific discourse.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/4929","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/4929/4940","match":1.0,"id":"02-1000-all-107","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Preparing for the Viva Through Play: A Card-based game Intervention for Doctoral Students","authors":"Annica Lau and Robin Bell, Worcester Business School, University of Worcester, UK","code":"GBL-056","flags":["poster","WIP"],"abstract":"Doctoral viva voce examinations are high-stakes milestones in which candidates defend their theses by answering questions from examiners. In the UK, the viva defence often takes place without a formal presentation, requiring candidates to respond spontaneously, justify methodological and theoretical decisions, and position their work within scholarly debates. Although doctoral researchers must ‘know’ their thesis, many report uncertainty about possible questions and limited opportunities to practise responses in supportive settings. Gamification is associated with increased engagement in learning contexts and may offer a beneficial approach to viva preparation. However, evidence of its use in this context remains limited, particularly in relation to oral defence skills. This study introduces the viva card game, a game-based learning intervention that supports doctoral candidates through structured dialogue and peer learning. The non-digital game uses curated viva-style questions and accommodates several formats (e.g. individual training, supervisor–student discussions, peer group sessions, and workshops). Candidates are encouraged to prepare arguments while engaging in verbal expression and reflection through these activities. This developmental case study draws on two pilot workshops held at doctoral research events. Participants provided feedback on the content, format, and usefulness of the intervention. The analysis is based on facilitator field notes and observations, which also informed initial revisions to the questions and workshop set-up. Preliminary observations suggest that the activity supports critical reflection, strengthens confidence when answering questions, and stimulates peer learning through discussions. These patterns align with research showing that game-based learning activities positively impact motivation and academic performance. Hence, the concept could be adapted for use in undergraduate and postgraduate contexts, including bachelor’s and master’s colloquia. Future development could involve creating multilingual versions and digital applications.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5081","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5081/4937","match":1.0,"id":"02-1000-all-108","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Everyday life in schools - revisited","authors":"Maria Theresa Meßner, Catherine Jannsen, Technische Universtität Darmstadt, Margarete Imhof, Johannes Gutenberg-Universität, Mainz, Silke Haas, Goethe Universität Frankfurt Germany","code":"GBL-177","flags":["poster","poster only"],"id":"02-1000-all-109","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Action Research Project: Board Games as an Educational Technology","authors":"Cornelia Hofmann, Bielefeld University, Bielefeld, Germany","code":"GBL-254","flags":["poster","poster only"],"id":"02-1000-all-110","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"A Multidimensional Rubric for Inclusive and Pedagogical Primary Informatics Game Design","authors":"Sarah von Styp Rekowski and Nadine Dittert, University of Koblenz, Germany","code":"GBL-165","flags":["poster","WIP"],"abstract":"Game-based learning holds promise for promoting informatics skills in primary education, yet many learning games neglect inclusive design and pedagogical rigor, exacerbating gender disparities. This work-in-progress introduces MERIG, a multidimensional evaluation rubric integrating gender-sensitive design, pedagogical efficacy, and ludo didactics. Grounded in Constructionism, Universal Design for Learning, and inclusivity frameworks, MERIG guides researchers, educators, and designers towards equitable, effective games. Future steps include expert validation and empirical testing to enhance early informatics engagement across Europe.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5421","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5421/4944","match":"author","paper_title":"MERIG: Design of a Multidimensional Evaluation Rubric for Informatics Games","id":"02-1000-all-111","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Defeat Means Friendship: Does Competitive Play Prepare Children for Cooperation?","authors":"Marcello Passarelli, Fondazione Collegio Pio X, Italy Francesca Maria Dagnino, Marcello Passarelli, Consiglio Nazionale delle Ricerche (CNR-ITD), Genoa, Italy Michele","code":"","flags":["poster","uncertain"],"abstract":"Cooperative and competitive board games each have documented value for social-emotional learning (SEL), but whether the order in which children encounter them matters is largely unexplored. Teachers may be tempted to begin with cooperative games; yet cooperation may depend on regulatory skills that competitive play is better suited to develop, and cooperative formats can conceal tensions that competitive play surfaces. We present a work-in-progress quasi-experimental study in four 2nd-grade classes (N = 86, ages 7-8). Students were assigned to competitive-first or cooperative-first sequences across eight monthly board-game sessions (Oct 2025 - May 2026). Social behaviours are coded during each session using a purpose-built 23-item instrument spanning Collaboration, Misconduct, Conflict, Emotionality, and Strategy and Support; pre- and post-intervention teacher questionnaires complement the observational data. Preliminary analysis of the pre-transition phase (12 sessions, 289 behaviours) shows that positively-coded behaviours are twice as frequent in cooperative (55%) as in competitive (28%) sessions, with indicators such as joint planning and accepting defeat positively concentrated in the former, and rule-breaking and coalition-forming in the latter — a contrast describing what each format elicits, not the children’s competence. Two classes show dissonances between baseline teacher ratings and observed behaviour, suggesting that structured gameplay surfaces regulatory demands the classroom context conceals. Post-transition data will test the sequencing hypothesis directly.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5407","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5407/4935","match":1.0,"id":"02-1000-all-112","related":[]},{"day":"2026-10-02","start":"11:00","end":"11:40","room":"051","stream":"","chair":"","type":"keynote","title":"Keynote Presentation: Mind and Machine: A New Era of Intelligent Tutorial Games","authors":"Michael Kickmeier-Rust, St.Gallen University of Teacher Education, Switzerland","code":"","flags":[],"id":"02-1100-051-113","related":[]},{"day":"2026-10-02","start":"11:40","end":"11:50","room":"","stream":"","chair":"","type":"plenary","title":"Introduction to ECGBL 2027","authors":"","code":"","flags":[],"id":"02-1140-all-114","related":[]},{"day":"2026-10-02","start":"12:00","end":"12:20","room":"051","stream":"Stream A: Museums, Exhibitions and History","chair":"Phillip Benachour","type":"paper","title":"Balancing Attention in an Immersive Augmented Reality Multiplayer Game for Museum Education","authors":"Jessica L. Bitter, Lorena Müller, Leonie F. E. Ferdinand, and Ulrike Spierling, Hochschule RheinMain, Wiesbaden, Germany","code":"GBL-140","flags":["+G83"],"abstract":"Augmented reality (AR) is increasingly used in cultural heritage exhibitions, yet many systems are designed for single users and can make visitors feel isolated. This study examines how immersive AR games can support group interaction while maintaining attention and interest in the physical exhibits. In a mixed-methods study, 90 participants played a multiplayer AR game we developed for a natural history museum. The game combined a dinosaur fossil with virtual content and collaborative game mechanics. Data were collected through observation, a questionnaire, and interviews. Results show that the game fostered a shared experience, with virtual elements attracting the most attention, while the fossil remained present. After gameplay, participants showed significantly greater interest in examining the fossil and learning about the dinosaur.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5503","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5503/4813","match":1.0,"id":"02-1200-051-115","related":["01-1540-146-163"]},{"day":"2026-10-02","start":"12:00","end":"12:20","room":"052","stream":"Stream B: Business Education","chair":"Ilona Heldal","type":"paper","title":"Extending The Project Win Game™: Teaching Real Options and Moral AI Project Decision-Making","authors":"Gloria J. Miller and Victoria Vaca Núñez, maxmetrics GmbH, Heidelberg, Germany","code":"GBL-049","flags":["non-academic"],"abstract":"This study addresses the following research question: What design principles enable a structured serious game canvas to operationalize complex quantitative and qualitative project management concepts as experiential learning environments? The concept for this work was inspired by observations of how practitioners engaged with The Project Win Game™, a board game designed to simulate project management decision-making. Building on this experience, the game was extended with two gameplay options for corporate training and adult education: Real Options Analysis (ROA) to support disciplined investment decisions under uncertainty, and moral AI. This unconventional pairing of a quantitative financial decision model and a qualitative ethics module within the same game framework expands the range of complex decision topics addressed through games. Conventional project management education often overlooks structured stop-or-scale decisions and the broader societal consequences of project outcomes. The first gameplay option integrates ROA, a financial modelling method that applies option-pricing to staged investment decisions under uncertainty. ROA is advanced for many project managers, so the game teaches it through gameplay. Players simulate phased investments, reassess continuation decisions, and manage downside exposure as project uncertainty unfolds. Serious games are particularly suited for teaching decision-making under uncertainty because they allow participants to experiment in a simulated environment where trade-offs and delayed consequences can be experienced directly rather than explained abstractly. The second gameplay option shifts from financial to ethical complexity and focuses on AI implementation projects in a healthcare context. Participants confront ethical risks arising from algorithmic decision-making, including bias, misidentification, and unintended harm. Through simulated project events, players identify ethical risks, evaluate stakeholder impacts, and recognize how early project decisions shape societal outcomes. The design approach was validated through pilot sessions and is illustrated through ROA and Moral AI extensions.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5072","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5072/4932","match":1.0,"id":"02-1200-052-118","related":[]},{"day":"2026-10-02","start":"12:00","end":"12:20","room":"053","stream":"Stream C: Game Design","chair":"Tharrenos Bratitsis","type":"paper","title":"Playtest Planning and Reporting Toolkit for Game Design in Academic Contexts","authors":"Mikhail Fiadotau, Peadar Callaghan, Martin Sillaots, Anni Hõ and Leonardo Sorrentino, Tallinn University, Tallinn, Estonia, Laura de Carli, IT University of Copenhagen, Denmark and Juhyung Shin, Osaka Electro-Communication University, Japan","code":"GBL-050","flags":["+G12"],"abstract":"The article presents the Playtest Planning and Reporting Toolkit: a set of materials created to help game designers plan, structure, and report on their playtests in a way that is consistent, structured, and recoverable by others. The toolkit is particularly aimed at game creators who operate in academic contexts such as research and development projects and higher education. The toolkit consists of three parts: an information sheet outlining the different types and methods of playtesting, a template for planning playtest sessions, and a separate template to record playtest observations and report on the results. The article establishes the need for a playtesting toolkit in academic contexts; provides a functional definition of playtesting; and introduces the three parts of the toolkit, contextualizing their underlying design considerations.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5118","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5118/4828","match":1.0,"id":"02-1200-053-121","related":["01-1100-18-140"]},{"day":"2026-10-02","start":"12:00","end":"12:20","room":"146","stream":"Stream D: Environmental Issues","chair":"Tobias Baumeister","type":"paper","title":"Playing the Climate Future: Evaluating Climate-adaptation Games for Higher Education","authors":"Nadine Stecher, Ella Howard, Lauren Melfi, Aroni Kabita Porna, Thaddeus Guldbrandsen and Yalinu Poya Wentworth institute of Technology, Boston, USA","code":"GBL-095","flags":[],"abstract":"Climate change presents complex environmental challenges that require students to engage with systems thinking, uncertainty, and long-term decision-making. Instructors increasingly seek teaching approaches that allow students to explore these issues in interactive and applied ways. Game-based learning has emerged as one such approach within experiential and constructivist pedagogy. Climate-themed games can simulate environmental systems, governance processes, and collective decision-making, allowing students to experiment with adaptation strategies and policy trade-offs. Despite the growing number of climate games available, instructors have limited guidance on which games are practical and effective for use in university classrooms. This preliminary study introduces an evaluation of the classroom usability and educational potential of several climate-themed games across higher-education contexts through a comparative analysis of gameplay mechanics, classroom logistics, and relevance to university teaching and learning outcomes. The selection includes cooperative board games, narrative role-play scenarios, and global negotiation simulations. The analysis focuses on two aspects. The first aspect addresses practical classroom usability, including setup requirements, preparation time, player numbers, session length, cognitive complexity, and facilitation demands. These factors determine whether a game can realistically be implemented within typical class periods. The second aspect examines pedagogical framing, including how games potentially support systems thinking, climate literacy, adaptation and mitigation trade-offs, equity considerations, collaborative decision-making, and post-game reflection. The evaluation combines interdisciplinary faculty review, pilot play sessions with faculty, and a literature review of scholarship on game-based learning in higher education, with the emphasis on climate-themed games. Results identify which games are most suitable for short class sessions, which require extended play, and which most effectively support student understanding of climate systems, governance challenges, and long-term adaptation. The study provides a practical guide for instructors interested in integrating climate games into university courses and proposes a comparative framework for evaluating climate game pedagogy across disciplines and multiple game modalities that can inform course design, activity selection, and classroom facilitation.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5359","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5359/4893","match":1.0,"id":"02-1200-146-124","related":[]},{"day":"2026-10-02","start":"12:20","end":"12:40","room":"051","stream":"Stream A: Museums, Exhibitions and History","chair":"Phillip Benachour","type":"paper","title":"Comparing Flow, Narrative, and Spatial Immersion in an HMD-AR Serious Game for Museum Learning","authors":"Yu Liu, Michael Lurz and Ulrike Spierling, Hochschule RheinMain, Wiesbaden, Germany","code":"GBL-034","flags":[],"abstract":"Head-mounted display augmented reality (HMD-AR) can enrich museum-based game-based learning by situating interactive digital content in relation to physical exhibits, but may also distract visitors or shift attention away from interpretation. This paper investigates how flow, narrative, and spatial immersion relate to appreciation-related outcomes in an HMD-AR serious game for museum learning. We designed a coral-reef protection game in three variants, each foregrounding one immersive quality. In a between-subjects field study with 144 valid museum visitors, participants experienced one variant and completed questionnaires and short interviews. Results showed a differentiated pattern: the flow-enhanced variant showed the clearest alignment between design emphasis and perceived immersion, while the spatial-enhanced variant highlighted a tension between environmental richness and awareness of the surrounding museum space. Narrative immersion was associated with perceived meaning and educational value, whereas post-experience engagement intentions were mainly shaped by prior engagement. We argue that HMD-AR museum games should align specific immersive qualities with interpretation, attention, and meaning-making rather than maximize immersion as a generic goal.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5386","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5386/4853","match":1.0,"id":"02-1220-051-116","related":[]},{"day":"2026-10-02","start":"12:20","end":"12:40","room":"052","stream":"Stream B: Business Education","chair":"Ilona Heldal","type":"paper","title":"Designing a Non-digital Game for Entrepreneurial Education: Case Study of Biznes na Medal","authors":"Mateusz Lewandowski, Jagiellonian University, Krakow, Poland","code":"GBL-221","flags":["+G86"],"abstract":"Growing recognition of educational games and their impact on developing competences emphasizes the need for practical and theoretical knowledge on the process of designing effective games for education. Existing approaches emphasize motivational factors, alignment between learning objectives and game elements, learner-specific needs, and domain-specific requirements. The literature offers several frameworks for serious educational game design. However, further research is needed to establish evidence-based design principles, clarify the role of educators in the development process, and extend current findings to less explored learning domains and skills. This paper aims to address this knowledge gap by describing the specificity of the design process of a business education board game for young and adult players with no prior business experience, developed by an academic teacher in a university setting. The study employs a single-case study and autoethnography to explore the author's personal experience of a three-year process of designing the board game Biznes na medal (Business Worth Medal). The findings revealed four author roles related to designing the game and managing the design process: innovator, creator, entrepreneur, and leader. The interconnection between the roles is explained by organizational ambidexterity. As a result, an ICEL framework of author roles in educational game design was proposed.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5402","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5402/4852","match":0.99,"id":"02-1220-052-119","related":["01-1655-18-177"]},{"day":"2026-10-02","start":"12:20","end":"12:40","room":"053","stream":"Stream C: Game Design","chair":"Tharrenos Bratitsis","type":"paper","title":"Racing to Learn: A Formula 1-Inspired Gamification Framework that Sustains Motivation Through Repeated Competitive Cycles","authors":"Cristina Gonzalez and Claudia Solis, Tecnologico de Monterrey, Mexico","code":"GBL-160","flags":[],"abstract":"Gamification is increasingly used in higher education to support student engagement; however, the effects of narrative-driven competitive frameworks on academic performance remain underexplored. This study examines a Formula 1 (F1)–inspired gamification experience implemented in an undergraduate Internet of Things (IoT) course. Students were randomly assigned to one of five racing teams and participated in three competitive \"races\" over a ten-week term. Progress was quantified as distance (in meters), accumulated through optional exercises, collaborative tasks, additional coding functionalities, quizzes, and attendance. The gamification framework was grounded in Self-Determination Theory, aiming to support students' autonomy, competence, and relatedness through multiple engagement pathways, continuous feedback, and team-based competition. To enhance immersion, a Unity-based interface was developed to dynamically visualize team progress, displaying race cars moving across circuits. Symbolic, social, and academic rewards were awarded after each race. A quasi-experimental design compared outcomes between a gamified group and a non-gamified control group under equivalent instructional conditions. Results indicate that students in the gamified condition achieved slightly higher academic outcomes, particularly on the final exam. However, an independent samples t-test showed that this difference was not statistically significant (t (54) = 1.74, p = 0.087), although a small-to-moderate effect size was observed (d = 0.43). Within the gamified group, a strong positive correlation was found between cumulative gamified engagement and final exam performance (r = 0.81, R² = 0.65), suggesting a meaningful association between participation and learning outcomes. The use of repeated competitive cycles with progress resets appeared to sustain motivation while mitigating performance stratification. Overall, the findings suggest that narrative-driven competitive gamification may support engagement and improve academic outcomes when carefully aligned with pedagogical objectives. The proposed framework offers a structured and replicable model for gamification in higher education. Future research should explore the scalability of this approach across diverse disciplines and examine its long-term impact on academic achievement.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5216","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5216/4832","match":1.0,"id":"02-1220-053-122","related":[]},{"day":"2026-10-02","start":"12:20","end":"12:40","room":"146","stream":"Stream D: Environmental Issues","chair":"Tobias Baumeister","type":"paper","title":"Designing a Digital Game on Ratio and Proportion Concept: Integrating Environmental Awareness Through Contextualized Problem-solving","authors":"Selçuk Alkan, Hatay Mustafa Kemal Üniversitesi, Türkiye, Ayça Akın, Antalya Belek University, Türkiye and Zübeyde Er, Çukurova University, Adana, Türkiye","code":"GBL-054","flags":[],"abstract":"This study aimed to design a mathematical problem-based digital game focused on ratio and proportion, incorporating environmental awareness contexts. Using a design-based research methodology, four expert researchers and 24 middle school students participated in the evaluation, offering valuable feedback for refining the game. Data collected through observations and interviews were analyzed qualitatively using open and axial coding. The study’s findings emphasize that effective digital game design integrates three key areas: foundational knowledge of digital gaming, informed by educational technology and game-based learning experts; mathematical theories and approaches, developed with input from mathematics educators; and practical, hands-on knowledge, gathered through student involvement. Additionally, the inclusion of entertainment elements and game mechanics ensured the balance between engagement and educational value. The results underscore the importance of interdisciplinary collaboration in creating educational digital games that are both pedagogically effective and engaging for students.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5102","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5102/4803","match":1.0,"id":"02-1220-146-125","related":[]},{"day":"2026-10-02","start":"12:40","end":"13:00","room":"051","stream":"Stream A: Museums, Exhibitions and History","chair":"Phillip Benachour","type":"paper","title":"Tempus Alatum: Playing Through the Branches of the Timeline","authors":"Peter Mozelius and Andreas Hellerstedt, Mid Sweden University, Sundsvall, Sweden","code":"GBL-155","flags":["+G26"],"abstract":"Modern history education has largely moved away from rote learning, including the memorisation of dates of particular events. However, in order to understand causal explanation, students still need a good grasp of chronology. Consequently, this is an area where history students currently tend to be particularly weak. In the game Tempus Alatum, chronological time is visualised through a combination of a timeline and a technology tree. These two elements are both constructed in game play using cards. The cards, in turn, are based on specific course content. The timeline element uses cards to place historical events in chronological order, in relation to each other. Timelines have seen implementation in historical trivia as well as entertainment games such as the recent Hitster series. Technology trees are hierarchical, visual, and often cyclical graphs. They have been commonly used in strategy video games like Civilization to represent the progression of research and development, but were also originally conceived using cards. This paper presents and discusses a gameplay design for a card driven game that is aligned to concrete learning objectives in an introductory history course, through the combination of these two elements. With the use of the Design Science Research framework this study had a focus on the initial phases of 1) Explicating the problem, and 2) to define the requirements for the Tempus Alatum game. Data were collected in a combination of a literature review, a study of earlier development projects at the university, and a game analysis. The suggested game design is trans-medial, and the initial analogue card game is intended for later implementation as an analogue, digital, and/or hybrid game. The fundamental purpose is to create a game to re-invigorate a neglected, but crucial component in online university courses on history. Moreover, the suggested game is intended as a tool for self-learning with a concrete alignment to specific learning objectives in higher education history courses.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5338","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5338/4866","match":1.0,"id":"02-1240-051-117","related":["01-1430-146-156"]},{"day":"2026-10-02","start":"12:40","end":"13:00","room":"052","stream":"Stream B: Business Education","chair":"Ilona Heldal","type":"paper","title":"Tiers of Engagement III: The Psychological Learning Engine in Online Business Simulators","authors":"GB Guttormsen and Jørn Weines, UiT, The Arctic University of Norway, Alta/Tromsø, Norway","code":"GBL-024","flags":[],"abstract":"This article explores the primary drivers of student learning in the context of business simulation games as part of an online business economics program. Specifically, it investigates whether perceived learning is driven more by a student's internal psychological states or by external course designs, such as added narrative assignments and optional collaboration. By analysing quantitative and qualitative survey data (N=321) in the form of a post-simulator reflection assignment, the study evaluates the impact of motivation and engagement on business simulators as learning environments. The findings reveal that students’ internal psychological states, specifically their intrinsic motivation, active engagement, and depth of reflection make up the primary \"engine of learning”. Demographic factors, such as gender and age, had no significant impact. Pedagogical elements external to the simulator, like narrative assignments and optional collaboration, did not directly improve perceived learning. However, they functioned as essential catalysts. Collaboration acted as a \"social buffer\" that helped students overcome technical and academic frustrations. Added narrative tasks acted as \"metacognitive speed bumps\" that gave motivated students opportunities to switch between types of learning activities, enabling them to connect the simulator to the theoretical curriculum. On the other hand, students with low motivation experienced the tasks as disruptive. The study concludes that while intrinsic motivation and engagement drive learning, thoughtfully designed friction can help in fostering deep, self-regulated learning in online simulators.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5328","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5328/4835","match":1.0,"id":"02-1240-052-120","related":[]},{"day":"2026-10-02","start":"12:40","end":"13:00","room":"053","stream":"Stream C: Game Design","chair":"Tharrenos Bratitsis","type":"paper","title":"Students as Game Designers: Fostering AI Literacy through Project-Based Learning and Design Thinking","authors":"Vasiliki Karampa, Vagia Kakava, Foteini Paraskeva, University of Piraeus, Greece and Ageliki Mellou, International Hellenic University, Thessaloniki, Greece","code":"GBL-094","flags":[],"abstract":"Artificial Intelligence (AI) is rapidly reshaping the digital landscape, highlighting the importance of cultivating AI literacy from an early age. Recognising the need to equip students with the competences required to navigate this new reality, contemporary educational curricula, including those in primary education, consider constructivist, innovative pedagogical approaches particularly effective. Among these, Project-Based Learning (PBL) is widely adopted, as it actively engages learners in processes of responding to authentic challenges, making decisions, and collaboratively creating meaningful outputs in the form of physical, digital, or hybrid artefacts. However, PBL usually follows linear pathways, which does not fully align with the inherently iterative nature of design and construction processes. Consequently, the integration of complementary methodologies that emphasise iteration and creative problem-solving is considered beneficial. Design Thinking (DT), which shares common pedagogical foundations with PBL, can be smoothly aligned with project-based practices, enriching them through iterative cycles of ideation, prototyping, and refinement. This study explores whether a combined PBL-DT approach can foster AI literacy in primary education through game design. The methodology was implemented in the context of an e-course lab delivered to primary school students and was further enriched with design tactics proposed by the Room2Educ8 framework. The students assumed the role of designers and collaboratively developed an augmented escape board game, addressing key aspects of AI literacy. The intervention adopted a pre/post-test design, and its findings indicate that engagement in the PBL-DT workflows seem to support the enhancement of students’ AI literacy effectively. This work contributes by proposing a practical and scalable instructional model that aligns with current educational priorities. It also contributes empirical evidence to the growing field of education for AI literacy and provides insights for researchers and practitioners interested in fostering AI competences using curriculum-aligned, student-centred, game-design methodologies at early stages of education.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5374","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5374/4948","match":1.0,"id":"02-1240-053-123","related":[]},{"day":"2026-10-02","start":"12:40","end":"13:00","room":"146","stream":"Stream D: Environmental Issues","chair":"Tobias Baumeister","type":"paper","title":"GBL in Urban Planning Education: Case Studies of Metropoli and Katopolis Games","authors":"Marta Sanigórska and Paulina Siudyka, Silesian University of Technology, Gliwice, Poland","code":"GBL-176","flags":["+G025"],"abstract":"Game-Based Learning (GBL) is becoming an increasingly promising approach in urban education, particularly for teaching about complex urban or metropolitan structures and spatial relationships. This approach enables an engaging exploration of how a city or metropolis functions, combining analytical and intuitive thinking and allowing participants to test various spatial scenarios in a safe environment. In architecture and urban planning, GBL can effectively support the development of spatial awareness and the ability to interpret urban systems, providing a valuable complement to traditional teaching methods. This article presents case studies of two educational games as learning support tools – Metropoli and Katopolis . These games use card and board game mechanics to introduce key urban planning terms such as city structure, functional layout, transport links, the location of public spaces, and territorial development strategies. Both games function as simplified representations of urban systems, allowing players to explore the consequences of planning decisions by manipulating spatial elements and making strategic choices. Additionally, the games allow participants to examine alternative spatial configurations and observe how their decisions influence overall urban form, thereby supporting learning through experimentation, comparison, and analysis. Research conducted during a series of educational workshops using the Metropoli game, involving school and university students, indicates that GBL supports active learning, increases engagement and develops spatial awareness. It was noted that the game helped to better illustrate the structure of the city, the interdependencies between functions, and the impact of spatial decisions on the quality of the urban environment, as well as facilitating participants’ own interpretations of urban phenomena and discussion of alternative solutions. The findings suggest that educational games can become a valuable complement to traditional teaching methods and serve as a useful tool to support education in architecture and urban planning. The article identifies potential directions for further development of GBL approach in urban education and provides recommendations for integrating games into the academic programme and participatory workshops, emphasising their potential for developing analytical and strategic skills as well as teamwork abilities.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5209","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5209/4880","match":1.0,"id":"02-1240-146-126","related":["01-1520-18-171"]},{"day":"2026-10-02","start":"13:00","end":"14:00","room":"","stream":"","chair":"","type":"break","title":"Lunch","authors":"","code":"","flags":[],"id":"02-1300-all-127","related":[]},{"day":"2026-10-02","start":"14:00","end":"14:20","room":"051","stream":"Stream A: Professional Development","chair":"Annica Lau","type":"paper","title":"Playful Serious Gaming for Change Management","authors":"Ton Spil, Guido Bruinsma and Mark Tool, University of Twente, Enschede, The Netherlands","code":"GBL-164","flags":["+G38","+G85"],"abstract":"Change management is among the more difficult professional competencies to develop, and conventional training approaches produce limited retention and transfer. Serious games offer an evidence-based alternative, yet a structural design flaw undermines their effectiveness in practice: domain theory is routinely embedded as thematic decoration, allowing players to complete the game without engaging with it. This study addressed that flaw through iterative serious game design. Drawing on De Caluwe and Vermaak's (2003) colour-coded change management framework, six prototypes were developed and evaluated across two design cycles. Two designs are reported. The first enforces theoretical knowledge mechanically, requiring players to apply specific change management actions to accumulate employee support and clear phase transitions. The second, modelled on the commercial card game Exploding Kittens, sustains engagement through deception, bartering, and crisis management, but enforces theory less structurally. The prototypes reveal a central design tension: mechanical enforcement of theory risks producing a structured workshop rather than a game, while prioritising engagement risks reducing theoretical depth. Theory-as-mechanical-prerequisite is established as a transferable design principle, and the balance between instructional rigour and player engagement is identified as the primary open challenge for future iterations.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5422","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5422/4892","match":1.0,"id":"02-1400-051-128","related":["01-1440-146-157","01-1550-146-164"]},{"day":"2026-10-02","start":"14:00","end":"14:20","room":"052","stream":"Stream B: Business Education","chair":"Michael O'Brien","type":"paper","title":"ThatSoftwareGame: Experiential Learning for Project Management Decisions and Debriefing","authors":"André Nitze, Brandenburg University of Applied Sciences, Brandenburg an der Havel, Germany","code":"GBL-257","flags":["presentation only","+G92"],"id":"02-1400-052-130","related":["01-1500-146-159"]},{"day":"2026-10-02","start":"14:00","end":"14:20","room":"053","stream":"Stream C: Academe","chair":"Edith Debrenti","type":"paper","title":"Arcademia: A Global Game Ecosystem for Learning, Research and Community","authors":"Lance Bunt, North-West University, Vanderbijlpark, South Africa, Michael Lowen and Matthew Freeman, University of Lincoln, Lincolnshire, UK","code":"GBL-052","flags":[],"abstract":"Game jams have become widely recognised as effective environments for experiential learning, rapid prototyping, and collaborative creativity within computing and game design education. However, these events are often temporally bounded activities that conclude once the development sprint ends, limiting their potential as a sustained educational and research infrastructure. This paper introduces Arcademia, an international academic initiative that reconceptualises the game jam as a foundational component within a broader ecosystem designed to support teaching and learning, research and community engagement. Arcademia connects educational institutions across continents through a network of collaborative activities, shared infrastructure, and playable artefacts, positioning playful production and legacy archival as an enduring practice rather than a one-off event. Within this ecosystem, the international game jam functions as a mechanism for engagement, a collaborative development sprint where students rapidly ideate, prototype, and deliver playable games in response to a shared theme. Extending beyond this initial activation, the initiative is structured around three interconnected pillars. The first pillar, teaching and learning, frames Arcademia as a pedagogical ecosystem that encourages interdisciplinary collaboration, reflective practice, and authentic problem-solving as students present their outcomes through short pitches to local and regional judges. The second pillar, research, treats the initiative as a living laboratory for the scholarship of teaching and learning, supported by data collection, artefact analysis, and cross-institutional collaboration among educators. The third pillar, community engagement, ensures the persistence of student work by deploying completed games on physical arcade cabinets at participating institutions, establishing a distributed archive that symbolises global academic collaboration. By articulating this conceptual model, this paper contributes to discussions in game-based learning on how playful development environments can be structured as sustainable ecosystems that transcend conventional event-based constraints, thereby strengthening collaboration among institutions, students, researchers, and industry professionals.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5459","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5459/4816","match":1.0,"id":"02-1400-053-132","related":[]},{"day":"2026-10-02","start":"14:00","end":"14:20","room":"146","stream":"Stream D: Design Issues","chair":"Seyed Mohammad Seyed Ardakani","type":"paper","title":"Designing with Unpredictable Narrators: Tensions in AI-Mediated Game-Based Learning","authors":"Julie Madelen Madshaven, Christian Robere Simonsen and Christian W. Omlin, University of Agder, Grimstad, Norway","code":"GBL-043","flags":[],"abstract":"In AI-mediated game-based learning, generative AI introduces design tensions. This study explores these tensions in Temporium, a digital educational game where undergraduate students engage with historical consciousness through interaction with a generative narrative agent. The game invites students to explore how individuals, groups, and institutions are historically conditioned and how interpretations of the past shape understanding of the present and perspectives on the future. Unlike scripted systems, the generative AI functions as a semi-autonomous agent that reframes how historical situations are understood in response to player-system interaction. The game was deployed with 51 students, and gameplay logs were treated as the primary data source. The study adopts a design-oriented approach, focusing on how player-system interaction unfolds rather than on learning outcomes. Gameplay logs were analysed through an iterative coding process to identify failure modes and subsequently interpreted as design tensions reflecting underlying structural trade-offs. The analysis identified tensions such as instructional steering versus generative agency, narrative coherence versus exploratory freedom, and information availability versus interpretive participation. These tensions are not isolated system failures, but structural trade-offs that influence interaction and create points of friction between AI-generated outputs and pedagogical intentions. Understanding such tensions is essential before learning outcomes can be meaningfully evaluated. By identifying them, this work provides a basis for understanding the design of AI-mediated game-based learning systems and clarifies the constraints and conditions these systems introduce for supporting interpretation and historical consciousness.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5202","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5202/4857","match":1.0,"id":"02-1400-146-134","related":[]},{"day":"2026-10-02","start":"14:20","end":"14:40","room":"051","stream":"Stream A: Professional Development","chair":"Annica Lau","type":"paper","title":"From Prototype to Pitch: Learning Entrepreneurial Communication Through Gameplay","authors":"Nicholas Brady and Michael O'Brien, University of Limerick, Limerick, Ireland","code":"GBL-014","flags":[],"abstract":"Technical-discipline entrepreneurship students often equate entrepreneurial success with product quality rather than the ability to communicate value. This paper presents a qualitative, practice-based case study of a competitive classroom activity designed to challenge that assumption. The “airplane storytelling game” was implemented over four annual cohorts within an undergraduate entrepreneurship elective on a software development programme, involving approximately 12 students per cohort and 48 students in total. Working in small teams, students designed and tested a paper aircraft capable of carrying a coin before delivering a sales-style pitch to judges acting as investors. Prototype performance and pitch quality received equal weighting. Data were drawn from contemporaneous lecturer observation notes, student comments recorded during post-activity discussion, and reflective teaching notes. The cohort-level implementation, rather than the individual student, was the principal unit of comparison. Across the four cohorts, most teams devoted substantially more effort to technical refinement than to pitch preparation. Teams repeatedly tested folds, wing structures and weight distribution, while pitches were often prepared late and delivered with limited narrative structure. More persuasive presentations frequently outperformed technically stronger prototypes, generating surprise and prompting students to reconsider assumptions about entrepreneurial success. The paper interprets this discrepancy as a form of experiential misalignment: gameplay makes the consequences of underinvesting in communication visible, thereby creating a basis for reflection and conceptual learning. The findings do not suggest that communication substitutes for product quality; rather, they show that technical value must be made clear, credible and relevant to stakeholders. The study contributes a replicable, low-technology example of games-based entrepreneurship education and identifies practical implications for teaching pitching, teamwork, value articulation and the allocation of effort under time pressure. It also acknowledges the limits of cohort-level observational evidence and the instructor’s combined roles as designer, judge and analyst within a single institutional and disciplinary setting and context.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5343","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5343/4815","match":1.0,"id":"02-1420-051-129","related":[]},{"day":"2026-10-02","start":"14:20","end":"14:40","room":"052","stream":"Stream B: Business Education","chair":"Michael O'Brien","type":"paper","title":"MitiGate: Risk Management Collaborative Tabletop Strategy Game","authors":"Martin Sillaots, Tallinn University, Estonia","code":"GBL-044","flags":["+G12"],"abstract":"Risk management is a critical component of project management and academic training. However, traditional pedagogical approaches often fail to engage learners, leading to a shallow understanding of risk mitigation strategies. In practice, risk management is frequently perceived as a bureaucratic requirement rather than a strategic tool, resulting in hastily generated documentation that lacks practical relevance. Furthermore, time constraints in training schedules frequently lead to the omission of risk management modules. To address these educational and practical challenges, this study explores the potential of game-based learning through MitiGate—a collaborative tabletop strategy game designed to introduce risk management methodologies and simulate real-world countermeasures across academic and corporate training environments. Following a Design-Based Research framework, MitiGate underwent three cycles of prototyping and playtesting with university students, corporate learners, project management trainers, and professional game designers. Data were collected via feedback questionnaires, observations, and expert reviews to evaluate game mechanics and player perceptions. The findings demonstrate high overall player satisfaction and show that MitiGate successfully facilitated strategic risk discussions. While participants identified opportunities for mechanical refinement—specifically regarding the balance of luck and victory conditions—the iterative design process converted complex risk concepts into playable mechanics with the potential to support collaborative decision-making and soft-skill awareness.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5326","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5326/4885","match":1.0,"id":"02-1420-052-131","related":["01-1100-18-140"]},{"day":"2026-10-02","start":"14:20","end":"14:40","room":"053","stream":"Stream C: Academe","chair":"Edith Debrenti","type":"paper","title":"From Games to Consequences: Scaffolding Professional Accountability Through Game-based Learning and High-Fidelity Simulation","authors":"Matthew Daniels, The University of Limerick, Ireland","code":"","flags":[],"abstract":"Game‑based learning (GBL) is widely used in higher education to introduce complex professional concepts through low‑risk, engaging activities. While its motivational benefits are well established, a persistent challenge remains: how to design learning pathways that extend the strengths of games into high‑stakes contexts where learners must demonstrate credible, profession‑ready performance. This paper addresses that challenge through a case study of a master 's-level International Project Management programme that intentionally scaffolds learning from low‑stakes serious games to a high‑fidelity, performance‑oriented simulation. In the first phase, analogue and digital games are used as conceptual springboards to support shared understanding of planning, risk, governance, and ethical dilemmas. In the second phase, students transition into a six‑week commercial‑style simulation, adopting formal project roles and delivering an international project under strict evidential and assessment constraints. Drawing on portfolio analysis, a PRME‑aligned survey, and documentary evidence, the paper shows how this progression supports deeper professional accountability, reflective control, and responsible decision‑making without sacrificing engagement. For GBL practitioners, the study offers a transferable design pattern for bridging low‑ and high‑stakes learning environments. This study contributes to games‑based learning research by evidencing how deliberately escalating stakes—from low‑risk games to high‑fidelity simulations—supports the transfer of game‑based insight into accountable, profession‑ready practice.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/4722","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/4722/4824","match":0.99,"id":"02-1420-053-133","related":[]},{"day":"2026-10-02","start":"14:20","end":"14:40","room":"146","stream":"Stream D: Design Issues","chair":"Seyed Mohammad Seyed Ardakani","type":"paper","title":"The Means of an End: Applying the Peak-end Theory to Game-based Learning Design","authors":"Martin Steinicke, Aisha Animashaun, Carsten Busch, Alexander Kramer, Leah Sommer, Martin Roddewig and Matthias Strobel, HTW Berlin, Germany","code":"","flags":["uncertain"],"abstract":"This study investigates the influence of the Peak-End Theory on motivation and experience in game-based learning (GBL), focusing specifically on the role of the game’s ending. Drawing on Kahneman et al.’s (1993) psychological model, which posits that people evaluate past experiences primarily based on the most intense moment (peak) and the final moment (end), we conducted an A/B test using a game titled Complex Space Adventure, designed to teach complex numbers in STEM education. Two versions were developed: one with a minimal, abrupt ending (control group) and another with a narratively enriched farewell sequence (experimental group). A total of 39 participants completed one version of the game and the Reversed Instructional Materials Motivation Survey (RIMMS) and four subscales of the Game Experience Questionnaire (GEQ). Results revealed statistically significant and medium to large effect sizes in favor of the version with the enhanced ending across all ARCS dimensions (Attention, Relevance, Confidence, Satisfaction) and the used GEQ subscales (Competence, Flow, Positive Affect, Negative Affect). Notably, the ending had no measurable impact on gameplay mechanics or content delivery, suggesting that the observed differences stem from retrospective memory evaluation rather than actual learning or engagement. These findings strongly support the applicability of the Peak-End Theory in serious game design, demonstrating that even a brief, narrative-driven conclusion can significantly shape learners’ perceptions of relevance, confidence, and overall satisfaction. The study underscores the importance of intentional design of game endings, not merely as closure, but as a strategic tool to enhance motivation, foster self-efficacy, and promote future engagement.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.p   const rooms = ROOM_ORDER.filter(r => dayItems.some(d => d.room === r));
  return `<div class="tools">
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search titles, authors, abstracts…" value="${esc(state.q)}" autocomplete="off" enterkeyhint="search"></label>
    ${state.q ? '' : `<div class="chips" role="group" aria-label="Room"><button class="chip" data-room="all" aria-pressed="${state.room === 'all'}">All rooms</button>${rooms.map(r => `<button class="chip" data-room="${r}" aria-pressed="${state.room === r}"><i style="background:var(--r${r})"></i>${r}</button>`).join('')}</div>`}
  </div>`;
}
function viewSchedule() {
  const dayItems = DATA.filter(d => d.day === state.day);
  if (state.q.trim()) {
    const hits = filterItems(DATA);
    let html = toolsHtml(dayItems) + `<div class="view-head"><h2>${hits.length} match${hits.length === 1 ? '' : 'es'}</h2><span class="sub">across all three days</span></div>`;
    if (!hits.length) return html + '<div class="empty">Nothing matches. Try a surname, a room or a keyword.</div>';
    for (const day of DAYS) {
      const h = hits.filter(d => d.day === day);
      if (h.length) html += `<div class="section-label">${DAY_NAME[day]} <span class="n">${h.length}</span></div><div class="grid">${sortItems(h).map(d => card(d, { showTime: true })).join('')}</div>`;
    }
    return html;
  }
  const items = filterItems(dayItems);
  return toolsHtml(dayItems) + `<div class="view-head"><h2>${DAY_NAME[state.day]}</h2><span class="sub">${items.filter(d => !isSpan(d)).length} sessions${state.room !== 'all' ? ' in room ' + state.room : ''} · tap any card for the abstract</span></div>` + slotsHtml(items, state.day);
}
function viewStarred() {
  const list = sortItems(DATA.filter(d => stars.has(d.id) || isMine(d)));
  let html = `<div class="view-head"><h2>Starred</h2><span class="sub">Tap ☆ on any session to add it here. Saved on this device.</span></div>`;
  for (const day of DAYS) {
    const h = list.filter(d => d.day === day);
    if (h.length) html += `<div class="section-label">${DAY_NAME[day]} <span class="n">${h.length}</span></div><div class="grid">${h.map(d => card(d, { showTime: true })).join('')}</div>`;
  }
  return html;
}
function viewInfo() {
  return `<div class="view-head"><h2>Practical information</h2><span class="sub">From the official joining instructions</span></div>
  <div class="info">
    <section><h3>Venue</h3><p>TU Darmstadt, Merckstraße 25, 64283 Darmstadt (building S3/06).</p>
      <p>Plenary sessions and keynotes in <b>Room 051</b>. Parallel streams in 051, 052, 053, 21 and 146. Games judging in Room 18 (and 146 on Thursday afternoon).</p>
      <div class="links"><a href="https://www.google.com/maps/search/?api=1&query=TU+Darmstadt+Merckstra%C3%9Fe+25+Darmstadt" target="_blank" rel="noopener">Map ↗</a><a href="https://www.google.com/maps/d/viewer?mid=1TWCpYgXuyuX9g5Svfwu2jfsiYcA" target="_blank" rel="noopener">Key locations ↗</a></div></section>
    <section><h3>Thursday evening</h3><ul><li><b>18:00–19:00</b> walking tour, “Darmstadt at a glance” (pre-booked). Meet at the Darmstadt Shop, Luisencenter.</li><li><b>19:30</b> conference dinner at <b>Braustübl</b>, Goebelstraße 7. Smart casual. About 10 minutes by bus or 30 minutes on foot from the tour.</li></ul>
      <div class="links"><a href="https://www.google.com/maps/search/?api=1&query=Braust%C3%BCbl+Goebelstra%C3%9Fe+7+Darmstadt" target="_blank" rel="noopener">Braustübl map ↗</a></div></section>
    <section><h3>Formats</h3><ul><li>Papers: 20 min (15 talk + 5 questions).</li><li>PhD / Masters colloquium: 10 min each, then discussion.</li><li>Games, fully developed: 20 min judging slots.</li><li>Games in development and student games: Pecha Kucha, 6 min 40, in 10-minute slots.</li><li>Posters and game showcase: Friday 10:00–11:00, Lobby and Room 146.</li></ul></section>
    <section><h3>Papers and abstracts</h3><p>Abstracts here come from the open-access proceedings, published for the conference.</p>
      <div class="links"><a href="https://papers.academic-conferences.org/index.php/ecgbl/issue/view/66" target="_blank" rel="noopener">Proceedings vol. 1 ↗</a><a href="https://papers.academic-conferences.org/index.php/ecgbl/issue/view/67" target="_blank" rel="noopener">Vol. 2 ↗</a><a href="https://www.academic-conferences.org/conferences/ecgbl/ecgbl-programme/" target="_blank" rel="noopener">Official programme ↗</a></div></section>
    <section><h3>Getting there</h3><ul><li>From Darmstadt Hbf: tram 2 or 3 to <b>Schloss</b>, then a short walk.</li><li>From Frankfurt Airport: HEAG AirLiner bus, about 32 minutes.</li><li>Frankfurt Hbf to Darmstadt: about 17 minutes by train.</li></ul></section>
    <section><h3>About this page</h3><p>Built by <a href="https://paidiaconsulting.com">Paidia Consulting</a> from the published physical programme and games timetable (25 Sep 2026) and the proceedings. Times are Darmstadt time (CEST), whatever timezone your phone is in.</p><p>Room-21 PhD timings and a few cells were hard to read in the printed programme and are marked. On the day, the registration desk has the last word on changes.</p></section>
  </div>`;
}

// ---------- render ----------
function render(opts = {}) {
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === state.view));
  const n = berlinNow();
  document.querySelectorAll('#days button').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.day === state.day);
    b.innerHTML = b.textContent.replace(/<.*/, '') + (b.dataset.day === n.date ? '<span class="dot" title="Today"></span>' : '');
  });
  $('#days').style.visibility = (state.view === 'starred' || state.view === 'info' || (state.view === 'schedule' && state.q.trim())) ? 'hidden' : 'visible';
  const main = $('#main');
  const focusQ = document.activeElement && document.activeElement.id === 'q';
  const caret = focusQ ? document.activeElement.selectionStart : null;
  main.innerHTML = state.view === 'now' ? viewNow() : state.view === 'schedule' ? viewSchedule() : state.view === 'starred' ? viewStarred() : viewInfo();
  const cur = $('.jump .cur');
  if (cur) cur.parentElement.scrollLeft = cur.offsetLeft - cur.parentElement.offsetLeft - 60;
  if (focusQ) { const q = $('#q'); q.focus(); try { q.setSelectionRange(caret, caret); } catch (e) {} }
  if (opts.scrollNow && state.view === 'schedule') {
    const nl = $('#nowline'), live = $('.slot.live');
    const target = live || nl;
    if (target) target.scrollIntoView({ block: 'start' });
  }
}
function tick() {
  const n = berlinNow();
  $('#clockT').textContent = fmt(n.min % 1440);
  $('#clockZ').textContent = (SIM ? 'Preview · ' : '') + new Date(n.date + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) + ' · Darmstadt';
  $('#clock').classList.toggle('sim', !!SIM);
}

let lastMin = null;
setInterval(() => {
  tick();
  const n = berlinNow();
  if (n.min !== lastMin) {
    lastMin = n.min;
    // re-render each minute unless the user is typing or reading an open card mid-scroll
    if (document.activeElement && document.activeElement.id === 'q') return;
    if (document.activeElement && document.activeElement.id === 'scrub') return;
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }
}, 5000);

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1600); }

function goTo(id) {
  const d = BY_ID[id];
  if (!d) return;
  state.view = 'schedule'; state.day = d.day; state.q = ''; state.room = 'all';
  state.open.add(id);
  render();
  const el = document.getElementById('c-' + id);
  if (el) { el.scrollIntoView({ block: 'center' }); }
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button, a[data-goto]');
  if (!t) return;
  if (t.dataset.view) { state.view = t.dataset.view; try { localStorage.setItem('ecgbl26-view', state.view); } catch (err) {} window.scrollTo(0, 0); render({ scrollNow: true }); return; }
  if (t.dataset.day) { state.day = t.dataset.day; state.live = true; state.scrubMin = null; window.scrollTo(0, 0); render({ scrollNow: true }); return; }
  if (t.dataset.star) {
    const id = t.dataset.star;
    stars.has(id) ? stars.delete(id) : stars.add(id); saveStars();
    toast(stars.has(id) ? 'Starred' : 'Removed from starred');
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (t.dataset.toggle) {
    const id = t.dataset.toggle;
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    const el = document.getElementById('c-' + id);
    if (el) {
      el.classList.toggle('open', state.open.has(id));
      t.setAttribute('aria-expanded', state.open.has(id));
      $('.detail', el).innerHTML = state.open.has(id) ? detail(BY_ID[id]) : '';
    }
    return;
  }
  if (t.dataset.goto) { e.preventDefault(); goTo(t.dataset.goto); history.replaceState(null, '', '#i=' + t.dataset.goto); return; }
  if (t.dataset.room) { state.room = (t.classList.contains('stream') && state.room === t.dataset.room) ? 'all' : t.dataset.room; const y = window.scrollY; render(); if (t.classList.contains('stream')) window.scrollTo(0, y); return; }
  if (t.dataset.jump) { state.live = false; state.scrubMin = +t.dataset.jump; render(); return; }
  if (t.dataset.share) {
    const url = location.origin + location.pathname + '#i=' + t.dataset.share;
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast('Link copied'), () => toast(url));
    return;
  }
  if (t.id === 'liveBtn') { state.live = true; state.scrubMin = null; render(); return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'scrub') {
    state.live = false; state.scrubMin = +e.target.value;
    // light re-render that keeps the slider under the finger
    const v = e.target.value;
    render();
    const s = $('#scrub'); if (s) { s.value = v; s.focus(); }
  }
  if (e.target.id === 'q') { state.q = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); state.view = 'schedule'; render(); const q = $('#q'); if (q) q.focus(); }
  if (e.key === 'Escape' && state.q) { state.q = ''; render(); }
});

// deep link: #i=<id>
function fromHash() {
  const m = /#i=([^&]+)/.exec(location.hash);
  if (m && BY_ID[decodeURIComponent(m[1])]) { goTo(decodeURIComponent(m[1])); return true; }
  return false;
}
window.addEventListener('hashchange', fromHash);
tick();
if (!fromHash()) render({ scrollNow: true });
</script>
