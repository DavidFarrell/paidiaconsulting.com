d":[]},{"day":"2026-10-01","start":"11:50","end":"12:10","room":"052","stream":"Stream B: STEM","chair":"Micaela Fonseca","type":"paper","title":"Collaborative Learning in the Caribbeans: Onboarding the Math Pirates","authors":"Peter Mozelius, Jimmy Jaldemark, Mid Sweden University, Sundsvall, Sweden, Rasmus Pechuel and Tim Kreuzberg, Ingenious Knowledge, Cologne,","code":"","flags":["uncertain"],"abstract":"At the same time as research studies report on excessive gaming in online communities, the general mathematical skills are decreasing. The international standardised PISA assessments in 2022 showed a clear drop in math performance compared to 2018, with a large number of students in the OECD countries classified as low performers. Building on the identified strong motivational effects of collaborative gaming this paper presents a and discusses a design and development concept for an educational game on math. Jimmy writes something here on collaborative learning. A design science research approach was used to explicate the problem and to gather requirements for a multi-player game in pirate settings. This paper presents the two initial phases of a Design science research (DSR) project as outlined by Johannesson and Perjons. In Phase 1, the initial problem has been explicated in a combination of a literature review and discussions among the authors. This was followed up in Phase 2 with the recommended definition of requirements in a combination of an educational game analysis and discussions with professional game developers. As a member of a pirate member crew, players should carry out calculations to solve concrete problems. They do this in a virtual 3D pirate world on their mobile devices, in which they travel across the sea in crews with their own ship. The objective is to win pirate battles as a team, with each player focusing on their own specific tasks to contribute to a common effort. Each ship requires different functions, such as a navigator, someone using the cannons, and someone controlling the sails. This allows for interesting gameplay mechanics, such as different types of tasks connected to the individual roles. The environment of the game is either preset by the hosting server (a central instance), or configured by teachers. Teachers can create their own internal lobbies (pirate leagues) for their students, in which they can set different rules for the game, roles, and mathematical topics based on task presets.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5337","pdf_url":"","match":1.0,"id":"01-1150-052-17","related":[]},{"day":"2026-10-01","start":"11:50","end":"12:10","room":"053","stream":"Stream C: Mini Track on Educational Escape Rooms","chair":"Panagiotis Fotaris","type":"paper","title":"Investigating Educational Escape Room Games in Mathematics: Effects on Achievement and Perceptions","authors":"Huveyda Tukle, Yavuz Samur and Merve Kara, Bahcesehir University, Istanbul, Turkiye","code":"GBL-170","flags":[],"abstract":"The use of game-based learning approaches in formal education has gained increasing attention; however, there remains limited empirical evidence regarding the effectiveness of educational escape room games in improving measurable learning outcomes, particularly within mathematics education. In addition, there is a need for structured design approaches that clearly align such game-based interventions with curriculum objectives and learning outcomes. This study aims to address these gaps by investigating the impact of an educational escape room game on students’ academic achievement in mathematics, as well as exploring students’ perceptions of this innovative learning experience. The study employs a quasi-experimental research design involving an experimental group and a control group within a 6th-grade mathematics context. Two educational escape room games were systematically designed, developed, and implemented in alignment with specific curriculum learning outcomes, following a documented ADDIE-based design and implementation workflow that incorporated collaborative problem-solving tasks, game mechanics, and time-bound challenges. The intervention was conducted over a four-week period (8 instructional hours), during which the experimental group participated in escape room-based learning activities, while the control group received traditional instruction covering the same mathematical content. Quantitative data were collected through pre- and post-tests to measure students’ academic achievement, and the results were analysed to compare group performance, including effect-size estimates. The experimental group demonstrated a statistically significant improvement compared to the control group, with a large effect size. Qualitative data obtained through semi-structured interviews further revealed that students perceived the escape room activities as engaging, motivating, and supportive of deeper conceptual understanding, reporting gains in problem-solving skills, collaboration, and self-perceived retention of mathematical content. This study contributes to the field of game-based learning by providing empirical evidence of the effectiveness of educational escape rooms in mathematics education and by presenting a structured, curriculum-aligned escape room design approach. The findings offer practical implications for educators and instructional designers seeking to integrate interactive, collaborative, and immersive learning environments into formal educational settings, whilst highlighting the need for further research with larger samples and delayed retention measures.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5543","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5543/4899","match":1.0,"id":"01-1150-053-23","related":[]},{"day":"2026-10-01","start":"11:50","end":"12:10","room":"146","stream":"Stream D: Mini Track on Game-based Learning for Lifelong Learning","chair":"Martin Steinicke","type":"paper","title":"One Game Does Not Fit All: Designing Financial Education Serious Games Across the Life Course","authors":"Célia Magras, Association Crésus, Strasbourg, France","code":"GBL-253","flags":["presentation only"],"id":"01-1150-146-38","related":[]},{"day":"2026-10-01","start":"11:50","end":"12:10","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Rajiv Basaiawmoit and Katharina Fohrmann","type":"games-judging","title":"Fun Tac Toe","authors":"Mohammad Ali Eljinini, Isra University, Jordan","code":"Game-048","flags":["+GBL-212 Thur pm"],"id":"01-1150-18-142","related":["01-1450-052-48"]},{"day":"2026-10-01","start":"11:50","end":"12:10","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Guido Bruinsma and Lisa Baule","type":"games-judging","title":"NLP Detective","authors":"Lydia Wharton, University of Leeds, UK","code":"Game-028","flags":[],"id":"01-1150-18-148","related":[]},{"day":"2026-10-01","start":"11:50","end":"12:10","room":"18","stream":"Game Judging: Fully developed games (judging panel 3)","chair":"Judges: Taru Deva and Geeske Kemper","type":"games-judging","title":"Power Shift","authors":"Laura Sharp, Mia Wilson, Izah Bowes, Samuel Owusu Achiaw and Ailsa Foley, University of Glasgow, UK","code":"Game-019","flags":["+GBL-174 Poster"],"id":"01-1150-18-154","related":["02-1000-all-104"]},{"day":"2026-10-01","start":"11:50","end":"12:00","room":"21","stream":"Stream D: PhD and Masters Colloquium Track","chair":"","type":"phd","title":"Learning Through Dissonance: Modeling Cognitive Conflict in Narrative-Driven Educational Games","authors":"Jingyu Wang and Imran Hazra, Northeastern University, Vancouver, Canada","code":"GBL-148","flags":["Masters","uncertain-time"],"abstract":"In many serious games, psychological concepts function as narrative backdrop rather than as structures players can actively engage with. Cognitive dissonance is a clear example: players may sense the tension between belief and action, yet the dynamics through which that tension forms and resolves remain implicit in the mechanics. This work operationalises cognitive dissonance as playable dynamics within an interactive narrative system. Belief Strength tracks how firmly a player holds a declared stance, Cognitive Strain accumulates from the divergence between that belief and in-game actions, and three labelled reduction pathways (behavior change, belief revision, and justification) are instantiated as choosable options rather than abstract explanations. A Persona Dominance Ratio captures which coping pattern has stabilised across the session. The prototype examines whether experiencing dissonance through interactive decision-making supports conceptual understanding of the theory, and whether engaging with these mechanics prompts reflection on personal patterns of rationalization and belief change.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5439","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5439/4930","match":1.0,"id":"01-1150-21-32","related":[]},{"day":"2026-10-01","start":"12:10","end":"12:30","room":"051","stream":"Stream A: GBL and Children","chair":"Sarah von Styp Rekowski","type":"paper","title":"Gaming in the classroom: a phenomenological study of student experiences","authors":"Ciaran Curtin, Private, Carlow, Ireland","code":"GBL-260","flags":["presentation only"],"id":"01-1210-051-12","related":[]},{"day":"2026-10-01","start":"12:10","end":"12:30","room":"052","stream":"Stream B: STEM","chair":"Micaela Fonseca","type":"paper","title":"Smarty Pants Stick to Your Periodic Table! Learning Nomenclature and Formula Writing Rolling Dice!","authors":"Julio Garay, City University of New York/Bronx community College, New York, USA","code":"GBL-018","flags":["presentation only"],"id":"01-1210-052-18","related":[]},{"day":"2026-10-01","start":"12:10","end":"12:30","room":"053","stream":"Stream C: Mini Track on Educational Escape Rooms","chair":"Panagiotis Fotaris","type":"paper","title":"From Vibe Coding to Playable Educational Escape Rooms: Extending Room2Educ8 for AI-Assisted Prototyping","authors":"Panagiotis Fotaris, University of Brighton, UK and Theodoros Mastoras, University of Macedonia,","code":"","flags":["uncertain"],"abstract":"Educational escape rooms (EERs) can support active, collaborative and problem-based learning, but developing digital and hybrid versions can create technical and interaction-design challenges for educators. Generative AI has been used to support EER development through persona creation, puzzle ideation, hint generation and debriefing, yet its role in implementing established designs as playable artefacts has received less attention. This study investigates AI-assisted prototyping within Room2Educ8, a Design Thinking framework for learner-centred EER development. An exploratory qualitative multiple-case study involved 23 postgraduate User Experience Design students working in four groups. All groups designed an EER as assessed coursework and adopted vibe coding during prototyping, although its use was neither required nor demonstrated in class. They used natural-language prompts with AI-assisted coding tools to create and revise software. Data sources included assessment portfolios, playable artefacts, project demonstrations, group viva responses, retained prompts, screenshots, individual reflections and testing records. Across the cases, AI-assisted coding was introduced after target audiences, learning objectives, narratives and puzzle structures had been established. It was used to implement interfaces, answer validation, feedback, hints, timers, navigation and transitions between digital and physical tasks. Playtesting identified problems involving ambiguous instructions, alternative valid answers, feedback, hint scaffolding, progression and accessibility. Broader challenges concerned behavioural specification, control over generated outputs, pedagogical alignment, documentation and consistency across generated media. The findings show how AI-assisted coding supported the implementation and revision of interactive EERs, although development time, effort and learning outcomes were not measured. The paper proposes Room2Educ8-AIP, a preliminary extension comprising seven iterative actions within the Prototype stage: specify, generate, inspect, revise, playtest, align and document. The extension offers educators and learning designers a structured way to integrate AI-assisted coding into EER development while maintaining design control, pedagogical alignment and clear documentation of implementation decisions.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5157","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5157/4829","match":1.0,"id":"01-1210-053-24","related":[]},{"day":"2026-10-01","start":"12:10","end":"12:30","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Rajiv Basaiawmoit and Katharina Fohrmann","type":"games-judging","title":"Gruyotte's Adventure","authors":"Azizah Boo-Frey, Mehdi Mele, Le Gruyère AOP & Marvelous Digital - Vevey, Switzerland","code":"Game-040","flags":[],"id":"01-1210-18-143","related":[]},{"day":"2026-10-01","start":"12:10","end":"12:30","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Guido Bruinsma and Lisa Baule","type":"games-judging","title":"Hubbard Math: Blitz","authors":"Seth Lickteig, Kansas State University, USA","code":"Game-077","flags":[],"id":"01-1210-18-149","related":[]},{"day":"2026-10-01","start":"12:10","end":"12:30","room":"18","stream":"Game Judging: Fully developed games (judging panel 3)","chair":"Judges: Taru Deva and Geeske Kemper","type":"games-judging","title":"Square Bun","authors":"Ming Tsui, United Christian College, Hong Kong","code":"Game-045","flags":[],"id":"01-1210-18-155","related":[]},{"day":"2026-10-01","start":"12:10","end":"12:20","room":"21","stream":"Stream D: PhD and Masters Colloquium Track","chair":"","type":"phd","title":"Goodwill Grind: A Career Simulation Game for Civic and Professional Education","authors":"Javeriya Khan, Simona Hans, Xuoum and Saif Ali, AJK Mass Communication Research Center, Jamia Millia Islamia, New Delhi, India","code":"GBL-183","flags":["Masters","uncertain-time"],"abstract":"Young people in urban India tend to imagine professional life through markers like salary, job title, and social prestige. What gets left out of this picture is the texture of everyday working life: the morning routines, the commute, the fatigue, the small ethical decisions made under time pressure, and the constant negotiation between ambition and personal wellbeing. Career guidance programmes address some of this, but they typically operate at the level of aspiration and information rather than lived experience. This paper presents Goodwill Grind, a career simulation game designed to address that gap by turning the daily routine of a working professional into a playable learning system. The game targets players aged 12 to 25 and is built in Unity for Windows desktop. Players begin with a job acceptance letter and navigate a repeated daily loop of waking, preparing for work, commuting through an urban environment, completing workplace tasks, and making evening choices about rest, study, exercise, and social life. Progression moves through five career levels, from Intern to Head of Department, and is governed by four interdependent resource systems: money, energy, Grind Points, and a career Level bar. Civic and moral choices, such as waiting at a pedestrian signal or offering a bus seat to a vulnerable commuter, are embedded directly into gameplay rather than delivered as instructional content. The game compresses real time so that consequences of daily decisions become visible within a single play session, allowing players to observe patterns that would take weeks or months to surface in actual life. The paper draws on Kolb’s experiential learning cycle to explain how the repeated daily loop produces learning, Bogost’s procedural rhetoric to analyse how game mechanics encode an argument about professional life and civic responsibility, and Gee’s learning principles to ground specific design choices around identity, failure, and situated meaning. Level 1 has been prototyped and evaluated through a first cycle of design-based research with ten testers. The paper describes the educational rationale, game design, implementation in Unity, and a proposed evaluation plan. It also reflects on what the design team learned through the process of building the game, connecting the project to constructionist approaches in game-based learning. Goodwill Grind contributes a practical model for embedding civic awareness, work-life balance, and professional readiness within an accessible career simulation. While the game is set in an Indian urban context, the pressures it simulates, balancing productivity with rest, navigating ethical choices under time constraints, and managing the monotony of routine, are common to early professional life across cultures.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5152","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5152/4925","match":1.0,"id":"01-1210-21-33","related":[]},{"day":"2026-10-01","start":"12:40","end":"13:20","room":"051","stream":"","chair":"","type":"keynote","title":"Keynote Presentation: Game-Based Learning in Higher Education: Past, Present, and the Scalable Future of Digital Pedagogy","authors":"Prof. Dr.-Ing. Florian Mehm","code":"","flags":[],"id":"01-1240-051-40","related":[]},{"day":"2026-10-01","start":"13:20","end":"14:30","room":"","stream":"","chair":"","type":"break","title":"Lunch","authors":"","code":"","flags":[],"id":"01-1320-all-41","related":[]},{"day":"2026-10-01","start":"14:30","end":"14:50","room":"051","stream":"Stream A: Artificial Intelligence and Educational Games: When AI Meets Learning through Play","chair":"Christopher Gledhill","type":"paper","title":"AI-Supported Adjudication in Educational Wargames: Integrating LLMs for Strategic-level Simulations","authors":"Thorsten Kodalle, Ugur Uysal, Sven Holger Brünner, Bundeswehr Command and Staff College, Hamburg, and Anna Wagner, Institute for Peace Research and Security Policy, Hamburg, Germany","code":"GBL-079","flags":[],"abstract":"Traditional matrix wargaming relies on human expertise to adjudicate outcomes, which often limits scalability and introduces facilitator bias. This paper introduces an approach using AI to support adjudication in educational wargames on the strategic level designed for professional military education (PME). We discuss the application of Large Language Models (LLMs) as an \"Adjudication Engine\" that processes qualitative player arguments by cross-referencing them with domain data to ensure consistent game world updates. Rather than replacing human judgment, the AI serves as a structured analytical layer that synthesises competing player moves into coherent technical reports across the Diplomacy, Information, Military, and Economic (DIME) dimensions. The study is based on the \"Arctic Hybrid 2026\" Educational Matrix Wargame, conducted at the Bundeswehr Command and Staff College in February 2026, where 18 participants in six teams navigated a fictitious Arctic crisis scenario involving hybrid power projection, based solely on publicly available data. The design integrates a stochastic D20 dice mechanic with qualitative DIME move sets and PMESII (Political, Military, Economic, Social, Infrastructure, Information) effect analysis. Seven AI-steered non-player characters were configured with distinct strategic profiles and behavioural parameters. We detail the \"Adjudication Matrix\" workflow: how player inputs and dice results are transformed by the AI into a coherent technical report, maintaining the simulation’s \"State of the World\" across an initial \"Move 0\" and two additional game rounds. The use of grounded AI systems — most centrally NotebookLM, operating exclusively on curated source corpora continuously updated with game-generated data — proved critical for containing hallucination risk within operationally acceptable bounds. By semi-automating technical adjudication, the game allowed for greater complexity of actors, more rapid turns, and deeper immersion. We observe how structured AI feedback helped participants better understand nonlinear consequences of strategic decisions, including cascading alliance failures and hybrid fait accompli tactics. The paper discusses both potential and limitations of LLM-based adjudication, including the necessity of human oversight and hallucination management in security-sensitive educational contexts.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5476","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5476/4848","match":1.0,"id":"01-1430-051-42","related":[]},{"day":"2026-10-01","start":"14:30","end":"14:50","room":"052","stream":"Stream B: Different Approaches to Learning using GBL","chair":"Peter Vankúš","type":"paper","title":"Learning Through Consequence: Entrepreneurial Learning in a Games-based Simulation","authors":"Michael O'Brien, Yvonne Costin and William Hogan, University of Limerick, Ireland","code":"GBL-015","flags":[],"abstract":"Games-based learning is increasingly embedded within entrepreneurship education; however, limited empirical attention has been given to how business simulations support entrepreneurial learning. This study examines how a business simulation operates as a learning environment in which students learn through the consequences of their decisions. A primarily quantitative, cross-sectional survey design was adopted, with a limited qualitative element provided by open-ended questions. Survey data were collected from 33 postgraduate students participating in an 18-credit business analytics simulation module using SimVenture Evolution. Most attitudinal and evaluative items used five-point response scales. Measures captured perceptions of realism, decision-making confidence, preparedness for entrepreneurial challenges, risk orientation, and mindset development, while six substantive open-ended responses provided contextual insight into decision-making and feedback. Findings indicate that students perceived the simulation as a realistic and immersive entrepreneurial environment supporting experimentation and iterative decision-making. Students reported increased confidence under uncertainty and greater awareness of risk, trade-offs, and strategic consequences. A central feature associated with perceived learning was the ability to observe and respond to decision outcomes over multiple simulated periods, enabling reflection and adaptation. One open-ended response illustrated how the absence of real-world risk could support experimentation. The findings suggest that entrepreneurial learning in business simulations may be supported by consequence-based feedback and iterative decision cycles. The study proposes the “learning through consequence loop” as an evidence-informed interpretation of how decision, consequence, feedback, reflection, and adaptation may interact in the development of decision-making capability. Given the post-only, self-reported design, the model is presented for further testing rather than as a demonstrated causal mechanism.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5305","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5305/4868","match":1.0,"id":"01-1430-052-47","related":[]},{"day":"2026-10-01","start":"14:30","end":"14:50","room":"053","stream":"Stream D: Motivation & Support","chair":"Jordana Garbati","type":"paper","title":"Learner-centered Design in Practice: The Impact of Non-learning Elements on Engagement and Learning Experiences","authors":"Wolfgang Brabänder, Geeske Kemper, Kaja Langer, Lisa Scharrer, Josef Wiemeyer and Stefan Göbel, Technical University of Darmstadt, Germany","code":"GBL-051","flags":[],"abstract":"This paper presents the results of a comprehensive survey conducted on an educational game developed over three years following a learner-centred approach. The final evaluation involved 168 participants engaging with the game, providing both quantitative and qualitative data. Notably, the study found that integrating educational content with non-educational elements or exploratory features proved beneficial, enhancing both motivation and overall learning experiences. The learner-centric development cycle was pivotal in creating a balanced environment that fostered meaningful learning while maintaining engaging gameplay. Data collection included responses to a game experience questionnaire for quantitative analysis, alongside inductively categorised free-form text answers to capture qualitative insights. Participants reported overwhelmingly positive experiences with non-learning content and primarily positive feedback regarding learning components. These findings demonstrate that the inclusion of non-learning-related content can significantly contribute to a positive learning experience by increasing motivation and sustained interaction with educational tools. In addition, the vast majority of responses to the free-form learning survey were positive, further highlighting the beneficial impact of combining educational and non-educational elements to create a motivating and engaging learning environment. Furthermore, the data revealed that participants with existing competence in the relevant subject matter reported higher learning experiences, suggesting that practical application corresponding to the 'Apply' stage of Bloom's taxonomy may be particularly effective in the context of educational games.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5092","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5092/4814","match":0.99,"id":"01-1430-053-52","related":[]},{"day":"2026-10-01","start":"14:30","end":"14:40","room":"146","stream":"Game Judging: Games in Development (Pecha Kucha)","chair":"Judges: Pangiotis Fotaris and Bernadette Spieler","type":"games-judging","title":"The Golden Thread","authors":"Ian Hill, Peter Mozelius and Lisa Salvin, King's College London UK","code":"Game-026","flags":["+GBL-155 Fri","+GBL-169 Thurs 11.50"],"id":"01-1430-146-156","related":["02-1240-051-117"]},{"day":"2026-10-01","start":"14:30","end":"14:40","room":"18","stream":"Game Judging: Student Games (Pecha Kucha)","chair":"Judges: Stefan Gobel and Florian Horn","type":"games-judging","title":"Circular Economy Simulator (CES)","authors":"Theodora Gkika and Aneta Chola, Dora's Designs, Greece","code":"Game-078","flags":[],"id":"01-1430-18-166","related":[]},{"day":"2026-10-01","start":"14:30","end":"14:40","room":"21","stream":"Stream E: PhD Colloquium Track","chair":"Michael Kickmeier-Rust","type":"phd","title":"Designing for Learning Through Play: The MAPeD Framework for Conceptualizing Learning Games","authors":"Peadar Callaghan, Tallinn Universtity, Estonia","code":"GBL-036","flags":["PhD"],"abstract":"Despite learning games’ long history of use and recognized pedagogical potential, the actual results of implementing them in practice have been inconsistent. Existing frameworks for learning game design often prove too complex to be applied, overly narrow in their focus, or reinforce a faulty binary opposition between learning and play. This article introduces a new framework for learning games, a theoretically grounded yet accessible model for researchers and designers. It places games in a two-dimensional space made up of two axes: practice-discourse and authorial-player control. To evaluate the utility of the framework, a validation study was performed with fourteen practitioners from the fields of game design and education. Thematic analysis of the results revealed widespread recognition of the framework’s clarity, simplicity, and adaptability. Participants highlighted the value of the framework as a reflective and communicative tool for designers and stakeholders. The study shows that the framework has potential as a practical and domain-agnostic tool to support the conceptualization, communication, and refinements of learning games.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5375","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5375/4906","match":1.0,"id":"01-1430-21-57","related":[]},{"day":"2026-10-01","start":"14:40","end":"14:50","room":"146","stream":"Game Judging: Games in Development (Pecha Kucha)","chair":"Judges: Pangiotis Fotaris and Bernadette Spieler","type":"games-judging","title":"You Can Change","authors":"Ton Spil, University of Twente Netherlands","code":"Game-038","flags":["+GBL-164 Fri 2pm"],"id":"01-1440-146-157","related":["02-1400-051-128"]},{"day":"2026-10-01","start":"14:40","end":"14:50","room":"18","stream":"Game Judging: Student Games (Pecha Kucha)","chair":"Judges: Stefan Gobel and Florian Horn","type":"games-judging","title":"Time Traveler's Lab (El Laboratorio de la Historia)","authors":"Maria Miquela Benlloch Cerdó, Universitat de les Illes Balears, Spain","code":"Game-080","flags":[],"id":"01-1440-18-167","related":[]},{"day":"2026-10-01","start":"14:40","end":"14:50","room":"21","stream":"Stream E: PhD Colloquium Track","chair":"Michael Kickmeier-Rust","type":"phd","title":"Programming Mechanics in Commercial Games: A Multiple Case Study","authors":"Leonardo Sorrentino, Tallinn University, Tallinn, Estonia","code":"GBL-037","flags":["PhD"],"abstract":"Game based approaches to programming education have shown themselves to be effective at engaging students with the subject matter. The potential has been recognized since the creation of LOGO in the 1960s, and the field has seen a notable expansion since then. The most common approach these games use to teach is level by level maze navigation puzzles. In these games, players write code or place blocks to control the properties and behaviors of entities in the game. Parallel to the increase in educational games, there has been a growing niche of commercial games using programming as the main mechanic. To stand out in a saturated market, some of these games adopt novel and engaging approaches to incorporating programming into their game mechanics, going beyond simple maze navigation. This points to complementarity between educational and commercial games about programming: the former tend to be better pedagogically grounded and aligned with curricular requirements; while the latter offer more innovation and often provide a more engaging player experience. As such, learning from commercial titles could inspire new approaches in educational games about programming and make them more engaging and appealing. To this end, this paper presents a close reading of commercial programming games, with the goal of identifying potential novel directions that educational game designers could follow. Two game were chosen for the analysis: GLADIABOTS , and The Farmer Was Replaced. This article explores how they employ novel approaches to integrate programming with other mechanics and aspects of gameplay, and the learning that affords. More specifically, it looks at how the design of the game allows for the incorporation of sound computing education approaches into the core gameplay loop. As a result of the analysis, the paper presents design recommendations that can contribute to future efforts in creating engaging games for programming education","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5545","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5545/4917","match":1.0,"id":"01-1440-21-58","related":[]},{"day":"2026-10-01","start":"14:50","end":"15:10","room":"051","stream":"Stream A: Artificial Intelligence and Educational Games: When AI Meets Learning through Play","chair":"Christopher Gledhill","type":"paper","title":"Codifying Game-based Creative Writing: A Preliminary Framework","authors":"Allen Jones, University of Stavanger, Norway","code":"GBL-031","flags":[],"id":"01-1450-051-43","related":[]},{"day":"2026-10-01","start":"14:50","end":"15:10","room":"052","stream":"Stream B: Different Approaches to Learning using GBL","chair":"Peter Vankúš","type":"paper","title":"Fun Tac Toe: A Multi-platform Game-based Learning Approach Integrating Trivia with Classic Gameplay","authors":"Mohammad Ali Eljinini, Isra University, Amman, Jordan","code":"GBL-212","flags":["+G48"],"abstract":"Game-Based Learning (GBL) has proved to be an efficient approach for motivating learners and improving educational performance. However, current educational games are prone to fall into one of two categories: immersive and highly sophisticated learning tools or simplistic quiz applications which lack interaction opportunities. Thus, there is a need to design new educational games with lightweight and easy-to-use interface. This paper presents Fun Tac Toe, a multiplatform educational game that combines trivia-based learning elements with the rules of classic Tic-Tac-Toe. In particular, users will have to provide correct answers to knowledge-based questions before marking a cell. The proposed design will help learners to practice retrieval, get instant feedback, stay involved in learning and participate in an interactive experience at the same time. The system is implemented using Flutter and Firebase, providing a scalable architecture that supports mobile, web, and desktop platforms together with real-time multiplayer functionality. The category-based design also enables it to be adapted easily to different educational subjects while preserving the same gameplay mechanics. An initial classroom deployment shows the feasibility of integrating this platform in education at the level of undergraduate teaching and is accompanied by an evaluation framework that considers academic performance, learner engagement, usability, and interaction patterns. The preliminary deployment provides encouraging evidence regarding classroom integration while establishing a foundation for larger controlled experiments. Overall, the paper demonstrates how game mechanics could be utilized for creating accessible and scalable educational experiences, providing researchers with foundation for further research in the area of game-based learning.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5156","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5156/4827","match":1.0,"id":"01-1450-052-48","related":["01-1150-18-142"]},{"day":"2026-10-01","start":"14:50","end":"15:10","room":"053","stream":"Stream D: Motivation & Support","chair":"Jordana Garbati","type":"paper","title":"Localized Leaderboards Improve Motivation, Engagement, and Skill Learning in Employee Training","authors":"Mohammed Alnuri Alanazi and Mihai Boicu, George Mason University, Fairfax, USA","code":"GBL-175","flags":[],"abstract":"This paper presents a preliminary study comparing the educational impact of localized and global leaderboards through an experiment on phishing awareness training in a government organization. The primary contribution shows that narrowing the leaderboard scope to departmental levels can improve employee motivation, engagement, and training performance compared to traditional global and no-leaderboard conditions. An experiment was conducted with 24 participants, uniformly assigned to three groups: localized leaderboard, global leaderboard, and a control group with no leaderboard. Participants completed a web-based phishing awareness training using an online platform developed specifically for this study, consisting of 12 sequential modules, including three gamified quiz activities. Leaderboard scores were calculated based on quiz performance, rewarding both accuracy and response speeds. Motivation was assessed through training completion rate and the Intrinsic Motivation Inventory survey. Engagement was assessed through the number of attempts, usage of coaching hints, and the User Engagement Scale survey. Performance increase was measured using pre- and post-test scores, and group differences were examined via a contrast analysis. The localized leaderboard group showed the highest motivation (100% completion rate compared with 75% for the global leaderboard and control conditions), and the highest engagement (average of 8.13 attempts compared with 3.25 for the global leaderboard and 3.0 for the control), along with a 23.7% improvement in phishing detection performance (compared with no improvement in global leaderboard and a decline of 2.7% in the control group). The analysis showed a statistically significant difference between localized leaderboards and the global leaderboards, no leaderboards, and their combination (p<0.05). These findings offer preliminary evidence that localized leaderboards can improve motivation, engagement, and learning in phishing awareness training by promoting socially relevant comparisons among colleagues. Even though the small sample size limits generalizability, it suggests large-scale, organizational studies on localized leaderboard use in training.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5088","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5088/4802","match":1.0,"id":"01-1450-053-53","related":[]},{"day":"2026-10-01","start":"14:50","end":"15:00","room":"146","stream":"Game Judging: Games in Development (Pecha Kucha)","chair":"Judges: Pangiotis Fotaris and Bernadette Spieler","type":"games-judging","title":"Foodswamp Tycoon","authors":"Lennert Mottar, Hayley Pearce, et al, University of Ghent / BrainBugs, Belgium","code":"Game-033","flags":[],"id":"01-1450-146-158","related":[]},{"day":"2026-10-01","start":"14:50","end":"15:00","room":"18","stream":"Game Judging: Student Games (Pecha Kucha)","chair":"Judges: Stefan Gobel and Florian Horn","type":"games-judging","title":"Meridian OS","authors":"Chiao-Ling Hsu, Yuyi Chang, Cheng-Yu Liu, National Tsing Hua University, Hsinchu, Taiwan and Mu En Lee, Nanyang Technological University, Singapore","code":"Game-044","flags":[],"id":"01-1450-18-168","related":[]},{"day":"2026-10-01","start":"14:50","end":"15:00","room":"21","stream":"Stream E: PhD Colloquium Track","chair":"Michael Kickmeier-Rust","type":"phd","title":"AI-Supported Conditional Progression in Gamified Higher Education: Learning, Motivation and Cognitive Sustainability","authors":"Mariarosaria Speranza, Università degli Studi Suor Orsola Benincasa, Naples, Italy","code":"GBL-233","flags":["PhD"],"abstract":"This paper presents an experimental study on gamified learning in higher education, comparing three learning conditions: traditional individual study, traditional gamification, and gamification based on AI-supported conditional progression. The study involved 142 university students, randomly assigned to the three conditions, who attended the same lecture, delivered by the course lecturer, and then worked on comparable learning content during a differentiated consolidation phase. The research adopts a cognitive ergonomics perspective, which looks beyond final performance and considers the learning experience as a whole, focusing on learning outcomes, motivation, perceived workload, and the cognitive sustainability of the path. In the control condition, students studied the materials individually, without gamified elements. In the traditional gamification condition, students moved through digital activities on a learning platform in a fluid way, without rigid constraints. In the conditional progression condition, students followed a structured digital path organised into levels, with immediate feedback, time limits, a maximum number of attempts, and advancement constraints linking each step to the previous one. Artificial intelligence functions supported the generation and organisation of the learning content, activities and feedback, always under human supervision: the researcher reviewed and validated the materials before their use in the classroom. No significant differences emerged among the three conditions in immediate learning (correct answers, p = .922; total score, p = .943) or overall perceived workload (p = .454), although the two gamified configurations produced different experiences. Traditional gamification showed higher perceived relevance (p < .05) and greater completion of required lessons than AI-supported conditional progression (M = 3.79 vs. 2.59; p < .001; d = 1.79). The latter offered more structure and guidance but shifted the focus of perceived demand toward managing progression rules, attempts and time. These results suggest that a more structured and technologically articulated design is not automatically a more effective or more sustainable one. The paper discusses implications for designing engaging, pedagogically coherent and cognitively sustainable AI-supported learning experiences, while future research should examine delayed learning and transfer and test less restrictive progression constraints across educational contexts.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5417","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5417/4918","match":1.0,"id":"01-1450-21-59","related":[]},{"day":"2026-10-01","start":"15:00","end":"15:10","room":"146","stream":"Game Judging: Games in Development (Pecha Kucha)","chair":"Judges: Pangiotis Fotaris and Bernadette Spieler","type":"games-judging","title":"ThatSoftwareGame","authors":"André Nitze, Brandenburg University of Applied Sciences Germany","code":"Game-092","flags":["+GBL-257 Fri 1200"],"id":"01-1500-146-159","related":["02-1400-052-130"]},{"day":"2026-10-01","start":"15:00","end":"15:10","room":"18","stream":"Game Judging: Student Games (Pecha Kucha)","chair":"Judges: Stefan Gobel and Florian Horn","type":"games-judging","title":"The Mind Trap of Lord Blabberlier in Foodland","authors":"Vasiliki Karampa et al, 4th Experimental Primary School of Corfu - \"Athinagoreio\" Greece","code":"Game-054","flags":[],"id":"01-1500-18-169","related":[]},{"day":"2026-10-01","start":"15:00","end":"15:10","room":"21","stream":"Stream E: PhD Colloquium Track","chair":"Michael Kickmeier-Rust","type":"phd","title":"Simplifying Gamification in Practice: A Design Model for Training Transfer-oriented Industrial Learning","authors":"Moataz Elkady, et al Istituto Universitario di Studi Superiori, Pavia, Italy","code":"GBL-139","flags":["PhD"],"abstract":"Gamification has become one of the most sought-after strategies to enhance learners’ engagement and motivation, especially in digital learning environments. Within the organisational and industrial training context, the adoption of gamification has expanded, with Learning Management Systems (LMS) serving as a primary vehicle for workforce development. Industry 5.0 requires integration with cyber-physical systems, Artificial Intelligence (AI) and human-centred production principles that impose a continuous increase on workers for upskilling and reskilling. Nevertheless, a gap exists between the potential of gamification and what most implementations deliver. The main challenge is that, in the industrial LMS context, gamification is often driven more by platform accessibility than by instructional design. Game mechanics such as points, badges, and leaderboards are widely used for their availability rather than for their effect on the cognitive processes required to achieve learning objectives. The availability-driven approach can initially generate engagement, but it becomes more challenging to achieve Training transfer (TT) of competencies in industrial training, especially given the heterogeneity of industrial workers across experience, digital literacy, and motivational orientation, making a unified configuration unfeasible to sustain across the learners’ population. Compounding those challenges are the architectural constraints of existing LMS platforms, which might limit the consolidation of behavioural data across gamified components. This study introduces the SIGAT-IL Model (Scalable, Iterative, Gamification, Adaptive, Transfer, Industrial Learning) as a structured design framework to address those implementation challenges. Through a structured synthesis of current literature and established theoretical frameworks, the study identifies four implementation challenges: technological constraints, pedagogical-technical misalignment, learner heterogeneity, and scalability limitations, and proposes corresponding design principles. This model is centred around five established theoretical frameworks: Self-Determination Theory (SDT), Cognitive Load Theory (CLT), the Mechanics-Dynamics-Aesthetics (MDA) framework, the TT framework and the adaptive learning paradigm. The model does not prescribe a fixed configuration; it offers coherent, interconnected design principles that streamline implementation decisions and support contextually appropriate outcomes. The model repositions TT, defined as the generalisation and maintenance of trained skills in the operational workplace, as the primary criterion for evaluating gamification design choices, shifting focus from engagement metrics towards evidence of meaningful applied learning. The study concludes that repositioning TT as the primary evaluative criterion, rather than engagement metrics alone, is the essential shift required for more effective industrial gamification. These findings point to the need for longitudinal empirical validation of the model in operational industrial settings and comparative studies of structural, content and hybrid gamification configurations.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5352","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5352/4909","match":1.0,"id":"01-1500-21-60","related":[]},{"day":"2026-10-01","start":"15:10","end":"15:30","room":"051","stream":"Stream A: Artificial Intelligence and Educational Games: When AI Meets Learning through Play","chair":"Christopher Gledhill","type":"paper","title":"Creative Thinking through Brain Game Creation: Comparing Individual, Human-Human, and Human-AI Collaboration","authors":"Amaia Guridi-Bikuña, Mondragon Unibertsitatea, Eskoriatza, Spain, Umberto Domanti, Free University of Bozen-Bolzano, Italy, Jiayin Liu and Todd Lubart, University of Paris Cité, France","code":"","flags":["presentation only","uncertain"],"id":"01-1510-051-44","related":[]},{"day":"2026-10-01","start":"15:10","end":"15:30","room":"052","stream":"Stream B: Different Approaches to Learning using GBL","chair":"Peter Vankúš","type":"paper","title":"Mission Profiles and Interaction Patterns in Gravitas: Evidence from a Simulation-based Physics Learning Game","authors":"Katharina Richter, Dominik Tschirky and Michael Kickmeier-Rust, St.Gallen University of Teacher Education, Switzerland","code":"GBL-125","flags":[],"abstract":"Digital games and simulation-based environments are recognized as promising approaches for enhancing conceptual understanding and motivation in physics education, particularly with regard to persistent misconceptions in mechanics. Gravitas is a simulation-based learning game for lower-secondary students that employs a cyclical design of diagnosis, cognitive conflict, simulation, and reflection to address misconceptions about gravity and forces. In a quasi-experimental field study, 272 students selected one of four self-chosen mission profiles (Adventurer, Researcher, Tactician, Tinkerer). Log data and reflection-based performance measures were analyzed, with profiles serving as a categorical grouping variable. Interaction metrics (simulation time, reset frequency, use of conceptual supports, reflection duration) and reflection scores were normalized per completed level and examined using Kruskal-Wallis tests and Spearman correlations. Results revealed no significant differences between profiles in game progress, exploration intensity, support usage, reflection duration, or reflection performance (all ε² ≈ 0). Reset frequency showed a marginal profile effect (χ²(3) = 7.59, p = .055, ε² = .02) and a small negative correlation with reflection performance (ρ = −.18, p = .006). Overall, the findings indicate that self-selected mission profiles had limited explanatory value for learners’ interaction patterns and in-game conceptual performance in Gravitas . This suggests that adaptive design in simulation-based learning games may benefit from relying more strongly on dynamic, behavior-based indicators rather than on static self-categorizations.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5272","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5272/4876","match":1.0,"id":"01-1510-052-49","related":[]},{"day":"2026-10-01","start":"15:10","end":"15:30","room":"053","stream":"Stream D: Motivation & Support","chair":"Jordana Garbati","type":"paper","title":"Game-based Support for Vocational Teachers' Competence Reflection in Professional Development Search","authors":"Sabrina Hänsel, Lydia Stark and Michelle Pippig, TUD Dresden University of Technology (CODIP), Germany","code":"GBL-182","flags":[],"abstract":"Vocational teachers are expected to develop digital competences continuously. However, when they search for professional development opportunities, they are confronted with keyword-based search interfaces on professional development platforms that offer little guidance and rarely address their needs as adult learners. As a result, identifying learning pathways for professional growth can be difficult, especially for teachers with limited time and heterogeneous prior experiences with digital teaching. The joint project ELMeKS.digital develops a game-based entry point for vocational school teachers to search for professional development opportunities, framing lifelong professional learning as a self-directed, practice-oriented, and motivation-supportive process. To foster orientation and competence reflection, the platform is aligned with the European Framework for the Digital Competence of Educators (DigCompEdu), which structures key competence areas for teaching with digital technologies. This allows the platform to connect game-based interaction with competence-oriented self-reflection and personalised recommendations. Across these areas, teachers engage with mini-games that represent professional situations and digital teaching practices, for example, by identifying design flaws in presentation slides or reflecting on classroom-related digital decisions. Based on players’ performance across competence areas, the system generates tailored professional development recommendations. The paper presents the design rationale of the platform and findings from usability tests and think-aloud protocols with vocational teachers involved in the iterative development process. It examines to what extent game-based designs can reduce orientation problems in professional development discovery, support competence reflection and motivate teachers to engage in continuous learning. By focusing on vocational teachers as adult learners, the study contributes to current discussions on game-based learning for lifelong learning. It shows how playful, low-threshold, and competence-oriented digital environments support professional development search and help teachers navigate the professional development landscape in a more reflective and motivating way.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5229","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5229/4837","match":1.0,"id":"01-1510-053-54","related":[]},{"day":"2026-10-01","start":"15:10","end":"15:20","room":"146","stream":"Game Judging: Games in Development (Pecha Kucha)","chair":"Judges: Pangiotis Fotaris and Bernadette Spieler","type":"games-judging","title":"RI.MAS - DecisionForge","authors":"Nur Ain Binti Abu Bakar, Mohamad Izwan Ismail, Prasanna Ramakrisnan, Universiti of Teknologi MARA, Malaysia","code":"Game-064","flags":["uncertain"],"id":"01-1510-146-160","related":[]},{"day":"2026-10-01","start":"15:10","end":"15:20","room":"18","stream":"Game Judging: Student Games (Pecha Kucha)","chair":"Judges: Stefan Gobel and Florian Horn","type":"games-judging","title":"Mystical Phenolics","authors":"Mohammad Faiz Bin Norhisham et al, Universiti Teknologi MARA Malaysia","code":"Game-070","flags":[],"id":"01-1510-18-170","related":[]},{"day":"2026-10-01","start":"15:10","end":"15:20","room":"21","stream":"Stream E: PhD Colloquium Track","chair":"Michael Kickmeier-Rust","type":"phd","title":"Leveling Up Physics Education with Gamified Virtual Reality Simulations","authors":"José Graça and Pamela Teubig, Universidade Europeia, Lisbon, Portugal","code":"GBL-209","flags":["PhD"],"abstract":"Traditional physics education often struggles to convey abstract, three-dimensional concepts, leading to low student engagement and high cognitive load. While Virtual Reality (VR) offers immersive visualization, passive VR environments can still suffer from novelty wear-off, limiting their long-term pedagogical value. To address this, this study introduces PhysiVerse, an immersive VR experience structured around a task-based progression style that guides students through a hypothesis-testing learning loop. In this environment, students commit to a prediction before acting, test the prediction by running the experiment, and compare the results against their initial hypothesis. This cycle is reinforced by a gamified scoring system where users win points based on the closeness of their prediction to the empirical truth, incentivizing precise conceptual understanding over trial-and-error interaction. Focusing on concepts related to Mechanical Energy, this study evaluates the PhysiVerse experience through psychometric questionnaires, pre/post knowledge assessments, and in-experience behavioural metrics, including prediction accuracy as a measure of prior understanding.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5523","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5523/4910","match":1.0,"id":"01-1510-21-61","related":[]},{"day":"2026-10-01","start":"15:20","end":"15:30","room":"146","stream":"Game Judging: Games in Development (Pecha Kucha)","chair":"Judges: Pangiotis Fotaris and Bernadette Spieler","type":"games-judging","title":"BioInvaders! Reef Rush","authors":"David Farrell et al, Paidia Consulting Limited, UK","code":"Game-068","flags":[],"abstract":"Set in a Mediterranean reef where a fast-spreading intruder has few natural predators, this is a push-your-luck card game for two to five players. Every decision is a small lesson in marine ecology, risk, and the strange economics of a biological invasion.\n\nOn your turn you dive, flipping cards from a shared deck and building up a tableau of marine wildlife, habitats, tools and businesses. Push wisely and you build a reef of pufferfish, parrotfish, sea turtles and grouper, supported by seagrass and coral habitats that match by colour and generate ecological synergies. Push too far and the lionfish strike. In the real Mediterranean, they out-breed and out-eat the native species, leaving little for the rest of the reef. In the game, their venomous spines bust your dive: so pulling the wrong card sends you home with nothing.\n\nTools like the spearfisher and the lionfish \"FAD\" trap let you fight back. A restaurant-and-jewelry-shop combo lets you turn caught lionfish into income - a direct simulation of the real-world \"eat the invader\" approach to invasion management.\n\nThese are real Mediterranean species and interactions, vetted by lionfish researchers in our consortium. The mechanics are a microcosm of how biological invasions actually work: invaders predate the natives behind them, native predators (groupers and moray eels, where they survive) take the invaders in front of them, and managing the balance is a question of incentives more than biology.\n\nPart of GuardIAS, a Horizon Europe-funded research project on invasive species across Europe. Developed with ecologists in Germany and Greece. Players walk away with a genuine understanding of an environmental problem affecting the entire Mediterranean basin, dressed up as an exciting, repeatable 15-20 minute card game.","paidia":true,"id":"01-1520-146-161","related":[]},{"day":"2026-10-01","start":"15:20","end":"15:30","room":"18","stream":"Game Judging: Student Games (Pecha Kucha)","chair":"Judges: Stefan Gobel and Florian Horn","type":"games-judging","title":"Metropoli - GZM Metropolis Game","authors":"Paulina Siudyka et al, Silesian University of Technology Poland","code":"Game-025","flags":["+GBL-176 Fri 1240"],"id":"01-1520-18-171","related":["02-1240-146-126"]},{"day":"2026-10-01","start":"15:30","end":"15:50","room":"051","stream":"Stream A: Artificial Intelligence and Educational Games: When AI Meets Learning through Play","chair":"Christopher Gledhill","type":"paper","title":"Sustainable JAM! Blending AI, System Dynamics, and Immersive Gameplay for Deep Learning","authors":"Russell Richards and Alexander McBroom, The University of Queensland, Brisbane, Australia","code":"GBL-252","flags":["presentation only"],"id":"01-1530-051-45","related":[]},{"day":"2026-10-01","start":"15:30","end":"15:50","room":"052","stream":"Stream B: Different Approaches to Learning using GBL","chair":"Peter Vankúš","type":"paper","title":"Rapid Academic Levelling Through Artificial Intelligence Role Play Escape Room","authors":"Carlos Astengo, Tec de Monterrey, Monterrey and Mario Caudillo, Universidad Internacional de La Rioja (UNIR), Logroño, Spain","code":"GBL-168","flags":[],"abstract":"Gaps in previously taught probability and statistics concepts can present difficulties when engineering students enter courses that rely on this prerequisite knowledge. Educational escape rooms provide one possible mechanism for revisiting such concepts through contextualised problem-solving within a limited amount of classroom time. This exploratory study examines aggregate changes in assessment performance and response behaviour surrounding a single-session conversational artificial intelligence (AI) educational escape-room intervention with second-semester engineering students in Mexico. The complete cohort of 15 students enrolled in an Engineering in Interactive Software and Video Game Development programme participated voluntarily. Participants were aged 18–22 years; two identified as women, twelve as men, and one as non-binary. The one-hour classroom session consisted of a 10-minute pre-test, a 5-minute introduction, a 35-minute individually completed AI-mediated escape room, and a 10-minute post-test. The intervention, Probabilidades Sangrientas: El Castillo de Strahd , was implemented as a customised GPT-based conversational experience containing 20 open-response probability and statistics challenges embedded within a gothic escape-room narrative. Fifteen pre-test records and fourteen post-test records were available for analysis; individual responses could not be matched. Consequently, analysis was restricted to descriptive aggregate comparisons. The proportion of attempted items increased from 40.0% to 68.6%, while correct responses as a proportion of all possible items increased from 19.3% to 55.7%. Among attempted items, correctness increased from 48.3% to 81.3%. These differences indicate improved immediate aggregate performance and greater willingness to attempt assessment items after the session. However, because the study lacked a control group, matched individual observations, and a delayed assessment, the findings cannot establish individual learning gains or attribute the observed changes specifically to the escape-room or AI components. The study instead provides an exploratory account of how a conversational AI escape room can be incorporated into a time-constrained engineering classroom for prerequisite-knowledge reinforcement.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5415","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5415/4807","match":1.0,"id":"01-1530-052-50","related":[]},{"day":"2026-10-01","start":"15:30","end":"15:50","room":"053","stream":"Stream D: Motivation & Support","chair":"Jordana Garbati","type":"paper","title":"Playing for Quality: A Competitive Educational Game for Teaching Unit Testing in Computer Science Education","authors":"Alia El Bolock, The American University in Cairo, Egypt, Caroline Sabty, and Slim Abdennadher, The German International University, Cairo, Egypt and Gordon Fraser, Passau University, Germany","code":"GBL-097","flags":[],"abstract":"Software testing is a foundational competence in computer-science curricula and a notoriously disengaging one for learners; a recurring concern for the games-based learning (GBL) community is whether gamified-testing interventions actually deepen learning or merely raise activity levels. This paper presents the design and a proof-of-concept evaluation of Test Royale, an educational game for teaching unit testing whose mechanics are deliberately bound to learning objectives at Bloom’s apply, analyse and evaluate levels: live mutation analysis (Stryker.NET) and coverage analysis (Coverlet) are surfaced as in-game feedback, and the score function is computed directly from validated quality indicators rather than from activity volume. The design is articulated through the Mechanics–Dynamics–Aesthetics (MDA) framework and grounded in the Octalysis core drives. We report a small mixed-methods pilot study with two complementary participant groups: sixteen undergraduate students in a Software Testing course (8 in a gamified condition, 8 in a non-gamified condition; Study 1) and eleven professional developers at an Egyptian fintech company (Study 2). In Study 1, the gamified condition outperformed the non-gamified condition on every measured quality indicator with large-effect-size differences (mutation score Δ = +8.2, d ≈ 0.81; branch coverage Δ = +10.7, d ≈ 0.96; line coverage Δ = +7.5, d ≈ 0.84; useful test LOC Δ = +12.1, d ≈ 1.23), with p < .05 for each and the pattern surviving Holm–Bonferroni correction across the five outcomes, while execution time did not differ significantly. In Study 2, the system achieved a System Usability Scale score of 80.0 (“excellent”; 95% CI [66.88, 93.12], n = 11), with self-reported motivation among already-motivated practitioners remaining high but not significantly increased. Given the small samples, the entanglement of game mechanics with feedback immediacy in our control condition, and the single-session design, we present these results as encouraging proof-of-concept evidence rather than confirmatory findings, and we describe a three-arm replication plan that disentangles game mechanics from feedback design.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5532","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5532/4825","match":1.0,"id":"01-1530-053-55","related":[]},{"day":"2026-10-01","start":"15:30","end":"15:40","room":"146","stream":"Game Judging: Games in Development (Pecha Kucha)","chair":"Judges: Pangiotis Fotaris and Bernadette Spieler","type":"games-judging","title":"The Democracy Game","authors":"Eleni Pashia, Eva Korae, Omiros Panayides and Slalo Lesta, Cyprus University of Technology Cyprus","code":"Game-073","flags":[],"id":"01-1530-146-162","related":[]},{"day":"2026-10-01","start":"15:30","end":"15:40","room":"18","stream":"Game Judging: Student Games (Pecha Kucha)","chair":"Judges: Stefan Gobel and Florian Horn","type":"games-judging","title":"Punch and Munch (Torrada e Porrada in Portuguese)","authors":"João Freire, António Rodrigues and Daniel Fernandes, Lusófona University, HEI-Lab, Portugal","code":"Game-082","flags":[],"id":"01-1530-18-172","related":[]},{"day":"2026-10-01","start":"15:30","end":"15:40","room":"21","stream":"Stream E: PhD Colloquium Track","chair":"Michael Kickmeier-Rust","type":"phd","title":"A Pilot Study Investigating Teachers' use of Video Games in Programming Lessons","authors":"Neil Rickus, King's College London, UK","code":"GBL-027","flags":["PhD"],"id":"01-1530-21-62","related":[]},{"day":"2026-10-01","start":"15:40","end":"15:50","room":"146","stream":"Game Judging: Games in Development (Pecha Kucha)","chair":"Judges: Pangiotis Fotaris and Bernadette Spieler","type":"games-judging","title":"Dressing the Parasaurolophus","authors":"Jessica L. Bitter, Lorena Müller, Leonie Ferdinand, Ulrike Spierling, Hochschule RheinMain, Wiesbaden, Germany","code":"Game-083","flags":["+GBL-140 Fri pm"],"id":"01-1540-146-163","related":["02-1200-051-115"]},{"day":"2026-10-01","start":"15:40","end":"15:50","room":"18","stream":"Game Judging: Student Games (Pecha Kucha)","chair":"Judges: Stefan Gobel and Florian Horn","type":"games-judging","title":"Le Tombeau de Sennefer","authors":"Alice Thise and Frédéric Thise, University of Liège, Belgium","code":"Game-030","flags":["+GBL-71-PhD Thur am"],"id":"01-1540-18-173","related":["01-1050-21-28"]},{"day":"2026-10-01","start":"15:40","end":"15:50","room":"21","stream":"Stream E: PhD Colloquium Track","chair":"Michael Kickmeier-Rust","type":"phd","title":"Co-Creating a Serious Game that Develops Climate-Health Competencies in Public Health Professionals","authors":"Sebastian Bernal Garcia, Russell Richards, Brian McIntosh and Thanya Pathirana, Griffith University, Sunshine Coast, Australia","code":"GBL-251","flags":["presentation only","PhD"],"id":"01-1540-21-63","related":[]},{"day":"2026-10-01","start":"15:50","end":"16:10","room":"051","stream":"Stream A: Artificial Intelligence and Educational Games: When AI Meets Learning through Play","chair":"Christopher Gledhill","type":"paper","title":"Leben in Deutschland: An Intelligent Tutoring Game for the German Citizenship Test","authors":"Felix Haase, Kemal Tanikar, Johannes Langer, Shamim Miroliaei, Jochen Mehlich and Ute Schmid University of Bamberg, Germany","code":"GBL-119","flags":[],"abstract":"To apply for German citizenship, each candidate must complete a multiple-choice questionnaire of 33 questions with at least 17 correct answers. The official question database contains a total of 310 questions covering various topics such as history, politics, and values. While there are already courses, websites and apps to prepare for this test, there exists no digital serious game that creates an engaging environment and supports the learners individually. The aim of this proposed intelligent tutoring game “Leben in Deutschland” is to support learners in preparing for the test, by situating them in a German town, tracking question mastery in repeated trials, providing feedback on failed questions and allowing them to pose open questions on the topics. Feedback and answers to open questions are given using the Large Language Model (LLM) llama3.2-3B with Retrieval Augmented Generation (RAG). The background knowledge contains encyclopedias by the Bundeszentrale für politische Bildung (bpb) and public broadcast video-transcripts. We conducted a mixed-methods pilot with 4 German speaking participants (age 18 - 45) with 3 of them having a migration background and one of them having completed the citizenship test already. The participants rated the usability as 4.4±0.6 and the perceived improvement over learning without the game as 4.9±0.3 on a 5-point Likert scale showing overall high satisfaction with the game. Three of the participants rated the LLM-generated feedback as helpful, one noted it lacked depth. In qualitative feedback, the participants liked the simple yet effective gameplay loop and proposed additional features such as quests that integrate the learning content in the interaction with NPCs. These results indicate that an LLM‑augmented serious game can deliver engaging, individualized preparation for the German citizenship test. In future work we want to evaluate the system in a trial with a cohort that is preparing for the citizenship test and explore multilingual extensions.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5467","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5467/4836","match":1.0,"id":"01-1550-051-46","related":[]},{"day":"2026-10-01","start":"15:50","end":"16:10","room":"052","stream":"Stream B: Different Approaches to Learning using GBL","chair":"Peter Vankúš","type":"paper","title":"A Design and Development of Serious Game for Raising Awareness About Human Trafficking","authors":"Lanlan Gao and Wen Hu, Maynooth University, Ireland","code":"GBL-026","flags":[],"abstract":"This project presents a design and development of a serious game, which aims to raise awareness about human trafficking. Traditional educational methods often fail to translate passive knowledge into an understanding of the victim’s vulnerability. To address this gap, the game is designed based on three educational and psychological frameworks: situated cognition, experiential learning, and empathy-driven design. The paper explores how these frameworks guide the game's tone, mechanics, and difficulty to create stealth mechanics (i.e., restricting combat options and emphasising evasion). Consequently, players navigate a non-violent environment to experience the vulnerability and loss of control inherent in trafficking scenarios. We argue that stealth mechanics as interaction agency can serve as a potent pedagogical tool for embodying a victim's perspective, transforming passive awareness of social crises into an internalised understanding.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5082","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5082/4830","match":1.0,"id":"01-1550-052-51","related":[]},{"day":"2026-10-01","start":"15:50","end":"16:10","room":"053","stream":"Stream D: Motivation & Support","chair":"Jordana Garbati","type":"paper","title":"How Can Mechanics Stimulate Behaviour, Motivation, and Engagement Levels in Learning and Training Applications?","authors":"Phillip Benachour and Carina Chang Lancaster University, Lancaster, UK","code":"GBL-158","flags":[],"abstract":"This aim of this paper is to report on a preliminary research study investigating a quiz-based cyber awareness game-based application and its impact on consumers’ knowledge, awareness, and behaviour regarding e-commerce fraud and scams. A pilot inter-group experiment involving N=46 participants was conducted to gauge users’ attitudes, behaviour and motivation towards protection from e-commerce fraud and online scams. Participants chose between a traditional quiz (control group = 16) and a quiz-style role-playing game (treatment group = 30). The effectiveness of the game application was evaluated using the risk behaviour diagnosis (RBD) methodology. Results of the experiment show that interest in games, e-commerce usage frequency, and fear of victimisation are the key motivators for the treatment group to improve their awareness of e-commerce fraud and scam prevention. From a design perspective, calibrating and balancing game mechanics is essential to maintaining user motivation and engagement. The design of the application focused on four key techniques: flow, meaningful choices, incentives, and task duration. This work in progress paper discusses and reflects on how these techniques were utilised in the design process of the features cards (i.e. Tutorial cards, Shield cards, Shield Cards) of the gamified application; and how its associated rewards were effective for learner motivation and overall game experience. Based on an additional pilot study, feedback from the treatment group (N=30) on the game’s mechanics showed that 86.7% of the players felt that the feature cards offered them sufficient freedom to progress during the game. Further, 33.3% of the players found the choices afforded were meaningful, and 46.7% of the players viewed the choices given as quite meaningful. The user study results and proposed balanced mechanics techniques can provide insights to broader applications designs related to micro-credentials and gamified applications for professional training. Based on research into learner engagement, we explore how flow, meaningful choices, incentives, and task duration can be applied to stimulate behaviour, motivation, and engagement levels.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5437","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5437/4811","match":1.0,"id":"01-1550-053-56","related":[]},{"day":"2026-10-01","start":"15:50","end":"16:00","room":"146","stream":"Game Judging: Games in Development (Pecha Kucha)","chair":"Judges: Pangiotis Fotaris and Bernadette Spieler","type":"games-judging","title":"Viral Impact","authors":"Guido Bruinsma, Stichting Gamelab Oost, Netherlands","code":"Game-085","flags":["+GBL-164 Fri pm"],"id":"01-1550-146-164","related":["02-1400-051-128"]},{"day":"2026-10-01","start":"15:50","end":"16:00","room":"18","stream":"Game Judging: Student Games (Pecha Kucha)","chair":"Judges: Stefan Gobel and Florian Horn","type":"games-judging","title":"Flora's Garden","authors":"Ruizhe Lu and Zhong YangYang, Maynooth University Ireland","code":"Game-039","flags":[],"id":"01-1550-18-174","related":[]},{"day":"2026-10-01","start":"15:50","end":"16:00","room":"21","stream":"Stream E: PhD Colloquium Track","chair":"Michael Kickmeier-Rust","type":"phd","title":"Generations in Love: An Introspection on Gaming Culture and Communities","authors":"Laura Vawter, Rostock University, Germany","code":"GBL-149","flags":["PhD"],"abstract":"Through an analysis of linguistic practices, this paper explores the shared and reinforced norms and standards of skill, identity, and membership that divide participants in the gaming community who have played games for most of their lives. Through the collection of ethnographic data, in the form of an interview and survey, this paper explores the emotional connection and patterns of engagement players experience with games and the gaming community. Participation in the gaming community is positioned by participants as all-encompassing- something that permeates participants’ relationships, culture, and community online and offline. Moreover, expert mastery of game mechanics was found not to be a determinant of in-group and out-group division formation. These perspectives of participants are held in contrast to online movements, such as GamerGate, and their outdated metrics for membership.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5201","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5201/4921","match":1.0,"id":"01-1550-21-64","related":[]},{"day":"2026-10-01","start":"16:00","end":"16:10","room":"146","stream":"Game Judging: Games in Development (Pecha Kucha)","chair":"Judges: Pangiotis Fotaris and Bernadette Spieler","type":"games-judging","title":"IRIS","authors":"Azizah Boo-Frey, Marvelous Digital Switzerland","code":"Game-041","flags":[],"id":"01-1600-146-165","related":[]},{"day":"2026-10-01","start":"16:10","end":"16:30","room":"","stream":"","chair":"","type":"break","title":"Refreshment Break","authors":"","code":"","flags":[],"id":"01-1610-all-65","related":[]},{"day":"2026-10-01","start":"16:15","end":"16:35","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Tharranos Bratitsis and Wolfgang Brabänder","type":"games-judging","title":"Prompt. Refine. Repeat","authors":"Darja Palmer, Alfonso Pacheco, Jens Kollmann, Jonas F. Paul, Michelle Hillmann, Alexander Julius, E.ON Digital Technology GmbH, Germany","code":"Game-034","flags":[],"id":"01-1615-18-175","related":[]},{"day":"2026-10-01","start":"16:15","end":"16:35","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Rajiv Basaiawmoit and Taru Deva","type":"games-judging","title":"LangCube Game","authors":"Zekeriya Kazanci, Çukurova University Türkiye","code":"Game-032","flags":[],"id":"01-1615-18-180","related":[]},{"day":"2026-10-01","start":"16:30","end":"16:50","room":"051","stream":"Stream A: Stories and Worlds","chair":"Allen Jones","type":"paper","title":"A Story-Driven Video Game in Statics","authors":"Seyed Mohammad Seyed Ardakani and Caleb Collert, Ohio Northern University, Ada, USA","code":"GBL-129","flags":["presentation only"],"id":"01-1630-051-66","related":[]},{"day":"2026-10-01","start":"16:30","end":"16:50","room":"052","stream":"Stream B: VR & a Mega-Game","chair":"Matthew Daniels","type":"paper","title":"Sortica: A VR Serious Game to Teach Scheduling Algorithms to Undergraduate Students","authors":"Frank A. Oldfield-Montilla, Manuel J. Gomez, Universidad de Murcia, Spain, Luke Beveridge and Marco Gilardi, University Of The West of Scotland, Paisley, UK","code":"GBL-089","flags":[],"abstract":"Scheduling algorithms are an important part of the Computer Science curriculum as these algorithms control how resources are handled and shared within the operating system. Outside the realm of Computer Science, scheduling algorithms are a critical part of project management, enabling the translation of project plans into realistic and efficient operating time tables. Scheduling algorithms are often hard to understand by undergraduate students who struggle to visualise them and understand the practicalities of their implementation. Immersive Serious Games (iSG) have been shown to be an effective approach to visualise abstract concepts and immerse and engage students in practical tasks that require hands-on intervention. This paper presents the case study of “Sortica” a prototype iSG aimed at introducing students unfamiliar with scheduling algorithms to the foundational algorithms of the subject, such as last-in-first-out (LIFO) and first-in-first-out (FIFO). Within “Sortica” students took on the role of a robot worker tasked to rebuild town street buildings using the LIFO and FIFO algorithms. “Sortica” was developed following a human centred iterative approach and was tested through four data collection sessions for a total of 26 undergraduate participants from three modules in programmes that do not teach scheduling algorithms. A pre-test post-test method was used to test knowledge acquisition, the post-test also included questions regarding engagement, perceived learning and the NASA-TLX scale. Additionally, in-game analytics were collected to measure student performance within the iSG. Students were observed during the gameplay and interviewed to collect feedback regarding different aspects of th
