e game. After data cleaning a preliminary data analysis shows that despite a high starting baseline (39% achieved perfect pre-test scores) participants felt that the iSG was highly engaging and helped solidify their understanding of the subject. Preliminary analysis of the NASA-TLX scale shows that the cognitive load was moderately high for the tasks, which could help explain why 4.35% of the valid responses showed a score decrease in the post-test. This work shows that the translation of abstract concepts of scheduling algorithms into mundane tasks makes “Sortica” an engaging tool for introduction and consolidation of basic scheduling algorithms knowledge and understanding. Furthermore, analysis of user friction reveals critical design considerations regarding diegetic interfaces, false affordances, and cognitive load in educational VR","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5219","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5219/4949","match":1.0,"id":"01-1630-052-69","related":[]},{"day":"2026-10-01","start":"16:30","end":"16:50","room":"053","stream":"Stream C: Mini Track on Educational Escape Rooms","chair":"Panagiotis Fotaris","type":"paper","title":"Empowering young women's participation in STEM fields through an educational escape room","authors":"Micaela Fonseca, Lusófona University, Lisbon, Portugal, Wilson Almeida, Lusófona University, Lisbon, Portugal, Filipe Luz, Lusófona University, Lisbon, Portugal and Julia Costa, Lusófona University, Lisbon, Portugal","code":"GBL-154","flags":["presentation only"],"id":"01-1630-053-72","related":[]},{"day":"2026-10-01","start":"16:30","end":"16:50","room":"146","stream":"Stream E: Mini Track on Learning through Game Making","chair":"Francesca Dagnino, Marcello Passarelli, and Luke West","type":"paper","title":"Learning by Game Design: An Interdisciplinary Framework for Participatory and Innovative Higher Education","authors":"Matteo Bisanti, Cristina Castracani, Roberto Di Paolo, Emanuela Maio and Mariangela Scarpini, University of Parma, Parma, Italy","code":"GBL-131","flags":[],"abstract":"Learning by Game Design is an interdisciplinary teaching innovation project developed at the University of Parma, Italy. It integrates game design into higher education as a structured pedagogical methodology rather than as an occasional motivational device. Beginning with a critique of traditional university teaching — which often struggles to sustain engagement, inclusion, accessibility, and active participation — the project frames game design as a learning environment that enables complex thinking, collaboration, and the use of multiple forms of representation, in line with active learning and Universal Design for Learning principles. Built around a multidisciplinary team spanning entomology, citizen science, economics, law and data protection, game science, and cultural heritage education, the project aims to build a scalable and transferable model for university teaching. The paper describes the project architecture, reports on an exploratory pilot implementation in a Citizen Science course and its subsequent extension to three further courses in economics, data science, and cultural heritage education, and discusses implications, limitations, and future validation needs for participatory pedagogy, interdisciplinary curriculum design, and the use of analog games in citizen science contexts.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5293","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5293/4812","match":1.0,"id":"01-1630-146-78","related":[]},{"day":"2026-10-01","start":"16:30","end":"16:50","room":"21","stream":"Stream D: Evaluating Game Based Learning","chair":"Lance Bunt","type":"paper","title":"LOOP: A Transversal Framework for Game-based Learning Analysis and Design","authors":"Jérôme Legrix-Pagès, University of Caen Normandy, France","code":"GBL-011","flags":[],"abstract":"Despite the proliferation of models addressing serious game design and learning outcomes, educators and designers struggle to articulate gameplay structures, learner experience, pedagogical intentions, and ethical considerations within a unified framework. Existing approaches focus on specific dimensions—systemic mechanics through the Mechanics-Dynamics-Aesthetics (MDA) framework, learning-mechanics alignment through the Learning Mechanics-Game Mechanics (LM-GM) model, or pedagogical context through CEPAJe—yet rarely enable both analysis and iterative design across heterogeneous ludic situations. This paper introduces LOOP, a transversal framework developed since 2017 at the Gaming Lab, University of Caen Normandy. It structures game-based learning analysis and design through seven dimensions: Ludicity, World, Mechanics, Experience, Values, Accessibility, and Transformation. Transformation examines what a game produces beyond itself, including its intended pedagogical effects. Rather than prescribing success criteria, LOOP functions as a reflective scaffold making explicit the choices and trade-offs inherent in ludopedagogical situations. Three exploratory applications are reported. A qualitative thematic alignment analysis of 372 eligible games from an initial corpus of 458 identified patterns across LOOP dimensions: alignment was more frequent for structural dimensions (84–93%) than for Transformation (51%); these figures are not chance-corrected reliability estimates. A diagnostic study of 24 support-seeking educator-led projects identified recurring weaknesses alongside limited benchmarking and self-reported game exposure. A generative study documented 47 games created through LOOP-structured game jams across board, digital, virtual-reality, and live-action formats and educational domains including engineering, urban planning, law, and healthcare. LOOP provides an operational bridge between theoretical models and game-based learning design practice. The paper discusses contributions, limitations, and future research.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5073","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5073/4850","match":1.0,"id":"01-1630-21-75","related":[]},{"day":"2026-10-01","start":"16:35","end":"16:55","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Tharranos Bratitsis and Wolfgang Brabänder","type":"games-judging","title":"Meet Angela Ignatius","authors":"Caroline Archambault, Leiden University College, Netherlands","code":"Game-035","flags":[],"id":"01-1635-18-176","related":[]},{"day":"2026-10-01","start":"16:35","end":"16:55","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Rajiv Basaiawmoit and Taru Deva","type":"games-judging","title":"Right Opinion","authors":"Mario Michaelides, Brunel University, UK","code":"Game-090","flags":["+GBL-236 Thur am"],"id":"01-1635-18-181","related":["01-1100-21-29"]},{"day":"2026-10-01","start":"16:50","end":"17:10","room":"051","stream":"Stream A: Stories and Worlds","chair":"Allen Jones","type":"paper","title":"Imagined Worlds, Real Learning: Worldbuilding as Pedagogical Design","authors":"Kate (Katya) Schmidt Sullivan, Rogues Academy, Edinburgh, Scotland, UK","code":"GBL-083","flags":[],"abstract":"Game-based learning (GBL) research has largely focused on gameplay mechanics and learning outcomes, often overlooking the fictional worlds within which gameplay occurs. Yet these worlds shape how learners interpret problems, explore alternatives, and construct meaning. This paper proposes collaborative worldbuilding as a pedagogical design approach, arguing that fictional systems can function as environments for inquiry, experimentation, and collective sensemaking. The paper introduces fictional systems pedagogy , a framework in which learners co-construct imagined systems encompassing cultures, institutions, and environments. Through this process, learners engage in systems thinking, critical reflection, and creative problem-solving within a context that balances structural complexity with imaginative flexibility. Central to this approach is the concept of productive fictional distance, whereby imagined settings provide separation from real-world constraints while retaining meaningful parallels. Drawing on illustrative examples, the paper demonstrates how fictional systems can scaffold engagement with complex issues such as sustainability and governance. It concludes by positioning worldbuilding as a flexible and accessible approach to educational design that expands GBL beyond interaction with predefined systems toward the collaborative construction of learning environments themselves.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5470","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5470/4884","match":1.0,"id":"01-1650-051-67","related":[]},{"day":"2026-10-01","start":"16:50","end":"17:10","room":"052","stream":"Stream B: VR & a Mega-Game","chair":"Matthew Daniels","type":"paper","title":"EduColorVR: A Virtual Reality Serious Game for Enhancing Color Vision Deficiency Awareness in Educational Settings","authors":"Masiar Babazadeh, David Braile and Alessandro Puiatti, SUPSI, Lugano, Switzerland","code":"GBL-111","flags":[],"abstract":"Color vision deficiency (CVD) impacts approximately 300 million individuals globally, yet it remains significantly overlooked within educational environments. Preliminary consultations with primary and secondary educators reveal that colorblindness is rarely documented in students' educational backgrounds, and proactive classroom discussions regarding the condition are virtually nonexistent. Currently, accommodations are implemented on a strictly ad hoc, reactive basis, highlighting a critical pedagogical gap and a stark lack of standardized guidelines for teachers. To address this systemic challenge, we introduce the design and development of EduColorVR, an interactive virtual reality (VR) serious game designed to raise awareness, foster pedagogical empathy, and provide an experiential understanding of CVD for both students and educators. Developed using the Unity engine and the XR Interaction Toolkit, the application implements a highly optimized, real-time color transformation based on the Brettel-Viénot-Mollon model. This computational approach utilizes a per-pixel separation test and precomputed matrices to simulate the three main CVD phenotypes - Protanopia, Deuteranopia, and Tritanopia - using a scientifically grounded approach. This technically rigorous method significantly surpasses traditional desaturation filters, offering a more physiologically plausible representation of dichromatic vision in a VR environment. Within this immersive digital learning environment, users engage in a series of targeted, gamified pedagogical tasks. These activities include an interactive Ishihara screening test, a concentration-based memory card matching game, a color-sorting exercise, and a navigable maze. These specific game-based learning mechanics are strategically designed to translate the abstract challenges of dichromatic vision into memorable, lived interactions. By bridging immersive VR technology with digital pedagogy, EduColorVR serves not merely as an experiential learning platform, but as a critical conversational tool. The project demonstrates the profound capacity of serious games to support the early detection of visual learning barriers, encourage peer empathy through playful exploration, and promote the proactive, inclusive design of future educational materials.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5388","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5388/4809","match":1.0,"id":"01-1650-052-70","related":[]},{"day":"2026-10-01","start":"16:50","end":"17:10","room":"053","stream":"Stream C: Mini Track on Educational Escape Rooms","chair":"Panagiotis Fotaris","type":"paper","title":"Translating Design Requirements into a Hybrid Prototype for Early Programming Education: The Iterative Development of IMPACT+","authors":"Bernadette Spieler, Céline Scheier, Larissa Meyer-Baron and Janine Trütsch, Zurich University of Teacher Education, Switzerland","code":"GBL-152","flags":[],"abstract":"Teaching fundamental programming concepts to primary school children remains a challenge in computer science education. Early programming instruction must balance conceptual complexity with developmental appropriateness, as learners are expected to engage with ideas such as sequencing, loops, conditional logic, debugging and problem solving while still developing abstract reasoning strategies. This challenge is intensified by limited lesson time, diverse learner needs and the need for motivating approaches that are also pedagogically meaningful. Unplugged approaches can support collaboration, tangible manipulation and social interaction, but often require additional guidance and scaffolding. Digital tools, by contrast, can provide feedback, narrative framing and structured progression, yet may reduce hands-on engagement. The central design question is therefore not whether analogue or digital formats are superior, but which pedagogical function each format should fulfil. This paper presents the ongoing development of IMPACT+, a hybrid game-based learning project for 8- to 10-year-old children. The project introduces programming concepts through an unplugged board game extended by a digital prototype. Building on qualitative findings from an earlier classroom-based evaluation of the analogue version, the paper shows how identified design requirements were translated into concrete digital prototype features. The previous project phase highlighted the need for clearer scaffolding, stronger visual orientation, more structured progression and a motivating but carefully balanced narrative framework. Based on these findings, the digital prototype includes guided onboarding, level-based progression, visual orientation cues and narrative components that frame the programming task without replacing analogue planning. Methodologically, the study is positioned as a design-oriented follow-up within an Educational Design Research approach. The paper documents how empirical findings from the classroom evaluation of the analogue IMPACT game were translated into design requirements and prototype features. The results are relevant for researchers and practitioners designing accessible, motivating and pedagogically sound hybrid learning environments.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5356","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5356/4890","match":1.0,"id":"01-1650-053-73","related":[]},{"day":"2026-10-01","start":"16:50","end":"17:10","room":"146","stream":"Stream E: Mini Track on Learning through Game Making","chair":"Francesca Dagnino, Marcello Passarelli, and Luke West","type":"paper","title":"From Cultural Game Jams to Applied Jam Models: A Longitudinal Evaluation","authors":"Wilson Almeida, Filipe Luz and Maria Fonseca, Lusófona University, Lisbon, Portugal","code":"GBL-150","flags":[],"abstract":"This study examines four editions of the EPIC-WE Cultural Game Jams (ECGJ) organised in Óbidos, Portugal (January 2024 - May 2025), within the context of the Horizon Europe EPIC-WE project. Building upon previous studies presented at ECGBL24 and ECGBL25 (Almeida & Luz, 2024; 2025) that introduced the ECGJs and their operationalisation through the Applied Jam Model (AJM), previously designated the Applied Cultural Jam Model (ACJM), the present work analyses four consecutive implementations to evaluate and consolidate the model through longitudinal analysis. Across the four ECGJ, 146 participants, including 95 students from Lusófona University and 51 secondary school students from the Josefa d’Óbidos School, developed 40 digital game prototypes inspired by different cultural heritage themes. The design of these events was grounded in the state of the art on cultural game jams (Costa et al., 2024), informed by the Applied Jam Framework (Reid et al., 2020) together with the structured preparation practices proposed for serious game jams (Aibara et al., 2020). Through successive iterations, these principles were refined to shape preparation phases, facilitator roles and post-jam opportunities, establishing applied game jams as collaborative environments for experiential learning through game creation and extending projects beyond the game jam itself. Using a mixed-methods approach combining surveys, observational documentation, and analysis of the prototypes, the study assesses the cumulative outcomes of the four events. The results highlight how the structured practices consolidated in the AJM support collaborative design and interdisciplinary project development by integrating learning activities before, during, and after the game jam, linking preparatory activities, collaborative game creation supported by facilitators and post-jam mentoring for selected teams within a professional production context. Overall, the findings consolidate the AJM as a structured framework for applied game jams and provide the first longitudinal evaluation of the model across four consecutive implementations, while identifying key structural design principles for applied game jams in educational and collaborative contexts.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5525","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5525/4796","match":1.0,"id":"01-1650-146-79","related":[]},{"day":"2026-10-01","start":"16:50","end":"17:10","room":"21","stream":"Stream D: Evaluating Game Based Learning","chair":"Lance Bunt","type":"paper","title":"From Feedback to Features: A Two-year Comparative Study of Iterative Gamification Design in Engineering Education","authors":"Sylwia Babicz, Gdańsk University of Technology, Poland","code":"GBL-219","flags":[],"abstract":"Gamification in higher education is increasingly recognised as a promising approach to improving student engagement and long-term knowledge retention. However, evidence on the effectiveness of iteratively refined gamified systems – particularly in engineering disciplines and at scale – remains limited. This paper presents a two-year comparative study of a gamified lecture format implemented in a Metrology course at Gdańsk University of Technology, Poland, across 634 students from three degree programmes: Electronics and Telecommunications (EiT), Automatics, Cybernetics and Robotics (ACiR), and Biomedical Engineering (IBM). In the first year (2024/2025), the gamified system – titled \"The Metrological Adventures of Gabryś\" – replaced a traditional end-of-course test with a series of topic-based assignments incorporating risk-based task selection, narrative elements, and cumulative scoring. Students engaged with course material systematically throughout the semester rather than cramming before a single summative assessment. Following the first cohort, qualitative student feedback was collected and systematically incorporated into the system design for the following academic year. Key changes introduced for the second cohort (2025/2026) included enriched narrative content in the form of easter eggs embedded within assignments, the addition of optional practice tests prior to each graded task, and technical improvements to the task selection mechanism. Comparative analysis of learning outcomes reveals consistent and substantial improvement across all three programmes. Overall pass rates increased from 72.3% to 92.2% – a gain of nearly 20 percentage points. Mean scores rose from 26.3 to 31.7 points. Crucially, the distribution of results shifted markedly upward: whereas in 2024/2025 most students clustered just above the passing threshold, in 2025/2026 the majority achieved scores in the upper range, with 46% of ACiR students and 33% of EiT students reaching the top scoring bracket. These findings suggest that student-driven iterative refinement of gamified systems can yield significant and measurable improvements in learning outcomes. The study contributes empirical evidence – rarely available at this scale in the gamification literature – for the value of closing the feedback loop between students and course designers in technology-enhanced learning environments.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5170","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5170/4810","match":1.0,"id":"01-1650-21-76","related":[]},{"day":"2026-10-01","start":"16:55","end":"17:15","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Tharranos Bratitsis and Wolfgang Brabänder","type":"games-judging","title":"Biznes na medal (Business worth medal)","authors":"Mateusz Lewandowski, Jagiellonian University in Krakow, Poland","code":"Game-086","flags":["+GBL-221 Fri"],"id":"01-1655-18-177","related":["02-1220-052-119"]},{"day":"2026-10-01","start":"16:55","end":"17:15","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Rajiv Basaiawmoit and Taru Deva","type":"games-judging","title":"War of Transformation","authors":"Ming Tsui, United Christian College, Hong Kong","code":"Game-046","flags":[],"id":"01-1655-18-182","related":[]},{"day":"2026-10-01","start":"17:10","end":"17:30","room":"051","stream":"Stream A: Stories and Worlds","chair":"Allen Jones","type":"paper","title":"Designing Educational Games in Higher Education: A Convergent Mixed-methods Pilot Evaluation of an Interdisciplinary Course on Game Design","authors":"Elwira Lewandowska, University of Bielsko-Biala, Poland, Martin Kuruc, Dusan D. Brezány, Comenius University, Bratislava, Slovakia, Klára Zubková, Monika Cihlářová and Magdaléna Švecová, University of Ss. Cyril and Methodius in Trnava, Slovakia","code":"GBL-091","flags":[],"abstract":"While many studies focus on the use of games as teaching tools, fewer examine the educational value of teaching students how to design educational games themselves. The Learn to Play for the Future project addresses this gap by developing and implementing an interdisciplinary international course focused on educational game design. The main objective of the course was to develop students’ competencies in educational game design while fostering interdisciplinary collaboration and applied understanding of game-based learning principles. The course combined theoretical instruction on gamification, learning design, and game mechanics with project-based learning activities. Students worked in teams to design educational games, define learning goals and target audiences, develop gameplay mechanics, create prototypes, and conduct iterative playtesting. Both tabletop and digital game formats were explored depending on the institutional context. This paper presents a convergent mixed-methods pilot evaluation of the, said course and it combines pre- and post-course questionnaire data with reflective diaries and focus-group data in order to examine changes in students’ perceptions, motivation, and readiness, and to understand their experiences of the game design process. The findings suggest that engaging students in the design of educational games can support the development of creative problem-solving skills, interdisciplinary collaboration, and deeper understanding of the relationship between gameplay mechanics and learning objectives. Students particularly valued hands-on prototyping and playtesting with real users. However, the evaluation also identified challenges related to time constraints, the complexity of concept development, and the need for clearer project milestones. The study contributes to current discussions on integrating game design and game-based learning into higher education curricula and offers practical insights for designing interdisciplinary courses that combine pedagogy, creativity, and digital innovation.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5153","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5153/4851","match":1.0,"id":"01-1710-051-68","related":[]},{"day":"2026-10-01","start":"17:10","end":"17:30","room":"052","stream":"Stream B: VR & a Mega-Game","chair":"Matthew Daniels","type":"paper","title":"A Longitudinal Experiential Learning Design for Negotiation Education Through 谈判 Megagame","authors":"Aline Castillo and Mario Caudillo, CLeaders, Atizapan de Zaragoza, Mexico","code":"GBL-088","flags":[],"abstract":"Negotiation education requires students to move beyond conceptual knowledge and apply strategies in dynamic situations involving uncertainty, interdependence, communication, and cultural differences. This study examines the implementation of a ten-week longitudinal experiential learning sequence in an undergraduate International Business course and the role of the Tánpàn 2.0 megagame as its culminating application experience. An institutional course design was adapted so that formative simulations, role-playing exercises, oral reflections, and debriefings progressively prepared students for a sequential intercultural negotiation involving a Chinese manufacturer, a German exporter, and an Australian commercializer. Nineteen students completed identical nine-item conceptual tests before and after the megagame, with items presented in randomized order. Sixteen students completed a post-activity perception survey, and complete negotiation outcomes were recorded for six three-person teams. Mean test scores increased from 7.74 to 8.32 out of 9. A paired-samples comparison did not reach statistical significance, and high initial scores, the limited range of the instrument, and the timing of the pretest constrained interpretation. Nevertheless, all six teams completed the sequential negotiation and reached agreements, producing joint utilities between 2,534,000 and 2,880,000 simulation units. Survey responses indicated that students perceived the experience as challenging and reported applying course learning. A descriptive thematic content analysis highlighted interaction, application of concepts, continuity between negotiation phases, collaborative trade-offs, and initial difficulties understanding the multi-phase structure. The findings position the megagame as an integrative performance environment rather than an isolated source of cognitive gain. The study also demonstrates the need to align the assessment of experiential learning with observable performance, decision-making processes, and reflection rather than relying exclusively on short conceptual tests.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5194","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5194/4820","match":1.0,"id":"01-1710-052-71","related":[]},{"day":"2026-10-01","start":"17:10","end":"17:30","room":"053","stream":"Stream C: Mini Track on Educational Escape Rooms","chair":"Panagiotis Fotaris","type":"paper","title":"CSCape: A Video-based Escape Room Framework (not Only) for Computer Science","authors":"Johannes Schildgen, Regensburg University of Applied Sciences, Germany","code":"GBL-151","flags":[],"abstract":"CSCape is a software framework for interactive escape-room adventures in computer science and other disciplines. It runs on a lightweight computer, such as a Raspberry Pi, which is connected to a projector or a TV. Initially, it shows a black screen. However, when a task is completed, a video plays, and the story continues. Educators must provide video files or texts and images, and develop Python functions to verify whether a task is solved or not. Potential examples in computer science include: Is the correct data in a database or a Google spreadsheet? Is the network correctly configured? Is an application running on a specific server? Is a file or folder accessible over the network, and does it contain the correct data? Additional examples: Students fill out and submit a Google Form. This can be a multiple-choice quiz or a complex text input. The submitted data is checked with Python. CSCape can be combined with real-world puzzles and items within the room. For instance, a character in the video might say that you need to solve a mathematical calculation. The solution is a 3-digit code that opens a combination lock. Behind that lock is a note on a paper and a USB stick containing data that needs to be imported into a database. After that, the next video is shown. Players solve tasks either on their own notebook or phone, or on pre-configured computers, all without supervision. The software sends push messages to the educator’s phone to inform them about the team’s current game progress. Furthermore, Wi-Fi smart plugs can be integrated to control lights and other devices, allowing them to be powered on and off when a task is completed. CSCape is designed to achieve a wide range of learning objectives, including technical skills, creativity, problem-solving, teamwork, and the ability to work under time pressure. Through storytelling, interactive challenges, and real-world puzzles, it sparks curiosity and sustains motivation, making learning not just effective but fun. The framework is open-source and easily customizable. Escape-room games can be played by people of all ages, from children to adults, and are adaptable for use in computer science and other academic disciplines.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5431","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5431/4883","match":1.0,"id":"01-1710-053-74","related":[]},{"day":"2026-10-01","start":"17:10","end":"17:30","room":"146","stream":"Stream E: Mini Track on Learning through Game Making","chair":"Francesca Dagnino, Marcello Passarelli, and Luke West","type":"paper","title":"Designing Educational Games as a Learning Experience for Pre-Service Mathematics Teachers","authors":"Peter Vankúš and Katarína Kalužná, Comenius University in Bratislava, Bratislava, Slovakia","code":"GBL-087","flags":[],"abstract":"The design of educational games represents a promising approach to engaging pre-service teachers in active learning about mathematics teaching. Rather than relying solely on ready-made games, the process of designing educational games may foster deeper reflection on mathematical content, student learning, and instructional design. Through the process of creating a game, pre-service mathematics teachers must consider not only the mathematical concepts to be addressed but also the rules, structure, and dynamics that support meaningful learning through play. Such design activities may therefore serve as opportunities for developing pedagogical and didactic thinking during teacher preparation. This paper explores how pre-service mathematics teachers perceive the experience of designing educational games as part of their teacher education at the Faculty of Mathematics, Physics and Informatics, Comenius University Bratislava. The participants were university students enrolled in a mathematics teacher preparation program who had designed an educational game intended for teaching mathematics at the lower or upper secondary school level. The participants engaged in designing educational games during the course Game-Based Mathematics Teaching. Data were collected through an open-ended questionnaire that invited participants to reflect on their experiences during the design process, including the challenges they encountered, the decisions they made, and what they believed they had learned from the activity. The responses were analyzed using thematic analysis in order to identify recurring themes in students’ reflections on the design process and its perceived educational value. The study aims to contribute to a better understanding of how designing educational games can function as a learning experience in the preparation of pre-service mathematics teachers and how such activities may support reflection on instructional design and student learning. The findings provide insights into the potential of game design activities as a component of mathematics teacher education and inform the integration of similar design-based learning tasks into teacher preparation programmes.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5173","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5173/4901","match":1.0,"id":"01-1710-146-80","related":[]},{"day":"2026-10-01","start":"17:10","end":"17:30","room":"21","stream":"Stream D: Evaluating Game Based Learning","chair":"Lance Bunt","type":"paper","title":"Exploratory Study of the Relationship Between HEXAD Player Types and Cognitive Learning Objectives","authors":"Sarah Hase, Neu-Ulm University of Applied Sciences, Germany","code":"GBL-213","flags":[],"abstract":"Introduction and Aim Despite the widespread practical application of gamification in education, existing empirical evidence of its effectiveness often lacks a theoretical foundation. In particular, there is a lack of systematic analysis of specific learning outcomes in relation to cognitive complexity, without taking modern taxonomies into account. The aim of this study is to identify initial trends regarding behavior in a gamified learning environment and to explore the extent to which there is a systematic relationship between the individual gamification player types of the HEXAD model and the attainment of different cognitive learning levels according to the taxonomy of Anderson and Krathwohl. Methods The study employs a mixed-methods approach (explanatory sequential design). In the first quantitative phase (n = 12), participants complete a gamified online test via LimeSurvey. The instructional design is based on the taxonomy developed by Anderson and Krathwohl, while the gamification draws on insights from Krath and von Korflesch. The data is analyzed using descriptive and exploratory statistics (IBM SPSS). Specific research questions are derived from these results to provide a deeper explanation of the quantitative findings for the second qualitative phase of guided interviews (n = 7; analyzed via Atlas.ti). Finally, the quantitative and qualitative data are triangulated in a joint display. Results The analysis reveals differences in learning outcomes depending on player type and cognitive complexity. Players and Achievers perform better on tangible learning objectives. However, the performance curve for Players declines as cognitive complexity increases. Philanthropists, on the other hand, demonstrate their strength in analytical, subjective, and evaluative tasks and show a continuous upward trend in meaningful, content-rich challenges. Socialisers exhibit consistent performance on tasks of moderate complexity, but a drop in performance when it comes to evaluation. Additionally, a crossover effect from Players to Philanthropists can be observed when it comes to evaluative goals. Conclusion The results suggest a task-specific relationship between individual characteristics of the HEXAD player types and learning success at various cognitive levels. It can therefore be concluded that future game-based learning applications should be explicitly tailored to the specific game design elements and cognitive requirements of the respective player types. To verify these exploratory findings, it is recommended that follow-up studies be conducted with a larger sample size over a longer observation period.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5312","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5312/4838","match":1.0,"id":"01-1710-21-77","related":[]},{"day":"2026-10-01","start":"17:15","end":"17:35","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Tharranos Bratitsis and Wolfgang Brabänder","type":"games-judging","title":"Programme Dilemme","authors":"Pauline Georg, Association pourla Fondation Crésus, France","code":"Game-091","flags":[],"id":"01-1715-18-178","related":[]},{"day":"2026-10-01","start":"17:15","end":"17:35","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Rajiv Basaiawmoit and Taru Deva","type":"games-judging","title":"Deadly Microbes","authors":"Mohamad Izwan Bin Ismail and Nur Ain Abu Bakar, Universiti Teknologi MARA Malaysia","code":"Game-069","flags":[],"id":"01-1715-18-183","related":[]},{"day":"2026-10-01","start":"17:35","end":"17:55","room":"18","stream":"Game Judging: Fully developed games (judging panel 1)","chair":"Judges: Tharranos Bratitsis and Wolfgang Brabänder","type":"games-judging","title":"Casa Project","authors":"Sollyvan Rangel Mazziolli, Instituto Federal de Educação, Ciência e Tecnologia do estado do Espírito Santo Brasil","code":"Game-016","flags":[],"id":"01-1735-18-179","related":[]},{"day":"2026-10-01","start":"17:35","end":"17:55","room":"18","stream":"Game Judging: Fully developed games (judging panel 2)","chair":"Judges: Rajiv Basaiawmoit and Taru Deva","type":"games-judging","title":"Threads of Time: The Fashion Heist","authors":"Shivangi Gaikwad, University of Brighton, UK","code":"Game-088","flags":[],"id":"01-1735-18-184","related":[]},{"day":"2026-10-01","start":"18:00","end":"19:00","room":"Darmstadt Shop, Luisencenter","stream":"","chair":"","type":"social","title":"Pre-dinner walking tour: Darmstadt at a glance","authors":"","code":"","flags":["pre-booked"],"id":"01-1800-DarmstadtShop,Luisencenter-81","related":[]},{"day":"2026-10-01","start":"19:30","end":"22:30","room":"Braustübl, Goebelstraße 7","stream":"","chair":"","type":"social","title":"Conference dinner","authors":"","code":"","flags":[],"id":"01-1930-Braustübl,Goebelstraße7-82","related":[]},{"day":"2026-10-02","start":"09:00","end":"09:20","room":"051","stream":"Stream A: Literacy and Digital Literacy","chair":"Russell Richards","type":"paper","title":"Playing with Misinformation: A Game-Based Approach to Children's Critical Digital Literacy","authors":"Patricia Lyk and Jonas Blom, University of Southern Denmark, Odense, Denmark","code":"GBL-048","flags":[],"abstract":"In an increasingly complex digital information environment, children encounter both reliable and misleading content on social media at an early age. While recent research has explored game-based interventions addressing misinformation, most existing approaches target adolescents or adults. Younger schoolchildren remain an underexplored audience in this field. This paper presents the design rationale and early development of a role-based classroom game developed as part of the interdisciplinary SafeChilDe project (Safeguarding Children’s Democratic Agency). The game targets children aged 10–12 and simulates key dynamics of social media through four complementary roles: journalists, influencers, misinformation creators (“fake makers”), and fact-checkers (“detectives”). By assigning players different roles in producing and analysing social media content, each guided by distinct underlying motives, the design enables children to explore how textual, paratextual, and contextual cues shape credibility assessments in digital content. The learning design is grounded in critical digital literacy and experiential learning. Rather than focusing solely on inoculation against misinformation, the game aims to balance critical alertness with constructive trust in reliable information. The role-based structure allows players to experience how different actors in digital information environments operate with different goals, strategies, and communicative practices. The paper documents the design and development process of the game, from early concept exploration and prototyping to the development of a digital prototype. The design process follows an iterative approach, combining concept development, low- and mid-fidelity prototyping, and early testing. Children are involved in the development process, both in iterative playtesting and in selected production elements, such as contributing voice recordings used in the game. These activities provide insights that inform the refinement of gameplay mechanics, role dynamics, and usability in classroom settings. By documenting this process, the paper contributes design insights into how role-based classroom games can support children’s critical engagement with digital information and how game mechanics can be structured to make complex media literacy concepts accessible for younger learners.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/4930","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/4930/4855","match":1.0,"id":"02-0900-051-83","related":[]},{"day":"2026-10-02","start":"09:00","end":"09:20","room":"052","stream":"Stream D: Health Games and Puzzles","chair":"Jerome Legrix-Pagès","type":"paper","title":"Tech4Seniors: A Gamified Challenge-based Learning Experience Integrating Design Thinking and IoT","authors":"Claudia Solis and Cristina Gonzalez, Tecnologico de Monterrey, Mexico","code":"GBL-161","flags":[],"abstract":"This paper presents Tech4Seniors, a short, intensive learning experience that engages engineering students in developing Internet of Things (IoT) solutions to real-world challenges faced by senior citizens. The activity combines Design Thinking and game-based learning principles within a structured, mission-based format, with students working in teams to progress through iterative stages of problem definition, ideation, prototyping, and evaluation. A key aspect of the experience is its focus on user-centred design. Before the in-class session, students interviewed older adults and worked with UX personas representing sensory, mobility, cognitive, or security-related challenges. These insights informed the development of functional prototypes using IoT components and rapid-prototyping materials. The activity was implemented with undergraduate students in a technology-oriented course and evaluated using a mixed-methods approach, including post-activity surveys (n = 52), expert assessment of final prototypes, and qualitative reflections. Two team-formation strategies—random assignment and leader-selected teams based on prior technical experience—were also examined. Results consistently show high levels of student engagement, perceived learning, collaboration, and the development of empathy. Students reported strong alignment between identified user needs and proposed solutions, and expert evaluations confirmed the prototypes' overall quality and feasibility. No meaningful differences were observed between the two team formation strategies. These findings suggest that short, structured, and game-oriented learning experiences can effectively support both technical and human-centred skills in engineering education, particularly when grounded in real-world user contexts. The paper offers a replicable model and practical insights for designing empathy-driven, game-based learning activities.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5200","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5200/4889","match":1.0,"id":"02-0900-052-86","related":[]},{"day":"2026-10-02","start":"09:00","end":"09:20","room":"053","stream":"Stream C: Non-Digital Games","chair":"Nadine Stecher","type":"paper","title":"Interactive Signalling Laboratory: A Physical Serious Game for Railway Operations Education","authors":"Martin Scheidt, Hochschule Darmstadt, Germany and Julek Weck, TU Braunschweig, Germany","code":"GBL-008","flags":["+G7"],"abstract":"Railway operations are a complex socio-technical system shaped by state-based logic, relational dependencies, and temporal constraints that are difficult to visualise. Many core principles remain implicit and are only indirectly accessible through regulations, diagrams, or operational rules, which makes railway operations difficult to teach. Conventional teaching approaches often reach their limits when conveying such dynamic, interdependent systems. Although digital railway simulations are widely used, they primarily support individual interaction through abstract interfaces. There is still a need for collaborative, haptic learning environments that encourage shared reasoning and make implicit operational knowledge visible. Therefore, this paper introduces the Interactive Signalling Laboratory (SigLab), a physical serious game based on a modified wooden railway. It teaches railway operations through the interplay of vehicles, signalling, and infrastructure. SigLab applies a discrete abstraction of a continuous system, with speed represented as track segments per round. This serves a didactic purpose by making principles discussable that would be harder to observe in a continuous simulation. Its core didactic principle is collaborative gameplay, requiring learners to operate the system jointly and negotiate terminology, thereby rendering otherwise invisible rules tangible. Because state updates are performed stepwise on local track segments in fixed rounds, SigLab can be interpreted as behaving like a cellular automaton. Physical interaction is assumed to support the externalisation and negotiation of tacit mental models. However, systematic documentation of physical game-based approaches in this domain remains limited. To address this gap, SigLab is presented as a practice-based case study refined over seven years. Practice-based insights suggest that SigLab supports shared concept formation, improves system-level understanding, intensifies peer-to-peer dialogue, and fosters systematic reasoning about operational processes. Learners must articulate assumptions and resolve conflicts collaboratively. Open challenges remain regarding model granularity, scalability, and assessment integration. The paper contributes design insights for physical serious games in higher education. It identifies the need for systematic evaluation and outlines next steps toward empirical validation, aiming to inform future work on game-based learning for complex, rule-driven systems.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/4895","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/4895/4882","match":1.0,"id":"02-0900-053-89","related":["01-1020-18-138"]},{"day":"2026-10-02","start":"09:20","end":"09:40","room":"051","stream":"Stream A: Literacy and Digital Literacy","chair":"Russell Richards","type":"paper","title":"Playing About, Through and with Language. Two Educational Games to Explore Endangered Languages and Language Change: Phonetics Pursuit and Ludolecte","authors":"Christopher Gledhill, Université Paris Cité, France, Florian Delcourt, Ikigai Games, Paris, France and Amélie Elmerich Université Sorbonne Nouvelle, Paris, France","code":"GBL-025","flags":[],"abstract":"There has been some research on language skills from the point of view of games-based learning (GBL) (Hung et al. 2018; Xu et al. 2020). However, there are very few studies in GBL on linguistics, and very few educational games that focus on the language sciences. In this paper, we argue that this is a missed opportunity. There are many linguistic topics that would benefit from the GBL approach: Where do individual accents come from? What are the different ways in which words change meanings? What happens to the language system when it comes into contact with other languages or becomes endangered? In the first part of this paper, we present a survey of linguistics-oriented games on BoardGameGeek (BGG). We then propose a framework for analysing the semiotic relationship between games and language, based on systemic functional linguistics (Martin & Rose 2008). In the final part of this paper, we present two game designs that harness the different dimensions of this framework to teach different linguistic concepts: (i) Phonetics Pursuit , a quiz game on endangered Sino-Tibetan languages with a focus on phonetics, linguistic typology, and geography, and (ii) Ludolecte , a card-based role-playing game in which an isolated community creates neologisms and imagines different semantic trajectories for them. These games have yet to be play-tested, so we cannot present any evaluation data. Instead, this is a design rationale paper which discusses how technical concepts in linguistics can be translated into coherent game mechanics while remaining faithful to the epistemological requirements of game-based learning (Reinhardt & Thorne 2020; Sorrentino 2025).","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5133","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5133/4831","match":1.0,"id":"02-0920-051-84","related":[]},{"day":"2026-10-02","start":"09:20","end":"09:40","room":"052","stream":"Stream D: Health Games and Puzzles","chair":"Jerome Legrix-Pagès","type":"paper","title":"A Serious Game Series for Learning NICU Care","authors":"Yukihide Miyosawa, Noa Takeda, Yu Miyazaki, Shunki Ando, Yasutaka Kimura and Yu-ko Miyosawa, Shinshu University School of Medicine, Matsumoto, Japan","code":"GBL-035","flags":[],"abstract":"Opportunities for medical and nursing students to experience neonatal intensive care unit (NICU) environments are limited by patient safety concerns and the complexity of neonatal care. Narrative-based serious games offer a route to vicarious clinical experience, yet the reasons why narrative should support learning in this particular setting are rarely made explicit, and educational content covering the transition from hospital to home remains scarce. This paper reports a two-phase, learner-driven design study conducted in Japan. In Phase 1 we developed and released “First Steps in the NICU: Discovery Edition” (First NICU), a six-chapter narrative visual novel; its development and its acceptance among the first 160 players have been reported previously. Here we present a previously unreported needs analysis drawn from the same voluntary post-game survey, now extended to 180 respondents (82 healthcare professionals or students, 98 members of the general public). Asked which topics future serious games should address, 105 of 180 respondents (58.3%) selected home support for children with medical complexity and 87 of 180 (48.3%) selected discharge support from the NICU, with school attendance for such children selected by 88 of 180 (48.9%); 144 of 180 (80.0%) selected discharge or home support, or both. Asked which scenes were most memorable, 82 of 180 (45.6%) named the brief discharge-support episode set in the general care unit, although it is one chapter of six and contains no acute clinical event. These learner-identified priorities directly informed Phase 2, the ongoing development of “First Steps in the NICU 2: Discharge Support Edition”, which simulates multidisciplinary discharge planning, parent education for home medical care and coordination with community services, and which introduces interactive mini-games for procedural tasks. We set out how each Phase 2 design decision was derived from Phase 1 findings and from narrative learning theory, and discuss what this sequence suggests for designing narrative serious games that span a care continuum. Because no objective assessment of learning was undertaken, the evidence reported here concerns acceptance and learner-expressed priorities rather than educational effectiveness.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5432","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5432/4864","match":1.0,"id":"02-0920-052-87","related":[]},{"day":"2026-10-02","start":"09:20","end":"09:40","room":"053","stream":"Stream C: Non-Digital Games","chair":"Nadine Stecher","type":"paper","title":"Market Forces: Playing with Risk in Business Planning for Games","authors":"Kristina Risley, Vanissa Wanick, Chris Buckingham, Adam Procter University of Southampton, UK, Michael O'Brien and Matthew Daniels, University of Limerick, Limerick, Ireland","code":"GBL-064","flags":["+G","uncertain"],"abstract":"Business planning within undergraduate games programmes is frequently taught through lectures, worksheets and written submissions. Strategic decision-making in indie games studios, however, is inherently systemic, shaped by studio identity, founder capability, market conditions and constrained resources. While students can often articulate concepts such as market positioning, resource allocation and marketing strategy in isolation, they may struggle to understand how these elements interact under uncertainty. This paper presents Market Forces, a tabletop serious game designed to make these interdependencies visible and negotiable within a Business Planning for Games module in a BA Games Design course. The game places students in studio leadership teams and asks them to respond to industry risks such as funding delays, market saturation and operational strain. Decisions are evaluated through a mitigation test requiring alignment between studio identity, available strengths and chosen strategy, with viability gained or lost according to the coherence of the group’s reasoning. Drawing on experiential and social-constructivist principles, this intervention allows students to experiment with real-world trade-offs in a psychologically safe environment while embedding evaluative criteria directly within gameplay. Implemented within undergraduate classroom delivery, practice-based observations suggest that students engage more readily and collaboratively in negotiated strategic reasoning and demonstrate clearer alignment between studio identity, capability and decision-making than in previous seminar-style iterations. This paper contributes practice-informed insight into serious games for professional skill development and demonstrates how purpose-built interventions can embed the practical demands of early-stage studio planning within games design curricula.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5134","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5134/4877","match":1.0,"id":"02-0920-053-90","related":[]},{"day":"2026-10-02","start":"09:40","end":"10:00","room":"051","stream":"Stream A: Literacy and Digital Literacy","chair":"Russell Richards","type":"paper","title":"Challenges of Simulations and Serious Games Embedded in Emergency-Preparedness Platforms and Ecosystems for Educational Use","authors":"Ilona Heldal, Rashika Tasnim Keya, Daniel Patel and Tord Frøland, Western Norway University of Applied Sciences, Bergen, Norway","code":"GBL-185","flags":[],"abstract":"Simulations and serious games (SSGs) are promising for use in emergency preparedness training, but the challenges of developing them are fundamentally different from those faced in educational use. This paper clarifies this difference by examining an ecosystem including four technology platforms that incorporate SSGs for emergency preparedness (EP) at universities. The paper identifies challenges for SSGs included in platforms and at the ecosystem level, as well as educational challenges, through a multiple-case study involving three engineering courses. We demonstrate how parts of the ecosystem can be integrated into education through collaboration with teachers, the identification of specific observation points aligned with curricular entry points, and the use of selected platform elements. Based on this study, we outline a conceptual framework that shows how design, development, and educational use of SSGs are distinct activities that require different skills for successful use. The results illustrate how the SSGs' technical, systemic, and platform-specific requirements should align with the EP needs outlined by the ecosystem’s structure. Future research should explore how this approach can be validated and used in other educational settings.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5378","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5378/4839","match":1.0,"id":"02-0940-051-85","related":[]},{"day":"2026-10-02","start":"09:40","end":"10:00","room":"052","stream":"Stream D: Health Games and Puzzles","chair":"Jerome Legrix-Pagès","type":"paper","title":"Puzzle, World, Trust: Interactive Fiction Heuristics for Lesson Design","authors":"Heiko Albrecht Spies, Nordpfalzgymnasium Kirchheimbolanden, Germany","code":"GBL-172","flags":[],"abstract":"Games-based learning (GBL) research has shown that well-designed games can support motivation and learning across educational contexts. Less attention, however, has been paid to the design principles that make problem spaces fair, worlds coherent, and participation trustworthy. This conceptual paper asks how core principles of interactive fiction (IF) design can inform lesson planning and instructional design. The paper develops a theoretical framework that maps central IF design principles—puzzle fairness, world-model consistency, narrative framing, graduated hinting, and player trust— onto constructs from didactic theory and learning psychology, including scaffolding, flow, situated learning, selfdetermination, and cognitively activating tasks. On this basis, it identifies recurring structural convergences between good IF design and good teaching. These convergences include difficulty calibration, inferability, contextual coherence, learner autonomy, and the design of problem spaces that make insight possible. A central claim of the paper is that the educational value of IF design lies not primarily in turning lessons into teacher-independent artefacts, but in making the anticipated learner pathway through a task visible. From this perspective, IF-inspired playtesting offers a productive model for instructional planning. It helps reveal where learners are likely to hesitate, misread a situation, pursue unproductive interpretations, or stall, and where prior-knowledge reactivation, sub-goals, hints, or contextual cues must therefore be designed in advance. The paper also addresses a key asymmetry between the two domains. Teachers can respond adaptively to learners in real time, whereas IF authors must anticipate breakdowns in advance and compensate through iterative testing. Rather than weakening the analogy, this difference sharpens it by making the anticipatory design work embedded in lesson planning more explicit. The paper contributes a design-oriented heuristic framework for lesson and task design, a playtesting-informed account of the learner pathway as an object of instructional planning, and a principled critique of superficial gamification approaches that add reward mechanics without corresponding design rigour. It concludes by outlining implications for teacher professionalisation and future empirical research.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5404","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5404/4894","match":1.0,"id":"02-0940-052-88","related":[]},{"day":"2026-10-02","start":"09:40","end":"10:00","room":"053","stream":"Stream C: Non-Digital Games","chair":"Nadine Stecher","type":"paper","title":"Phosob: A Game-based Learning Board Game Inspired by the Lanna Rice Goddess","authors":"Krittiya Saksrisathaporn, Khongthat Thongphun and Ekkarat Boonchieng, Chiang Mai University, Chiang Mai, Thailand","code":"GBL-123","flags":[],"abstract":"The Lanna Kingdom of northern Thailand is renowned for its distinctive culture, traditions, and beliefs, many of which are closely connected to rice cultivation. Transferring this cultural knowledge to younger generations is important for preserving local heritage and promoting understanding of its cultural and spiritual significance. This study presents the design, development, and evaluation of Phosob, an educational board game inspired by Mae Phosop, the Rice Goddess in Thai folklore, and designed with a Lanna retro theme. The game integrates cultural storytelling, four rice varieties, resource management, and strategic gameplay to support learning about Lanna rice culture and related beliefs. A design-based approach was adopted to guide the iterative development and evaluation of the game. The prototype supports two to four players and was evaluated with 36 undergraduate students aged 17–24 years, organised into nine playtesting groups. Participants played three consecutive rounds before evaluating the game. The evaluation covered three dimensions: Design and Aesthetics, Game Capability, and Learning and Cultural Promotion, using a five-point Likert scale and open-ended feedback. Results showed positive player perceptions of the core gameplay experience, with all Game Capability items receiving more than 80% positive responses and game uniqueness receiving 86.49%. Perceived educational and cultural value was also high, particularly for promoting awareness of Lanna rice (96%) and supporting learning about rice (100%). However, Design and Aesthetics received comparatively moderate ratings, and player feedback identified issues concerning visual differentiation, component complexity, gameplay balance, and reliance on random mechanisms. These findings suggest that Phosob has potential as a game-based learning tool for communicating Lanna rice culture while identifying areas for further design refinement. As the present evaluation focused on player perceptions rather than on objective knowledge gain, future work will employ pre- and post-test assessments with larger, more diverse samples. A digital version will also be explored to broaden accessibility and educational impact.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5342","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5342/4878","match":1.0,"id":"02-0940-053-91","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Poster Presentations, Game Showcase and Refreshments in Lobby and Room 146","authors":"","code":"","flags":[],"id":"02-1000-all-92","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"From Blocks to Code: A Game-based Modding Workshop for Bridging Programming Paradigms","authors":"André Matutat, Benjamin Franke, Birgit Christina George, Jörg-Michael Keuntje and Carsten Gips University of Applied Sciences and Arts (HSBI), Germany","code":"GBL-101","flags":["poster","WIP"],"abstract":"This paper presents the design and first matched evaluation of the Advanced-Dungeon, the most demanding stage of a multi-level, narrative-driven workshop concept that guides learners from block-based to text-based and finally to authentic, project-scale programming within a shared open-source 2D dungeon environment. The transition between visual and textual programming is a well-documented barrier in early computer science education, and existing approaches address only the first step or treat constructionist game-making as a Scratch-only activity, which limits the reachable concepts. The Advanced-Dungeon engages pupils aged 15 to 17 in open-ended problem-solving directly within the game's source code. They read, debug, and extend a real Java codebase, implement algorithms such as pathfinding and sorting, and build Portal-inspired puzzles that require vector arithmetic and angle calculations. Two introductory formats, the Blockly-Dungeon and the Java-Dungeon, share the same game world and prepare learners for this final stage. Across all Advanced-Dungeon iterations, 36 learners completed the pre-survey and 29 the post-survey. Participants reported high enjoyment (M=4.52 on a 1 to 5 scale), rated the difficulty as appropriate, and wanted to attend further workshops. In open answers they highlight modifying real game code as the most rewarding part and name concrete gains in arrays, vectors, and abstract classes. An individually matched analysis (n=10 pairs) refines earlier results: where individual change can actually be measured, programming interest is stable rather than rising. All workshop materials and the dungeon environment are available as open educational resources and open-source software.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/4962","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/4962/4939","match":1.0,"id":"02-1000-all-93","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Two Types of Models in One Learning Space: A Conversation Between Political Science Theories and Board Games","authors":"Julian Eckl, University of St. Gallen, St. Gallen, Switzerland","code":"GBL-103","flags":["poster","poster only"],"id":"02-1000-all-94","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Estimating Cognitive Load via Process-based Telemetry for Adaptive Serious Games","authors":"Tobias Baumeister and Mark Oude Elberink, Friedrich-Alexander-Universität, Erlangen, Germany","code":"GBL-215","flags":["poster","WIP"],"abstract":"Traditional cognitive load measures interrupt gameplay: the NASA-TLX requires time to complete, physiological sensors demand lab conditions. Neither integrates cleanly into a serious game session. This study tests whether sixteen process-based interaction metrics, captured automatically through in-game telemetry, can track perceived cognitive load without interrupting play. Thirty university students played LUTLAB (a puzzle-based serious game for learning FPGA hardware concepts) across ten levels. The game's telemetry logged mouse movement speed and distance, movement pause patterns (contemplation and hesitation frequencies, pause ratios), duplicate game states, test-button and tool usage, click frequency and burstiness, help-seeking behavior, and dwell time in task rooms. Players completed the Raw Task Load Index (Raw-TLX) after each level. Spearman rank correlations were computed between every metric and Raw-TLX scores across 150 level-observations. One metric held up: dwell time in task rooms correlated with perceived load at (ρ = 0.48–0.66, all p < 0.01) in every one of the five analyzed levels. Active mouse movement speed reached stronger correlations in individual levels (up to ρ = −0.67 in an extended analysis) but did not hold globally. Duplicate game states and contemplation pause frequency predicted load primarily in Level 3, the first level where players could freely interact with game elements. Most metrics showed weak or no correlation with Raw-TLX scores. What this means for adaptive game design is direct: there is no single behavioral signal that works uniformly across all task types. A metric's predictive value is tied to the structure of the specific task, not to any general property of the metric itself. Cognitive load indicators cannot simply be applied across an entire game; they must be selected and validated within the context of each module. This study provides systematic empirical evidence for this context-dependency across multiple levels of the same game, establishing a basis for task-aware behavioral sensing in adaptive serious games.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5489","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5489/4934","match":1.0,"id":"02-1000-all-95","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Pedagogy in the Making: Exploring Educator Game Jams as Constructionist Professional Development","authors":"Kate (Katya) Schmidt Sullivan, Heriot-Watt University, Edinburgh, UK and Keegan Schmidt Sullivan, Rogues Academy, Edinburgh, UK","code":"GBL-081","flags":["poster","poster only"],"id":"02-1000-all-96","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Inventory of Digital Game-based Learning Practices for Chemistry Education: A Systematic Review","authors":"Maxime Hansen and Vincent Natalis, University of Liège, Belgium","code":"GBL-241","flags":["poster","WIP"],"abstract":"In the field of chemistry education research, a large body of literature explores the use of game-based approaches to teach scientific concepts. However, this corpus primarily focuses on the use of educational games in classroom settings, sometimes without investigating their quality or reporting variables measured among students (Hu et al. , 2022; Xu et al. , 2025). Several synthesis works have offered broader overviews of the use of games in chemistry education (Byusa, Kampire and Mwesigye, 2022; Hu et al. , 2022; da Silva et al. , 2025; Xu et al. , 2025; Elmali, Freund and Tiemann, 2026). However, as those papers used a general perspective on games in chemistry education, more specific game types, media types or chemistry learning concepts have not been investigated. Inconsistencies in methodology are highlighted, such as confusion between game-based learning and gamification approaches (Becker, 2021; da Silva et al. , 2025; Elmali, Freund and Tiemann, 2026), leading to inclusion of gamification studies in game-based learning focused papers. In addition, methodological frameworks for systematic reviews, such as the Preferred Reporting Items for Systematic reviews and Meta-Analyses (PRISMA), are only described in three of those works. This led to the hypothesis that this field of research could benefit from a more clearly defined categorisation of game-based approaches (Elmali, Freund and Tiemann, 2026) and from the study of the mechanisms behind learning with games (Hu et al. , 2022). Therefore, a systematic review (with or without meta-analysis) focusing on digital game-based learning is considered. Using the PRISMA framework, we explored three databases (ERIC, SCOPUS, and EBSCO) and two journals (JCE and CERP). A total of 2242 records were retrieved for initial screening. Articles were retained if they explicitly mentioned a game approach and chemistry education in their title or abstract. As this is the current stage of this research, eligibility and data analysis will take place in the future.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5441","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5441/4936","match":1.0,"id":"02-1000-all-97","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"An Educational Snakes and Ladders Game for Primary Education: A Classroom Experiment","authors":"Edith Debrenti, Partium Christian University, Oradea, Romania","code":"GBL-134","flags":["poster","WIP"],"id":"02-1000-all-98","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Exploring Student Perspectives and Critical Reflection on GenAI in Serious Game Design","authors":"Luke West, University of Tübingen, Tübingen, Germany and Ann-Kathrin Steiner, University of Tübingen, Tübingen, Germany","code":"GBL-030","flags":["poster","poster only"],"id":"02-1000-all-99","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Misión Korex: A Gamified System to Promote Physical Activity in Childhood Contexts","authors":"Teresita Reymond Ochagavía and Patricia Manns Gantz Pontificia Universidad Católica de Chile, Santiago, Chile","code":"GBL-001","flags":["poster","WIP"],"abstract":"Childhood obesity and physical inactivity represent critical public health challenges in Chile. More than half of primary school students present excess weight, with a significant proportion classified as obese, while only 16.5% of children aged 5–17 are considered physically active and 48.4% are classified as inactive. Despite policy frameworks that mandate increased daily physical activity in schools, most institutions lack practical tools to implement these requirements within existing routines, generating a persistent gap between formal expectations and everyday practice. This paper presents Misión Korex, a gamified system that promotes physical activity among early primary school students (ages 6–8) by integrating wearable technology, immersive narrative, and collaborative game dynamics into everyday contexts. The system operates through three interdependent components: a movement-tracking wearable, a school-based data station, and a collective narrative in which students generate energy through physical activity to achieve shared goals. By embedding movement into existing daily moments—such as transitions, break times, and commuting—the system reduces implementation barriers without requiring substantial infrastructure investments or curriculum modifications, enabling scalable adoption in diverse school contexts. Developed through a design-led research approach, Misión Korex has evolved through iterative prototyping, co-design with interdisciplinary experts, and preparation for a real-world validation pilot in a public school setting. The system is designed to foster intrinsic motivation, collective engagement, and sustained participation, while generating objective data on physical activity patterns that can inform decision-making at both school and system levels. This study contributes to the field of Game-Based Learning by extending its application beyond academic learning into the domain of health and wellbeing. It presents a scalable and context-sensitive approach to embedding physical activity into children’s everyday environments, while supporting the development of evidence-based strategies for long-term behaviour change.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5188","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5188/4942","match":1.0,"id":"02-1000-all-100","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"A Scalable, Modular Architecture Enabling Digital Teacher-defined Mobile Escape Rooms","authors":"Fabian Wagner, Miran Jank, Markus Petz and Jürgen Konrad, University of Applied Sciences Technikum Wien, Vienna, Austria","code":"GBL-047","flags":["poster","WIP"],"abstract":"Educational escape rooms offer promising opportunities for increasing engagement and active learning in STEM education, but existing solutions are often based on predefined scenarios and provide limited flexibility for adaptation to different learning objectives and classroom contexts. This paper presents DIETER (DIgital EducaTional Escape Room), a modular framework that enables teachers to create customized mobile escape room experiences by combining reusable digital mini-games and external learning activities. The framework aims to shift scenario configuration from developers to educators, allowing learning activities to be adapted to different classroom settings and difficulty levels. This work-in-progress paper introduces the underlying concept and architecture of DIETER and outlines its planned evaluation with teachers and students. The evaluation will investigate the framework’s usability, acceptance, learner engagement, and pedagogical potential in classroom contexts. By supporting teacher-defined and reusable escape room configurations, DIETER aims to provide a flexible and scalable approach to game-based learning in STEM education.","keywords":[],"paper_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/view/5408","pdf_url":"https://papers.academic-conferences.org/index.php/ecgbl/article/download/5408/4945","match":1.0,"id":"02-1000-all-101","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Cycle2Race - digital slot car racing system with an ergometer","authors":"Simon Weiss, TU Darmstadt, AG Serious Games, Darmstadt, DE and Stefan Göbel, TU Darmstadt, Germany","code":"GBL-180","flags":["poster","poster only"],"id":"02-1000-all-102","related":[]},{"day":"2026-10-02","start":"10:00","end":"11:00","room":"","stream":"","chair":"","type":"showcase","title":"Designing for Early Civic Agency: A Board Game for Civic Engagement in Kindergarten","authors":"Despoina Batziou and Tharrenos Bratitsis, University of Western Macedonia, Florina, Greece","code":"GBL-217","flags":["poster","WIP"],"abstract":"Preparing young learners for global and local challenges requires innovative pedagogical tools that foster civic agency from an early age. Cultivating these citizenship skills during early childhood is crucial for developing critical thinking, social responsibility, and democratic participation. In Greece, this need is addressed by the curriculum \"Civic Actions\" (Δράσεις του Πολίτη), which integrates the United Nations 17 Sustainable Development Goals (SDGs) across all educational levels, including kindergarten. Concurrently, international literature identifies civic engagement—encompassing activism, volunteerism, and social innovation—as vital for community well-being. However, translating these multi-dimensional, abstract concepts for preschool children presents a significant instructional challenge. This work-in-progress paper introduces the theoretical foundation and pedagogical development of an original educational card game. The project bridges global sustainability goals with local civic action, tailored for kindergarten classrooms. The game’s architecture synthesizes a dual framework: the 17 SDGs of the 2030 Agenda and the nine dimensions of civic engagement defined by Illinois State University. Adopting a holistic, socio-critical approach, the design focuses on fostering political participation and civic education, ensuring children learn to become informed citizens who understand local government. In this card game, children engage with scenarios concerning real-world community problems, such as public space accessibility and environmental care. Through specialized action and challenge cards, players must actively negotiate, collaborate, allocate virtual resources, and strategically execute community projects. This interactive gameplay allows them to practice democratic problem-solving, gather public support, and ultimately elect the most suitable mayor for their city, making local governance concepts completely tangible for young learners. At this stage, the game is completed and is currently undergoing an expert review phase by active educators to assess its pedagogical suitability. The immediate next phase involves conducting a pilot implementation in k
